name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package dry run
        run: npm pack --dry-run --ignore-scripts
      - name: CLI smoke test
        run: node bin/jsm-hq.mjs --version && node bin/jsm-hq.mjs --help
