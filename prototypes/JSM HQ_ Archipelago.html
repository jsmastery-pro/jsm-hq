<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSM HQ: Archipelago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --panel:rgba(9,13,22,.80);--panel2:rgba(255,255,255,.04);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --fg:#E6EAF2;--muted:#8A94A8;--dim:#5C667A;
  --working:#2DD4BF;--input:#F87171;--waiting:#FBBF24;--passed:#4ADE80;--idle:#64748B;
  --john:#A78BFA;--bob:#60A5FA;--alice:#F472B6;
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#BFE3F2}
body{font-family:var(--sans);color:var(--fg);font-size:13px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #7DD3FC;outline-offset:2px}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas#scene.drag{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 12px 40px rgba(8,20,40,.28)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;height:52px;display:flex;align-items:center;gap:18px;padding:0 14px;z-index:5}
.crumb{display:flex;align-items:center;gap:10px;white-space:nowrap}
.crumb b{font-weight:700;font-size:15px;letter-spacing:-.01em}
.crumb .sep{color:var(--dim)}
.crumb .mono{font-size:12.5px;color:var(--muted)}
.plan{flex:1;min-width:220px;display:flex;align-items:center;gap:12px}
.segs{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:8px;max-width:420px}
.segs i{border-radius:2px;background:rgba(255,255,255,.08)}
.segs i.done{background:var(--passed)}.segs i.review{background:var(--waiting)}.segs i.progress{background:var(--working)}
.stats{display:flex;gap:6px;align-items:center}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.stat .mono{font-size:12.5px}
.live{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--passed)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--passed);box-shadow:0 0 0 3px rgba(74,222,128,.18)}

/* left rail */
#rail{position:fixed;left:12px;top:76px;bottom:160px;width:296px;display:flex;flex-direction:column;gap:10px;z-index:4}
#rail .panel{padding:12px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.agent{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid transparent;cursor:pointer;width:100%;background:none;text-align:left}
.agent+.agent{margin-top:4px}
.agent:hover{background:var(--panel2)}
.agent[aria-pressed="true"]{background:rgba(255,255,255,.06);border-color:var(--line2)}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#0B1020}
.agent .nm{font-weight:600;font-size:14px}
.agent .md{font-family:var(--mono);font-size:11px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.agent .tk{grid-column:2 / 4;font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent .mt{grid-column:2 / 4;display:flex;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;flex:1;align-self:center}
.bar i{display:block;height:100%;background:var(--c,#7DD3FC)}
.queue{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--panel2)}
.q .mono{font-size:11px;color:var(--muted)}
.dotav{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#0B1020}

/* inspector */
#insp{position:fixed;right:12px;top:76px;bottom:160px;width:420px;display:flex;flex-direction:column;z-index:4;overflow:hidden}
.ihead{padding:14px 14px 0;display:flex;align-items:center;gap:10px}
.ihead .nm{font-weight:700;font-size:16px}
.ihead .md{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ask{margin:12px 14px 0;padding:12px;border-radius:10px;background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35)}
.ask p{margin:6px 0 10px;font-size:13.5px}
.ask .row{display:flex;gap:8px}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:8px 12px;min-height:36px;cursor:pointer;font-weight:600;font-size:12.5px}
.btn.primary{background:#E6EAF2;color:#0B1020;border-color:#E6EAF2}
.btn:hover{border-color:rgba(255,255,255,.3)}
.tabs{display:flex;gap:2px;margin:12px 14px 0;padding:3px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;border-radius:7px;padding:7px 0;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px;min-height:32px}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.09);color:var(--fg)}
.tabbody{flex:1;min-height:0;display:flex;flex-direction:column;margin:10px 14px 14px}
.term{flex:1;min-height:0;overflow:hidden;border-radius:10px;background:#070A12;border:1px solid var(--line);padding:12px;font-family:var(--mono);font-size:12px;line-height:1.6;display:flex;flex-direction:column;justify-content:flex-end}
.term .l{white-space:pre-wrap;word-break:break-word}
.term .t-tool{color:#E6EAF2}.term .t-tool::first-letter{color:var(--working)}
.term .t-out{color:#7B8599}.term .t-ok{color:var(--passed)}.term .t-warn{color:var(--waiting)}.term .t-ask{color:var(--input)}.term .t-user{color:#7DD3FC}.term .t-cmd{color:#C4B5FD}
.prompt{display:flex;gap:8px;margin-top:8px}
.prompt input{flex:1;min-width:0;background:#070A12;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:var(--mono);font-size:12px;min-height:38px}
.prompt input::placeholder{color:var(--dim)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:10px 12px;align-items:center;font-size:12.5px}
.kv dt{margin:0}.kv dd{margin:0;font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:8px;min-width:0}
.card2{padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.card2+.card2{margin-top:10px}
.prtitle{font-weight:600;font-size:14px;margin:4px 0 8px}
.cm{display:flex;gap:8px;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line)}
.cm .mono{font-size:11px;color:var(--muted);white-space:nowrap}

/* bottom dock */
#dock{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);height:136px;display:grid;grid-template-columns:1fr 1.15fr;gap:10px;z-index:4}
#dock .panel{padding:12px 14px;overflow:hidden}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#log li{display:grid;grid-template-columns:62px 14px 1fr;gap:8px;align-items:center;font-size:12.5px;white-space:nowrap;overflow:hidden}
#log time{font-family:var(--mono);font-size:11px;color:var(--dim)}
#log .d{width:7px;height:7px;border-radius:50%;background:var(--c)}
#prs{display:flex;gap:8px;overflow:hidden}
.pr{flex:0 0 auto;width:200px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;text-align:left}
.pr .top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px}
.pr .t{font-size:12.5px;margin:6px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .who{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 158px);font-family:var(--mono);font-size:11px;color:#21455A;background:rgba(255,255,255,.55);padding:5px 10px;border-radius:999px;z-index:3;white-space:nowrap}
#err{position:fixed;inset:auto 12px 12px 12px;padding:12px;background:#B42318;color:#fff;font-family:monospace;z-index:20;display:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);color:#21455A;z-index:10;pointer-events:none}

@media (max-width:1280px){ #insp{width:360px} #rail{width:270px} .stat.opt{display:none} }
@media (max-width:1020px){ #insp{display:none} .plan{display:none} }
@media (max-width:760px){
  #rail{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:12px;width:auto;height:auto}
  #rail .qpanel,#dock,#hint{display:none}
  .stats .stat{display:none}
  .crumb .mono,.crumb .sep{display:none}
}
@media (prefers-reduced-motion:reduce){ .live i{box-shadow:none} }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="3D archipelago: each AI agent works on its own island"></canvas>

<header id="top" class="panel">
  <div class="crumb">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="none" stroke="#E6EAF2" stroke-width="1.8"/><path d="M12 7l4.33 2.5v5L12 17l-4.33-2.5v-5z" fill="#2DD4BF"/></svg>
    <b>JSM HQ</b><span class="sep">/</span><span class="mono">askwell</span><span class="sep">/</span><span class="mono">phase-3</span>
  </div>
  <div class="plan"><span class="label">Plan</span><div class="segs" id="segs"></div><span class="mono" id="planTxt" style="font-size:12px"></span></div>
  <div class="stats">
    <div class="stat"><span class="label">Sandboxes</span><span class="mono">3/3</span></div>
    <div class="stat opt"><span class="label">DB branches</span><span class="mono">3</span></div>
    <div class="stat"><span class="label">In review</span><span class="mono" id="stReview">1</span></div>
    <div class="stat"><span class="label">Spend</span><span class="mono" id="stSpend">$8.39</span></div>
    <div class="live"><i></i><span id="clock">00:00:00</span></div>
  </div>
</header>

<aside id="rail">
  <section class="panel"><div class="head"><span class="label">Team</span><span class="mono muted" style="font-size:11px">3 agents</span></div><div id="roster"></div></section>
  <section class="panel qpanel" style="flex:1;min-height:0;overflow:hidden"><div class="head"><span class="label">Up next</span><span class="mono muted" style="font-size:11px" id="qCount"></span></div><div class="queue" id="queue"></div></section>
</aside>

<aside id="insp" class="panel" aria-label="Agent inspector">
  <div class="ihead" id="ihead"></div>
  <div id="askSlot"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="terminal" aria-selected="true">Terminal</button>
    <button role="tab" data-tab="sandbox" aria-selected="false">Sandbox</button>
    <button role="tab" data-tab="pr" aria-selected="false">Pull request</button>
  </div>
  <div class="tabbody" id="tabbody"></div>
</aside>

<div id="dock">
  <section class="panel"><div class="head"><span class="label">Activity</span><span class="mono muted" style="font-size:11px">hooks, live</span></div><ol id="log"></ol></section>
  <section class="panel"><div class="head"><span class="label">Merge queue</span><span class="mono muted" style="font-size:11px">CodeRabbit gate</span></div><div id="prs"></div></section>
</div>
<div id="hint">drag to orbit · scroll to zoom · click an island · 1 2 3 to focus · esc for overview</div>
<div id="loading">Loading the archipelago</div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
addEventListener('error', e => { const el=document.getElementById('err'); el.style.display='block'; el.textContent='Error: '+e.message; });
if(!window.THREE){ document.getElementById('loading').textContent='Could not load the 3D library. Check your connection and reload.'; return; }
const $=s=>document.querySelector(s);
const V=(x,y,z)=>new THREE.Vector3(x,y,z), TAU=Math.PI*2;
const COL={working:'#2DD4BF',input:'#F87171',waiting:'#FBBF24',passed:'#4ADE80',idle:'#64748B'};
const LABEL={working:'working',input:'needs you',waiting:'in review',passed:'review passed',idle:'idle'};
const AGC={john:'#A78BFA',bob:'#60A5FA',alice:'#F472B6'};
let world=null, sel='alice', tab='terminal';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= helpers ================= */
function ct(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); const tex=new THREE.CanvasTexture(c); tex.anisotropy=8; return {c,ctx,tex}; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function sprite(w,h,scale,draw){ const t=ct(w,h); const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t.tex,transparent:true,depthWrite:false,depthTest:false})); s.renderOrder=10; s.scale.set(scale,scale*h/w,1); s.redraw=(fn)=>{ t.ctx.clearRect(0,0,w,h); (fn||draw)(t.ctx,w,h); t.tex.needsUpdate=true; }; s.redraw(draw); return s; }
function flat(color,o){ return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,flatShading:true},o||{})); }
function mesh(geo,mat,x,y,z,shadow){ const m=new THREE.Mesh(geo,mat); m.position.set(x||0,y||0,z||0); if(shadow!==false){ m.castShadow=true; m.receiveShadow=true; } return m; }
function smooth(pts){ return new THREE.CatmullRomCurve3(pts,false,'catmullrom',.45); }
function dashed(points,color,dash,gap,opacity){ const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineDashedMaterial({color,dashSize:dash,gapSize:gap,transparent:true,opacity})); l.computeLineDistances(); return l; }
function rng(seed){ let s=seed>>>0||1; return ()=>((s=Math.imul(s^s>>>15,1|s),s^=s+Math.imul(s^s>>>7,61|s),((s^s>>>14)>>>0)/4294967296)); }

/* ================= simulation ================= */
const AG={
  john:{id:'john',name:'John',role:'Lead',model:'opus',state:'input',tokens:412e3,lines:[],question:'Approve +2 tasks in Phase 3? (P3-T84 Multi-file upload, P3-T85 Embeddings backfill)',assignAt:-9},
  bob:{id:'bob',name:'Bob',role:'Developer',model:'sonnet',state:'waiting',tokens:236e3,lines:[],phase:'waiting',taskId:'P3-T80',pr:91,assignAt:-9},
  alice:{id:'alice',name:'Alice',role:'Developer',model:'sonnet',state:'working',tokens:188e3,lines:[],phase:'working',taskId:'P3-T81',assignAt:-9},
};
const ORDER=['john','bob','alice'];
const PRICE={opus:15/1e6,sonnet:3/1e6};
const cost=a=>a.tokens*PRICE[a.model]*(a.model==='opus'?0.6:3.1);
const TASKS=[['P3-T76','Slack integration','alice','done'],['P3-T77','Source previews','bob','done'],['P3-T78','Answer caching','bob','done'],['P3-T79','Search filters','alice','done'],['P3-T80','Webhook events','bob','review'],['P3-T81','Export chat to PDF','alice','progress'],['P3-T82','Prompt templates','bob','todo'],['P3-T83','Admin roles','alice','todo'],['P3-T84','Multi-file upload','bob','todo'],['P3-T85','Embeddings backfill','alice','todo']].map(([id,title,owner,col])=>({id,title,owner,col}));
const POOL=['Usage dashboard','Health checks','Workspace invites','Answer feedback','Retry failed embeds','Audit log'];
let poolI=0,nextTask=86,nextPR=92,simT=0;
const PRS=[{num:90,agent:'alice',title:'Search filters',state:'merged',comments:0,files:4},{num:91,agent:'bob',title:'Webhook events',state:'review',comments:2,files:6}];
const REVIEW_NOTES=['Validate the webhook signature before parsing the body.','Retry with backoff instead of a fixed 1s sleep.','Add a test for the empty transcript case.','Stream the PDF instead of buffering it in memory.','Index on workspace_id for this query.'];
const log=[];
const task=id=>TASKS.find(t=>t.id===id);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const now=()=>new Date().toTimeString().slice(0,8);
const dirty={team:true,log:true,prs:true,plan:true,insp:true};
function addLog(agent,text,state){ log.unshift({t:now(),agent,text,c:COL[state]||'#7DD3FC'}); log.length=Math.min(log.length,12); dirty.log=true; }
function say(a,text,kind){ a.lines.push({text,kind:kind||'out'}); if(a.lines.length>80) a.lines.shift(); if(sel===a.id) dirty.term=true; }
function setState(a,s){ a.state=s; dirty.team=dirty.insp=true; if(world) world.setState(a.id,s); }
function pr(n){ return PRS.find(p=>p.num===n); }

say(AG.john,'› plan phase 3','cmd'); say(AG.john,'● Read(docs/plan.md)','tool'); say(AG.john,'  ⎿  Phase 3: 10 tasks, 4 merged'); say(AG.john,'● office.assign_task(bob, P3-T82)','tool'); say(AG.john,'● office.assign_task(alice, P3-T83)','tool'); say(AG.john,'? '+AG.john.question,'ask');
say(AG.bob,'› P3-T80 webhook events','cmd'); say(AG.bob,'● Bash(pnpm test webhooks)','tool'); say(AG.bob,'  ⎿  ✓ 14 passed','ok'); say(AG.bob,'● Bash(gh pr create --fill)','tool'); say(AG.bob,'  ⎿  opened #91'); say(AG.bob,'waiting for CodeRabbit review','warn');
say(AG.alice,'› P3-T81 export chat to pdf','cmd'); say(AG.alice,'● Read(src/export/index.ts)','tool'); say(AG.alice,'  ⎿  Read 142 lines'); say(AG.alice,'● Edit(src/export/pdf.ts)','tool'); say(AG.alice,'  ⎿  +38 −6');
addLog('alice','#90 merged into main','passed'); addLog('bob','opened PR #91 · Webhook events','waiting'); addLog('alice','started P3-T81 · Export chat to PDF','working'); addLog('coderabbit','reviewing #91','waiting'); addLog('john','needs your approval','input');

const tokens=[];
function spawnToken(a,leg,u){ const tk={agent:a.id,pr:a.pr,leg,u:u||0,obj:null}; tokens.push(tk); if(world) tk.obj=world.makeBoat(tk); return tk; }
AG.bob.until=4; AG.bob.atGate=true; AG.bob.token=spawnToken(AG.bob,'gate',1);
AG.alice.until=10; AG.alice.nextStep=1.5; AG.john.nextStep=2;

const STEPS=[s=>['● Read(src/'+s+'/index.ts)','  ⎿  Read '+(60+Math.floor(Math.random()*180))+' lines'],s=>['● Edit(src/'+s+'/handler.ts)','  ⎿  +'+(8+Math.floor(Math.random()*40))+' −'+Math.floor(Math.random()*12)],s=>['● Bash(pnpm test '+s+')','  ⎿  ✓ '+(4+Math.floor(Math.random()*18))+' passed'],s=>['● Bash(pnpm typecheck)','  ⎿  no errors'],s=>['● Write(src/'+s+'/schema.ts)','  ⎿  '+(20+Math.floor(Math.random()*60))+' lines']];
function nextFor(a){
  let t=TASKS.find(x=>x.col==='todo'&&x.owner===a.id)||TASKS.find(x=>x.col==='todo');
  if(!t){ t={id:'P3-T'+(nextTask++),title:POOL[poolI++%POOL.length],owner:a.id,col:'todo'}; TASKS.push(t); }
  t.owner=a.id; t.col='progress'; a.taskId=t.id; a.phase='working'; a.until=simT+10+Math.random()*4; a.atGate=false; a.nextStep=simT+1.2; a.assignAt=simT;
  setState(a,'working'); say(AG.john,'● office.assign_task('+a.id+', '+t.id+')','tool'); say(a,'› '+t.id+' '+t.title.toLowerCase(),'cmd'); addLog(a.id,'started '+t.id+' · '+t.title,'working'); dirty.plan=true;
}
function devTick(a,dt){
  if(a.phase==='working'){ a.tokens+=dt*(700+Math.random()*500);
    if(simT>a.nextStep){ const st=STEPS[Math.floor(Math.random()*STEPS.length)](slug(task(a.taskId).title)); say(a,st[0],'tool'); say(a,st[1],st[1].includes('✓')?'ok':'out'); a.nextStep=simT+1.5+Math.random()*1.2; }

      for(const id in orders){ const o=orders[id], k=simT-AG[id].assignAt; o.pulses.forEach((m,i)=>{ const u=(k-i*.18)/1.4; m.visible=u>0&&u<1; if(m.visible) m.position.copy(o.c.getPoint(u)); }); }
      docked.forEach((b,i)=>{ b.position.y=.15+Math.sin(t*1.6+i)*.04; b.rotation.z=Math.sin(t*1.3+i)*.04; });
      for(const tk of tokens){ if(!tk.obj) continue; const curve=tk.leg==='toMain'?routes.main:routes[tk.agent]; const u=Math.min(Math.max(tk.u,0),1); const pt=curve.getPointAt(u); const off=tk.leg==='gate'?(tk.agent==='bob'?-.5:.5):0;
        tk.obj.position.set(pt.x+off*.4,pt.y-.08+Math.sin(t*2.4+tk.pr)*.05,pt.z+off); const tg=curve.getTangentAt(Math.min(u,.999)); tk.obj.lookAt(tk.obj.position.x+tg.x,tk.obj.position.y,tk.obj.position.z+tg.z); tk.obj.rotation.z+=Math.sin(t*2+tk.pr)*.05;
        const moving=tk.leg!=='gate'; tk.obj.userData.wake.forEach((w,i)=>{ const uu=u-(i+1)*.025; if(!moving||uu<0){ w.material.opacity=0; return; } const q=curve.getPointAt(uu); w.position.set(q.x+off*.4,.14,q.z+off); w.scale.setScalar(1+i*.25); w.material.opacity=.35*(1-i/7); }); }
    }
  };
  return api;
}

/* ================= camera ================= */
const orbit={target:V(2.2,0,.4),r:45,theta:-.2,phi:.9,goal:{target:V(2.2,0,.4),r:45,theta:-.2,phi:.9}};
const HOME={target:V(2.4,0,.6),r:45,theta:-.2,phi:.9};
function home(){ orbit.goal.target.copy(HOME.target); orbit.goal.r=HOME.r; orbit.goal.theta=HOME.theta; orbit.goal.phi=HOME.phi; }
function fly(id){ const p=world.agentPos[id]; if(!p) return; orbit.goal.target.copy(p); orbit.goal.r=id==='gate'?16:15; orbit.goal.phi=.88; }
function camTick(dt){ const k=1-Math.pow(.0012,dt); orbit.target.lerp(orbit.goal.target,k); orbit.r+=(orbit.goal.r-orbit.r)*k; orbit.theta+=(orbit.goal.theta-orbit.theta)*k; orbit.phi+=(orbit.goal.phi-orbit.phi)*k;
  camera.position.set(orbit.target.x+orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta),orbit.target.y+orbit.r*Math.cos(orbit.phi),orbit.target.z+orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta)); camera.lookAt(orbit.target); }
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; orbit.goal.theta-=dx*.005; orbit.goal.phi=Math.min(1.35,Math.max(.3,orbit.goal.phi-dy*.004)); });
canvas.addEventListener('pointerup',e=>{ canvas.classList.remove('drag'); if(drag && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5) pick(e); drag=null; });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); orbit.goal.r=Math.min(80,Math.max(8,orbit.goal.r*(1+e.deltaY*.001))); },{passive:false});
const ray=new THREE.Raycaster();
function pick(e){ const r=canvas.getBoundingClientRect(); ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},camera); const hit=ray.intersectObjects(world.pickables,true)[0]; if(!hit) return; let o=hit.object; while(o&&!o.userData.agent) o=o.parent; if(!o) return; const id=o.userData.agent; if(AG[id]) select(id,true); else if(id==='gate'){ fly('gate'); tab='pr'; dirty.insp=true; } }
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='Escape') home(); if(e.key==='1') select('john',true); if(e.key==='2') select('bob',true); if(e.key==='3') select('alice',true); });

/* ================= HUD ================= */
function select(id,flyTo){ sel=id; dirty.team=dirty.insp=true; if(flyTo) fly(id); }
const roster=$('#roster'), queue=$('#queue'), logEl=$('#log'), prsEl=$('#prs'), ihead=$('#ihead'), askSlot=$('#askSlot'), tabbody=$('#tabbody');
function badge(s){ return `<span class="badge" style="--c:${COL[s]}"><i></i>${LABEL[s]}</span>`; }
function av(id,cls){ return `<span class="${cls||'av'}" style="background:${AGC[id]}">${AG[id]?AG[id].name[0]:'C'}</span>`; }
function taskLine(a){ if(a.id==='john') return a.state==='input'?'Waiting on your decision':'Planning, assigning, merge order'; const t=task(a.taskId); return t?t.id+' · '+t.title:''; }
function metrics(a){ const cpu=a.state==='working'?.55+.3*Math.abs(Math.sin(simT*.9+a.id.length)):a.state==='input'?.05:.12; return `<span>${Math.round(a.tokens/1000)}k tok</span><span>$${cost(a).toFixed(2)}</span><span class="bar" style="--c:${COL[a.state]}"><i style="width:${Math.round(cpu*100)}%"></i></span><span>cpu</span>`; }
function updateTeam(){ ORDER.forEach(id=>{ const m=roster.querySelector('.agent[data-id="'+id+'"] .mt'); if(m) m.innerHTML=metrics(AG[id]); }); const spend=ORDER.reduce((s,id)=>s+cost(AG[id]),0); $('#stSpend').textContent='$'+spend.toFixed(2); }
function renderTeam(){
  roster.innerHTML=ORDER.map(id=>{ const a=AG[id];
    return `<button type="button" class="agent" data-id="${id}" aria-pressed="${sel===id}">${av(id)}<div><div class="nm">${a.name}</div><div class="md">${a.model}${id==='john'?' · lead':' · sandbox'}</div></div>${badge(a.state)}<div class="tk">${esc(taskLine(a))}</div><div class="mt">${metrics(a)}</div></button>`; }).join('');
  const todo=TASKS.filter(t=>t.col==='todo'); $('#qCount').textContent=todo.length+' queued';
  queue.innerHTML=todo.slice(0,6).map(t=>`<div class="q">${av(t.owner,'dotav')}<span>${esc(t.title)}</span><span class="mono">${t.id}</span></div>`).join('')||'<div class="q"><span></span><span class="muted">Queue empty, John is planning</span><span></span></div>';
  const spend=ORDER.reduce((s,id)=>s+cost(AG[id]),0); $('#stSpend').textContent='$'+spend.toFixed(2);
}
function renderPlan(){ $('#segs').innerHTML=TASKS.map(t=>`<i class="${t.col==='todo'?'':t.col}" title="${t.id} ${esc(t.title)}"></i>`).join(''); const d=TASKS.filter(t=>t.col==='done').length; $('#planTxt').textContent=d+'/'+TASKS.length+' merged'; $('#stReview').textContent=PRS.filter(p=>p.state==='review'||p.state==='open').length; }
function renderLog(){ logEl.innerHTML=log.slice(0,4).map(l=>`<li><time>${l.t}</time><span class="d" style="--c:${l.c}"></span><span><b style="font-weight:600">${l.agent==='coderabbit'?'CodeRabbit':AG[l.agent].name}</b> <span class="muted">${esc(l.text)}</span></span></li>`).join(''); }
function prState(p){ return p.state==='merged'?['merged','#A78BFA']:p.state==='passed'?['passed','#4ADE80']:p.state==='review'?['reviewing','#FBBF24']:['sailing to review','#7DD3FC']; }
function renderPRs(){ prsEl.innerHTML=PRS.slice(-5).reverse().map(p=>{ const [s,c]=prState(p); return `<button type="button" class="pr" data-agent="${p.agent}"><div class="top"><span>#${p.num}</span><span class="badge" style="--c:${c}"><i></i>${s}</span></div><div class="t">${esc(p.title)}</div><div class="who">${av(p.agent,'dotav')}<span>${p.agent} · ${p.files} files${p.comments?' · '+p.comments+' notes':''}</span></div></button>`; }).join(''); }
function termHTML(a){ return a.lines.slice(-26).map(l=>`<div class="l t-${l.kind}">${esc(l.text)}</div>`).join(''); }
function renderInsp(){
  const a=AG[sel];
  ihead.innerHTML=`${av(sel)}<div style="flex:1;min-width:0"><div class="nm">${a.name}</div><div class="md">${sel==='john'?'lead · opus · plans and merges, writes no app code':'developer · sonnet · sandbox-'+sel+' · db askwell/'+sel}</div></div>${badge(a.state)}`;
  askSlot.innerHTML= sel==='john'&&a.state==='input' ? `<div class="ask"><span class="label" style="color:#FCA5A5">Decision needed</span><p>${esc(a.question)}</p><div class="row"><button type="button" class="btn primary" data-ans="1">Approve</button><button type="button" class="btn" data-ans="0">Hold</button></div></div>` : '';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  if(tab==='terminal'){ tabbody.innerHTML=`<div class="term" id="term">${termHTML(a)}</div><form class="prompt" id="prompt"><input id="msg" autocomplete="off" placeholder="Message ${a.name.toLowerCase()}…" aria-label="Message ${a.name}"><button class="btn" type="submit">Send</button></form>`; }
  else if(tab==='sandbox'){ const cpu=a.state==='working'?62:a.state==='waiting'?9:4, mem=a.state==='working'?71:48;
    tabbody.innerHTML=`<div class="card2"><dl class="kv"><dt class="muted">Sandbox</dt><dd>sandbox-${sel} <span class="badge" style="--c:#4ADE80"><i></i>running</span></dd><dt class="muted">Runtime</dt><dd>Docker microVM · 2 vCPU · 4 GB</dd><dt class="muted">CPU</dt><dd><span class="bar" style="--c:#2DD4BF"><i style="width:${cpu}%"></i></span>${cpu}%</dd><dt class="muted">Memory</dt><dd><span class="bar" style="--c:#7DD3FC"><i style="width:${mem}%"></i></span>${mem}%</dd><dt class="muted">Network</dt><dd>deny by default · 4 hosts</dd><dt class="muted">Permissions</dt><dd>full access, inside the VM only</dd></dl></div>
    <div class="card2"><dl class="kv"><dt class="muted">DB branch</dt><dd>${sel==='john'?'none (lead)':'askwell/'+sel}</dd><dt class="muted">Copy of</dt><dd>${sel==='john'?'n/a':'main · copy-on-write'}</dd><dt class="muted">Hooks</dt><dd><span class="badge" style="--c:#4ADE80"><i></i>connected</span></dd><dt class="muted">Tokens</dt><dd>${Math.round(a.tokens/1000)}k · $${cost(a).toFixed(2)}</dd></dl></div>`; }
  else { const p=[...PRS].reverse().find(x=>x.agent===sel&&x.state!=='merged')||[...PRS].reverse().find(x=>x.agent===sel);
    if(!p){ tabbody.innerHTML=`<div class="card2 muted">${sel==='john'?'John plans and merges. He opens no PRs of his own.':'No pull request yet.'}</div>`; }
    else { const [s,c]=prState(p); const notes=REVIEW_NOTES.slice(p.num%3,p.num%3+(p.comments||0));
      tabbody.innerHTML=`<div class="card2"><div style="display:flex;justify-content:space-between;align-items:center"><span class="mono">#${p.num} · ${p.files} files</span><span class="badge" style="--c:${c}"><i></i>${s}</span></div><div class="prtitle">${esc(p.title)}</div><dl class="kv"><dt class="muted">Branch</dt><dd>task/${slug(p.title)}</dd><dt class="muted">Checks</dt><dd><span class="badge" style="--c:#4ADE80"><i></i>tests pass</span><span class="badge" style="--c:${c}"><i></i>CodeRabbit</span></dd></dl></div>
      <div class="card2"><span class="label">CodeRabbit notes</span>${notes.length?notes.map(n=>`<div class="cm"><span class="mono">nit</span><span>${esc(n)}</span></div>`).join(''):'<div class="cm muted">Review in progress</div>'}</div>`; } }
}
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ tab=b.dataset.tab; dirty.insp=true; } });
roster.addEventListener('click',e=>{ const b=e.target.closest('.agent'); if(b) select(b.dataset.id,true); });
prsEl.addEventListener('click',e=>{ const b=e.target.closest('.pr'); if(b){ tab='pr'; select(b.dataset.agent,true); } });
askSlot.addEventListener('click',e=>{ const b=e.target.closest('[data-ans]'); if(b) answer(b.dataset.ans==='1'); });
tabbody.addEventListener('submit',e=>{ e.preventDefault(); const inp=$('#msg'); const v=inp.value.trim(); if(!v) return; const a=AG[sel]; say(a,'you › '+v,'user'); inp.value=''; dirty.term=true; const reply=sel==='john'?'● Noted. Updating plan.md.':'● Noted. Folding that into '+(a.taskId||'the next task')+'.'; setTimeout(()=>{ say(a,reply,'tool'); },900); });

/* ================= loop ================= */
const clock=new THREE.Clock(); let hudT=0, t0=performance.now();
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  simTick(dt); world.update(t,dt); camTick(dt); renderer.render(scene,camera);
  hudT+=dt;
  if(dirty.term && tab==='terminal'){ const el=$('#term'); if(el) el.innerHTML=termHTML(AG[sel]); dirty.term=false; }
  if(dirty.insp){ dirty.insp=false; const focused=document.activeElement&&document.activeElement.id==='msg'; const val=focused?$('#msg').value:''; renderInsp(); if(focused){ const m=$('#msg'); m.value=val; m.focus(); } }
  if(dirty.plan){ dirty.plan=false; renderPlan(); }
  if(dirty.prs){ dirty.prs=false; renderPRs(); }
  if(dirty.log){ dirty.log=false; renderLog(); }
  if(dirty.team){ dirty.team=false; renderTeam(); }
  if(hudT>.5){ hudT=0; updateTeam(); const s=Math.floor((performance.now()-t0)/1000)+14*60+32; $('#clock').textContent=[s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':'); }
  requestAnimationFrame(frame);
}
const fontsReady=document.fonts?Promise.race([Promise.all(['600 36px Geist','500 24px "Geist Mono"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontsReady.then(()=>{ world=buildWorld(); for(const tk of tokens) tk.obj=world.makeBoat(tk); ORDER.forEach(id=>world.setState(id,AG[id].state)); orbit.target.copy(HOME.target); orbit.r=HOME.r*1.3; home(); renderTeam(); renderPlan(); renderPRs(); renderLog(); renderInsp(); $('#loading').remove(); requestAnimationFrame(frame); });
})();
</script>
