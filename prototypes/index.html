      /* =====================================================================
   8. SERVER ROOM RACKS
===================================================================== */
      function createRack(def) {
        const W = 1.7,
          H = 3.4,
          D = 1.3;
        const group = new THREE.Group();
        group.position.set(def.x, 0.16, RACK_Z);
        scene.add(group);
        const c = new THREE.Color(def.color);
        const body = new THREE.Mesh(
          new RoundedBoxGeometry(W, H, D, 2, 0.05),
          new THREE.MeshStandardMaterial({
            color: 0x0d1428,
            roughness: 0.35,
            metalness: 0.7,
          }),
        );
        body.position.y = H / 2;
        group.add(body);

        // Server units (slots) + LED grid as one InstancedMesh
        const UNITS = 10,
          PER = 4;
        const unitGeo = new THREE.BoxGeometry(W - 0.24, 0.24, 0.04);
        const unitMat = new THREE.MeshStandardMaterial({
          color: 0x141f3d,
          roughness: 0.5,
          metalness: 0.6,
        });
        const leds = new THREE.InstancedMesh(
          new THREE.BoxGeometry(0.09, 0.05, 0.03),
          new THREE.MeshBasicMaterial({ color: 0xffffff }),
          UNITS * PER,
        );
        const m4 = new THREE.Matrix4();
        for (let u = 0; u < UNITS; u++) {
          const y = 0.35 + u * 0.29;
          const unit = new THREE.Mesh(unitGeo, unitMat);
          unit.position.set(0, y, D / 2 + 0.01);
          group.add(unit);
          for (let i = 0; i < PER; i++) {
            m4.makeTranslation(0.25 + i * 0.13, y, D / 2 + 0.04);
            leds.setMatrixAt(u * PER + i, m4);
            leds.setColorAt(u * PER + i, new THREE.Color(0, 0, 0));
          }
        }
        group.add(leds);

        // Neon edge strips in the rack colour
        const stripMat = new THREE.MeshBasicMaterial({
          color: c.clone().multiplyScalar(1.5),
        });
        for (const sx of [-1, 1]) {
          const s = new THREE.Mesh(
            new THREE.BoxGeometry(0.04, H - 0.1, 0.04),
            stripMat,
          );
          s.position.set(sx * (W / 2 - 0.02), H / 2, D / 2 + 0.02);
          group.add(s);
        }
        const topStrip = new THREE.Mesh(
          new THREE.BoxGeometry(W - 0.1, 0.04, 0.04),
          stripMat,
        );
        topStrip.position.set(0, H - 0.05, D / 2 + 0.02);
        group.add(topStrip);

        const glow = floorGlow(3, 3, c, 0.4);
        glow.position.y = 0.01;
        glow.position.z = 0.5;
        group.add(glow);
        const label = pillLabel(def.label, def.color, 1.4);
        label.sprite.position.set(0, H + 0.4, D / 2 + 0.25);
        group.add(label.sprite); // in front of the pipe inlet

        // Expanding ring used for the "merged into main" pulse
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.9, 1.05, 64),
          new THREE.MeshBasicMaterial({
            color: hdr("#34d399", 2),
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(0, 0.03, 0.2);
        group.add(ring);

        return {
          def,
          group,
          leds,
          stripMat,
          glow,
          ring,
          base: c,
          pulse: 0,
          nextBlink: 0,
          ledColor: new THREE.Color(),
        };
      }

      const LED_PALETTE = [
        new THREE.Color("#34d399"),
        new THREE.Color("#22d3ee"),
        new THREE.Color("#34d399"),
        new THREE.Color("#fbbf24"),
      ];
      const GREEN = new THREE.Color("#34d399");

      function updateRacks(dt, t) {
        for (const r of racks) {
          r.pulse = Math.max(0, r.pulse - dt * 0.7);
          // Activity: bob/alice racks follow their agent; main follows overall work
          const owner = agentById[r.def.id];
          const activity = owner
            ? {
                working: 0.75,
                waiting: 0.45,
                passed: 0.6,
                input: 0.15,
                idle: 0.12,
              }[owner.state]
            : 0.35 + r.pulse;
          if (t > r.nextBlink) {
            r.nextBlink = t + 0.09;
            for (let i = 0; i < r.leds.count; i++) {
              if (r.pulse > 0.3)
                r.ledColor.copy(GREEN).multiplyScalar(2.5 * r.pulse);
              else if (Math.random() < activity)
                r.ledColor
                  .copy(
                    LED_PALETTE[(i * 7 + (Math.random() < 0.08 ? 3 : 0)) % 4],
                  )
                  .multiplyScalar(rand(1.2, 2.4));
              else r.ledColor.setRGB(0.02, 0.03, 0.06);
              r.leds.setColorAt(i, r.ledColor);
            }
            r.leds.instanceColor.needsUpdate = true;
          }
          const k =
            1.2 +
            r.pulse * 3 +
            (owner && owner.state === "working" ? Math.sin(t * 5) * 0.3 : 0);
          r.stripMat.color
            .copy(
              r.pulse > 0.05
                ? r.ledColor.copy(r.base).lerp(GREEN, r.pulse)
                : r.base,
            )
            .multiplyScalar(k);
          r.glow.material.opacity = 0.25 + r.pulse * 0.6;
          // ring expands outward as the pulse decays
          const p = 1 - r.pulse;
          r.ring.scale.setScalar(1 + p * 2.6);
          r.ring.material.opacity = r.pulse > 0 ? r.pulse * 0.9 : 0;
        }
      }

      /* =====================================================================
   9. PIPES (pod → personal rack) with flowing light particles
===================================================================== */
      function createPipe(agent, points, color) {
        const path = roundedPath(points, 0.6);
        const len = path.getLength();
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(path, 320, 0.11, 10, false),
          new THREE.MeshStandardMaterial({
            color: new THREE.Color(color).multiplyScalar(0.25),
            emissive: color,
            emissiveIntensity: 0.22,
            transparent: true,
            opacity: 0.6,
            roughness: 0.25,
            metalness: 0.3,
            depthWrite: false,
          }),
        );
        scene.add(tube);
        // End caps where the pipe meets pod and rack
        for (const p of [points[0], points[points.length - 1]]) {
          const cap = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.2, 0.12, 16),
            M.dark,
          );
          cap.position.copy(p);
          scene.add(cap);
        }
        // Pre-sample the path so particles don't evaluate curves every frame
        const samples = path.getSpacedPoints(600);
        const N = 36,
          pos = new Float32Array(N * 3);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({
          size: 0.42,
          map: glowTex,
          color: new THREE.Color(color).multiplyScalar(2.2),
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        const points3 = new THREE.Points(geo, mat);
        points3.frustumCulled = false;
        scene.add(points3);
        return {
          agent,
          samples,
          len,
          N,
          pos,
          geo,
          mat,
          phase: 0,
          speed: 1,
          base: new THREE.Color(color),
        };
      }

      function updatePipes(dt) {
        for (const p of pipes) {
          const target = {
            working: 4.2,
            waiting: 1.6,
            passed: 3,
            input: 0.35,
            idle: 0.5,
          }[p.agent.state];
          p.speed += (target - p.speed) * damp(2, dt);
          p.phase = (p.phase + (p.speed * dt) / p.len) % 1;
          const S = p.samples.length - 1;
          for (let i = 0; i < p.N; i++) {
            const u = (p.phase + i / p.N) % 1,
              f = u * S,
              i0 = Math.floor(f),
              fr = f - i0;
            const a = p.samples[i0],
              b = p.samples[Math.min(S, i0 + 1)];
            p.pos[i * 3] = a.x + (b.x - a.x) * fr;
            p.pos[i * 3 + 1] = a.y + (b.y - a.y) * fr;
            p.pos[i * 3 + 2] = a.z + (b.z - a.z) * fr;
          }
          p.geo.attributes.position.needsUpdate = true;
          const tint = p.agent.state === "input" ? STATE.input.color : p.base;
          p.mat.color
            .copy(tint)
            .multiplyScalar(p.agent.state === "idle" ? 0.9 : 2.2);
        }
      }

      /* =====================================================================
   10. PR TOKENS (glowing orbs that travel pod → gate → main)
===================================================================== */
      const tokenGeo = new THREE.IcosahedronGeometry(0.22, 1);
      const ringGeo = new THREE.TorusGeometry(0.36, 0.022, 6, 40);
      const tokens = [];
      const TOKEN_COLORS = {
        queued: new THREE.Color("#fbbf24"),
        entering: new THREE.Color("#fbbf24"),
        review: new THREE.Color("#fbbf24"),
        toMain: new THREE.Color("#34d399"),
        absorb: new THREE.Color("#34d399"),
        back: new THREE.Color("#f43f5e"),
      };

      // Pre-built travel curves for each developer
      function podFront(a) {
        return V3(a.pos[0], 1.3, a.pos[2] + a.size[2] / 2 + 0.45);
      }
      const queueSlot = (i) =>
        GATE_CENTER.clone().addScaledVector(GATE_DIR, -(1.9 + i * 1.0));
      const CURVES = {
        bob: new THREE.CubicBezierCurve3(
          podFront(agentById.bob),
          V3(-6, 3.6, 7.6),
          V3(1, 3.2, 6.6),
          queueSlot(0),
        ),
        alice: new THREE.CubicBezierCurve3(
          podFront(agentById.alice),
          V3(-0.5, 3.0, 6.8),
          V3(2.5, 2.6, 4.0),
          queueSlot(0),
        ),
        toMain: new THREE.CubicBezierCurve3(
          GATE_CENTER.clone(),
          V3(6.9, 2.7, -0.5),
          V3(9.6, 2.9, -1.8),
          MAIN_INLET.clone(),
        ),
      };

      class Token {
        constructor(pr) {
          this.pr = pr;
          this.agent = pr.agent;
          this.phase = "toQueue";
          this.t = 0;
          this.pos = podFront(this.agent);
          this.color = new THREE.Color(this.agent.color);
          this.agentColor = new THREE.Color(this.agent.color);
          this.group = new THREE.Group();
          scene.add(this.group);
          this.core = new THREE.Mesh(
            tokenGeo,
            new THREE.MeshBasicMaterial({ color: 0xffffff }),
          );
          this.ring = new THREE.Mesh(
            ringGeo,
            new THREE.MeshBasicMaterial({ color: 0xffffff }),
          );
          this.halo = new THREE.Sprite(
            new THREE.SpriteMaterial({
              map: glowTex,
              color: 0xffffff,
              transparent: true,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
            }),
          );
          this.halo.scale.setScalar(1.6);
          this.tag = pillLabel(`#${pr.num}`, this.agent.color, 0.9);
          this.tag.sprite.position.y = 0.6;
          this.group.add(this.core, this.ring, this.halo, this.tag.sprite);
          // Trail: ring buffer of recent positions with fading vertex colours
          this.trailN = 22;
          this.trailPos = new Float32Array(this.trailN * 3);
          this.trailCol = new Float32Array(this.trailN * 3);
          for (let i = 0; i < this.trailN; i++)
            this.trailPos.set([this.pos.x, this.pos.y, this.pos.z], i * 3);
          const tg = new THREE.BufferGeometry();
          tg.setAttribute(
            "position",
            new THREE.BufferAttribute(this.trailPos, 3),
          );
          tg.setAttribute("color", new THREE.BufferAttribute(this.trailCol, 3));
          this.trail = new THREE.Points(
            tg,
            new THREE.PointsMaterial({
              size: 0.3,
              map: glowTex,
              vertexColors: true,
              transparent: true,
              depthWrite: false,
              blending: THREE.AdditiveBlending,
            }),
          );
          this.trail.frustumCulled = false;
          scene.add(this.trail);
          this.scale = 0;
          this.dead = false;
          tokens.push(this);
        }

        /** Switch to a travel phase along a curve. */
        go(phase, onArrive) {
          this.phase = phase;
          this.t = 0;
          this.onArrive = onArrive;
          if (phase === "back") {
            const f = podFront(this.agent);
            this.curve = new THREE.CubicBezierCurve3(
              this.pos.clone(),
              V3(3.2, 4, 2.8),
              f.clone().add(V3(1.5, 2.6, 2)),
              f,
            );
          }
        }

        update(dt, t) {
          const target =
            this.phase === "toQueue"
              ? this.agentColor
              : TOKEN_COLORS[this.phase];
          this.color.lerp(target, damp(6, dt));

          switch (this.phase) {
            case "toQueue":
              this.t += dt / 2.6;
              CURVES[this.agent.id].getPoint(
                easeInOut(Math.min(1, this.t)),
                this.pos,
              );
              if (this.t >= 1) {
                this.phase = "queued";
                gate.queue.push(this);
              }
              break;
            case "queued": {
              const slot = queueSlot(gate.queue.indexOf(this));
              slot.y += Math.sin(t * 3 + this.pr.num) * 0.08;
              this.pos.lerp(slot, damp(4, dt));
              break;
            }
            case "entering":
              this.t += dt / 0.8;
              this.pos.lerpVectors(
                this.from,
                GATE_CENTER,
                easeInOut(Math.min(1, this.t)),
              );
              if (this.t >= 1) {
                this.phase = "review";
                startReview(this);
              }
              break;
            case "review":
              this.pos.copy(GATE_CENTER);
              this.pos.y += Math.sin(t * 4) * 0.12;
              break;
            case "toMain":
              this.t += dt / 1.9;
              CURVES.toMain.getPoint(easeInOut(Math.min(1, this.t)), this.pos);
              if (this.t >= 1) {
                this.phase = "absorb";
                this.t = 0;
                this.onArrive?.();
              }
              break;
            case "back":
              this.t += dt / 2.4;
              this.curve.getPoint(easeInOut(Math.min(1, this.t)), this.pos);
              if (this.t >= 1) {
                this.phase = "absorb";
                this.t = 0;
              }
              break;
            case "absorb":
              this.t += dt / 0.5;
              if (this.t >= 1) this.dead = true;
              break;
          }

          // Visuals
          const targetScale =
            this.phase === "absorb"
              ? Math.max(0, 1 - this.t)
              : this.phase === "review"
                ? 1.25
                : 1;
          this.scale += (targetScale - this.scale) * damp(10, dt);
          this.group.position.copy(this.pos);
          this.group.scale.setScalar(this.scale);
          const pulse =
            this.phase === "review" ? 2.2 + Math.sin(t * 10) * 0.8 : 2.4;
          this.core.material.color.copy(this.color).multiplyScalar(pulse);
          this.ring.material.color.copy(this.color).multiplyScalar(1.8);
          this.halo.material.color.copy(this.color);
          this.core.rotation.x += dt * 1.5;
          this.core.rotation.y += dt * 2;
          this.ring.rotation.x = t * 2.2;
          this.ring.rotation.y = t * 1.3;

          // Trail
          this.trailPos.copyWithin(3, 0, (this.trailN - 1) * 3);
          this.trailPos[0] = this.pos.x;
          this.trailPos[1] = this.pos.y;
          this.trailPos[2] = this.pos.z;
          for (let i = 0; i < this.trailN; i++) {
            const f = (1 - i / this.trailN) ** 2 * 1.6 * this.scale;
            this.trailCol[i * 3] = this.color.r * f;
            this.trailCol[i * 3 + 1] = this.color.g * f;
            this.trailCol[i * 3 + 2] = this.color.b * f;
          }
          this.trail.geometry.attributes.position.needsUpdate = true;
          this.trail.geometry.attributes.color.needsUpdate = true;
        }

        dispose() {
          scene.remove(this.group, this.trail);
          this.core.material.dispose();
          this.ring.material.dispose();
          this.halo.material.dispose();
          this.tag.tex.dispose();
          this.tag.sprite.material.dispose();
          this.trail.geometry.dispose();
          this.trail.material.dispose();
        }
      }

      /** Lets the next queued token into the gate once it is free. */
      function updateGateQueue() {
        if (gate.busy || simTime < gate.cooldownUntil || !gate.queue.length)
          return;
        const tk = gate.queue[0];
        if (tk.pos.distanceTo(queueSlot(0)) > 0.35) return;
        gate.queue.shift();
        gate.busy = tk;
        tk.phase = "entering";
        tk.t = 0;
        tk.from = tk.pos.clone();
      }

      /* =====================================================================
   11. SIMULATION DATA + AGENT BEHAVIOUR
===================================================================== */
      let nextTaskNum = 7,
        nextPR = 12,
        mergedCount = 11,
        inputSeq = 0;
      const prs = [];
      const tasks = [
        ["P2-T09", "Auth + workspaces", "bob", "done"],
        ["P2-T10", "Onboarding flow", "alice", "done"],
        ["P2-T11", "Billing stub", "bob", "done"],
        ["P3-T01", "Knowledge upload", "alice", "todo"],
        ["P3-T02", "Chunk + embed pipeline", "bob", "todo"],
        ["P3-T03", "Ask endpoint (RAG)", "bob", "todo"],
        ["P3-T04", "Citations UI", "alice", "todo"],
        ["P3-T05", "Streaming answers", "alice", "todo"],
        ["P3-T06", "Rate limiter", "bob", "todo"],
      ].map(([id, title, owner, col], i) => ({

      const TASK_POOL = [

        "Health checks",

      let poolIdx = 0;

      const DEV_QUESTIONS = [
        {

        {

      const JOHN_QUESTIONS = [
        {

        },
      ];
      const REVIEW_COMMENTS = [
        "Missing error handling for empty uploads",
        "Add a test for the 413 path",
        "Avoid the N+1 query in loadChunks()",
        "Validate the request body with zod",
        "Unused import in route.ts",
        "Handle the abort signal when streaming",
      ];
      const ACTIVITIES = [
        "Thinking",
        "Editing",
        "Running tests",
        "Reading files",
        "Refactoring",
        "Type-checking",
      ];

      // Runtime fields on each agent
      for (const a of AGENTS)
        Object.assign(a, {
          state: "idle",
          task: null,
          stateSince: 0,
          term: { lines: [], seq: 0 },
          pendingInput: null,
          nextStep: 0,
          activity: "Working",
        });

      /** Append a line to an agent's terminal (shared by pod screen + 2D panel). */
      function say(a, text, kind = "say") {
        a.term.lines.push({ seq: ++a.term.seq, text, kind });
        if (a.term.lines.length > 200) a.term.lines.shift();
        if (a.pod) {
          a.pod.scroll = Math.min(a.pod.scroll + LINE_H, LINE_H * 3);
          a.pod.dirty = true;
        }
      }

      function setState(a, s) {
        a.state = s;
        a.stateSince = simTime;
        if (a.pod) {
          a.pod.label.redraw();
          a.pod.dirty = true;
        }
        markDirty("team");
      }

      function moveTask(task, col) {
        task.col = col;
        task.enteredAt = simTime;
        markDirty("plan");
      }

      const slugify = (s) =>
        s
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");
      const pascal = (s) =>
        s
          .replace(/[^a-zA-Z0-9]+/g, " ")
          .trim()
          .split(" ")
          .map((w) => w[0].toUpperCase() + w.slice(1))
          .join("");

      /** Fake Claude Code tool calls for a developer working on a task. */
      function devStep(a) {
        const t = a.task,
          slug = slugify(t.title),
          dir = `src/features/${slug}`;
        const file = pick([
          `${dir}/index.ts`,

          `app/api/${slug}/route.ts`,
          `components/${pascal(t.title)}.tsx`,
        ]);
        const steps = [
          () => {
            a.activity = "Reading files";
            return [
              ["tool", `⏺ Read(${file})`],
              ["out", `  ⎿  Read ${randi(40, 240)} lines`],

          () => {
            a.activity = "Searching";
            return [

                "tool",
                `⏺ Search(pattern: "${pick(["useUpload", "embed", "askQuestion", "workspaceId", "rateLimit", "citations"])}", path: "src")`,

              ["out", `  ⎿  Found ${randi(2, 11)} files`],

          },
          () => {
            a.activity = "Editing";

          () => {

              ["tool", `⏺ Write(${dir}/${slug}.test.ts)`],
              ["out", `  ⎿  Wrote ${randi(30, 140)} lines`],
            ];
          },
          () => {
            a.activity = "Running tests";
            return chance(0.2)
              ? [
                  ["tool", `⏺ Bash(pnpm test ${slug})`],

              : [
                  ["tool", `⏺ Bash(pnpm test ${slug})`],
                  [
                    "ok",
                    `  ⎿  ✓ ${randi(6, 32)} passed (${rand(0.8, 3.6).toFixed(1)}s)`,
                  ],

          },
          () => {
            a.activity = "Type-checking";
            return [
              ["tool", "⏺ Bash(pnpm typecheck)"],
              ["ok", "  ⎿  Found 0 errors"],

          },
          () => {
            a.activity = "Thinking";
            return [

                "think",
                `✻ ${pick(["Considering edge cases for", "Planning the shape of", "Checking existing patterns in"])} ${t.title.toLowerCase()}…`,

          () => {
            a.activity = "Working";

              ],

          },
        ];
        return pick(steps)();
      }

      /** Lead-specific tool calls. */
      function johnStep(a) {
        a.activity = pick(["Planning", "Reviewing", "Coordinating"]);
        return pick([
          () => [
            ["tool", "⏺ Read(docs/plan/phase-3.md)"],
            ["out", `  ⎿  Read ${randi(120, 180)} lines`],
          ],

          ],
          () => [
            ["tool", `⏺ Read(PR #${Math.max(12, nextPR - 1)} summary)`],
            ["out", "  ⎿  CodeRabbit: 0 blocking issues"],
          ],
          () => [
            [
              "think",
              "✻ Sequencing the next tasks so Bob and Alice don't collide…",
            ],
          ],
          () => [
            [
              "say",
              "⏺ Plan is on track. Next milestone: Ask endpoint + citations.",
            ],
          ],
        ])();
      }

      /** Asks for human input; John (or the owner) answers automatically after a few seconds unless the user clicks first. */
      function askInput(a, question, answerer, onResolved) {
        const id = ++inputSeq;
        a.pendingInput = { id, ...question, onResolved };
        setState(a, "input");
        say(a, "⏺ I need input before continuing:", "warn");
        say(a, `  ? ${question.q}`, "warn");
        question.opts.forEach((o, i) => say(a, `    ${i + 1}. ${o}`, "dim"));
        log(`${a.name} needs input`, STATE.input.css);
        after(rand(4, 6), () => resolveInput(a, id, answerer, 0));
      }

      function resolveInput(a, id, by, idx) {
        const p = a.pendingInput;
        if (!p || p.id !== id) return; // already answered
        a.pendingInput = null;
        say(a, `> ${by}: ${p.opts[idx]}`, "prompt");
        log(`${by} answered ${a.name}: “${p.opts[idx]}”`, "#a78bfa");
        if (by === "John")
          say(john, `⏺ Answered ${a.name}: ${p.opts[idx]}`, "say");
        p.onResolved();
      }

      /** Work for `dur` seconds, optionally pausing once for input, then call `then`. */
      function work(a, dur, allowInput, then) {
        setState(a, "working");
        a.nextStep = simTime + 0.4;
        if (allowInput && chance(0.4)) {
          const first = dur * rand(0.35, 0.6);
          after(first, () =>
            askInput(a, pick(DEV_QUESTIONS), "John", () => {
              setState(a, "working");
              after(dur - first, then);
            }),
          );
        } else after(dur, then);
      }

      function startNext(a) {
        const task = tasks
          .filter((t) => t.owner === a.id && t.col === "todo")
          .sort((x, y) => x.enteredAt - y.enteredAt)[0];
        if (!task) {
          a.task = null;
          setState(a, "idle");
          after(2, () => startNext(a));
          return;
        }
        a.task = task;
        moveTask(task, "progress");
        say(a, `> Implement ${task.id}: ${task.title}`, "prompt");
        log(`${a.name} started ${task.id} · ${task.title}`, STATE.working.css);
        work(a, rand(7, 11), true, () => openPR(a));
      }

      function openPR(a) {
        const task = a.task;
        const pr = {
          num: nextPR++,
          title: task.title,
          agent: a,
          task,
          status: "queued",
          rounds: 0,
        };
        prs.push(pr);
        task.pr = pr.num;
        moveTask(task, "review");
        setState(a, "waiting");
        say(
          a,
          `⏺ Bash(gh pr create --title "${task.id}: ${task.title}")`,
          "tool",
        );
        say(a, `  ⎿  https://github.com/jsm/askwell/pull/${pr.num}`, "out");
        say(a, `◷ Waiting for CodeRabbit to review #${pr.num}…`, "dim");
        log(`${a.name} opened PR #${pr.num}`, STATE.waiting.css);
        markDirty("prs");
        new Token(pr);
      }

      function startReview(tk) {
        const pr = tk.pr;
        pr.status = "reviewing";
        markDirty("prs");
        setGateMode("reviewing");
        log(`CodeRabbit is reviewing #${pr.num}`, STATE.waiting.css);
        after(rand(3, 4.5), () => verdict(tk));
      }

      function verdict(tk) {
        const pr = tk.pr,
          a = pr.agent;
        gate.busy = null;
        gate.cooldownUntil = simTime + 1.3;
        const pass = pr.rounds > 0 || chance(0.72);
        if (pass) {
          pr.status = "approved";
          markDirty("prs");
          setGateMode("passed");
          setState(a, "passed");
          say(a, `✓ CodeRabbit approved PR #${pr.num}`, "ok");
          log(`CodeRabbit approved #${pr.num}`, STATE.passed.css);
          tk.go("toMain", () => merge(pr));
          after(3.4, () => {
            a.task = null;
            setState(a, "idle");
            say(a, "✻ Idle — waiting for the next task", "dim");
            after(rand(1.2, 2.4), () => startNext(a));
          });
        } else {
          const c = pick(REVIEW_COMMENTS);
          pr.status = "changes";
          pr.rounds++;
          markDirty("prs");
          setGateMode("changes");
          say(a, `✗ CodeRabbit requested changes on #${pr.num}: ${c}`, "err");
          log(`CodeRabbit requested changes on #${pr.num}`, STATE.input.css);
          tk.go("back");
          say(a, `> Address the review feedback on #${pr.num}`, "prompt");
          work(a, rand(4, 6), false, () => {
            pr.status = "queued";
            markDirty("prs");
            setState(a, "waiting");
            say(a, "⏺ Bash(git push)", "tool");
            say(a, `  ⎿  Pushed fixes to #${pr.num}`, "out");
            log(`${a.name} pushed fixes to #${pr.num}`, STATE.waiting.css);
            new Token(pr);
          });
        }
      }

      function merge(pr) {
        pr.status = "merged";
        mergedCount++;
        moveTask(pr.task, "done");
        racks[0].pulse = 1;
        say(pr.agent, `⏺ Merged #${pr.num} into main`, "ok");
        log(`#${pr.num} merged into main`, "#a78bfa");
        markDirty("prs", "plan");
        // Keep the DONE column short
        const done = tasks
          .filter((t) => t.col === "done")
          .sort((x, y) => y.enteredAt - x.enteredAt);
        for (const t of done.slice(6)) tasks.splice(tasks.indexOf(t), 1);
        after(6, () => {
          prs.splice(prs.indexOf(pr), 1);
          markDirty("prs");
        });
      }

      function addTask(owner) {
        const title = TASK_POOL[poolIdx++ % TASK_POOL.length];
        const t = {
          id: `P3-T${String(nextTaskNum++).padStart(2, "0")}`,
          title,
          owner: owner.id,
          col: "todo",
          enteredAt: simTime,
        };
        tasks.push(t);
        markDirty("plan");
        return t;
      }

      /** The lead keeps the backlog full, answers questions, and occasionally needs a human. */
      function johnNext() {
        const needy = devs.find(
          (d) =>
            tasks.filter((t) => t.owner === d.id && t.col === "todo").length <
            2,

        if (needy) {
          john.task = { id: null, title: `Planning work for ${needy.name}` };
          say(john, `> Plan the next task for ${needy.name}`, "prompt");
          work(john, rand(3, 4.5), false, () => {
            const t = addTask(needy);
            say(
              john,
              `⏺ TaskCreate(${t.id}: "${t.title}", owner: ${needy.id})`,
              "tool",

            say(john, "  ⎿  Added to TODO", "ok");
            log(
              `John planned ${t.id} · ${t.title} for ${needy.name}`,
              "#a78bfa",
            );
            johnNext();
          });
          return;
        }
        const r = Math.random();
        const reviewing = prs.find(
          (p) => p.status === "reviewing" || p.status === "queued",
        );
        if (r < 0.14) {
          john.task = { id: null, title: "Scope check with the owner" };
          askInput(john, pick(JOHN_QUESTIONS), "Owner", () => {
            setState(john, "working");
            after(1.5, johnNext);
          });
        } else if (r < 0.3 && reviewing) {
          john.task = {
            id: null,
            title: `Waiting on review of #${reviewing.num}`,
          };
          setState(john, "waiting");
          say(john, `◷ Waiting for CodeRabbit on #${reviewing.num}…`, "dim");
          after(rand(3, 5), johnNext);
        } else if (r < 0.72) {
          john.task = {
            id: null,
            title: pick([
              "Reviewing the Phase 3 plan",
              "Checking sandbox health",
              "Reading PR summaries",
              "Updating the roadmap",
            ]),
          };
          say(john, `> ${john.task.title}`, "prompt");
          work(john, rand(4, 7), false, johnNext);
        } else {
          john.task = null;
          setState(john, "idle");
          after(rand(2.5, 4), johnNext);
        }
      }

      /** Emits fake tool output while an agent is working. */
      function updateAgentTerminals() {
        for (const a of AGENTS) {
          if (a.state !== "working" || simTime < a.nextStep || !a.task)
            continue;
          const [first, second] = a.id === "john" ? johnStep(a) : devStep(a);
          say(a, first[1], first[0]);
          if (second)
            after(rand(0.25, 0.55), () => {
              if (a.state === "working") say(a, second[1], second[0]);
            });
          a.nextStep = simTime + rand(0.9, 1.7);
        }
      }

      /* =====================================================================
   12. UI OVERLAY (team cards, feed, terminal panel, board modal)
===================================================================== */

        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],

      // Team cards

      // Activity feed
      const feedList = $("feedList");
      function log(text, color = "#94a3b8") {
        const li = document.createElement("li");
        const now = new Date();
        const time = [now.getHours(), now.getMinutes(), now.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
        const html = esc(text)
          .replace(/\b(John|Bob|Alice|CodeRabbit|Owner|You)\b/g, "<b>$1</b>")
          .replace(/#(\d+)/g, '<span class="pr">#$1</span>');
        li.style.setProperty("--c", color);
        li.innerHTML = `<time>${time}</time><span>${html}</span>`;
        feedList.prepend(li);
        while (feedList.children.length > 7) feedList.lastChild.remove();
      }

      // Terminal panel
      const termEl = $("terminal"),
        termBody = $("termBody"),
        termFoot = $("termFoot"),
        termTitle = $("termTitle");
      let termAgent = null,
        termSeq = 0,
        footSig = "";

      function lineHTML(ln) {
        const t = esc(ln.text);
        if (ln.kind === "tool")
          return `<div class="tl k-tool"><span class="dot">⏺</span>${t.replace(/^⏺/, "")}</div>`;
        if (ln.kind === "prompt")
          return `<div class="tl"><span class="k-prompt">${t}</span></div>`;
        return `<div class="tl k-${ln.kind}">${t}</div>`;
      }

      function openTerminal(a) {
        termAgent = a;
        termTitle.textContent = `${a.id}@sandbox-${a.id} — claude — ~/askwell`;
        termBody.innerHTML =
          `<div class="term-welcome"><span class="star">✻</span> Welcome to <b>Claude Code</b>!<div>/help for help · /status for your current setup</div><div>cwd: /workspace/askwell · agent: ${a.name} (${a.role})</div></div>` +
          a.term.lines.map(lineHTML).join("");
        termBody
          .querySelectorAll(".tl")
          .forEach((n) => n.classList.remove("tl")); // no reveal animation for history
        termSeq = a.term.seq;
        footSig = "";
        termEl.classList.add("open");
        syncTerminal(true);
        termBody.scrollTop = termBody.scrollHeight;
      }

      function closeTerminalPanel() {
        termEl.classList.remove("open");
        termAgent = null;
      }

      /** Appends new lines and refreshes the footer (status / input question). */
      function syncTerminal() {
        const a = termAgent;
        if (!a) return;
        if (a.term.seq > termSeq) {
          const atBottom =
            termBody.scrollHeight - termBody.scrollTop - termBody.clientHeight <
            60;
          const fresh = a.term.lines.filter((l) => l.seq > termSeq);
          termBody.insertAdjacentHTML(
            "beforeend",
            fresh.map(lineHTML).join(""),
          );
          termSeq = a.term.seq;
          while (termBody.children.length > 260) termBody.children[1].remove();
          if (atBottom) termBody.scrollTop = termBody.scrollHeight;
        }
        // Footer: only rebuild the DOM when the state/question changes
        const sig = `${a.state}|${a.pendingInput?.id || ""}`;
        if (sig !== footSig) {
          footSig = sig;
          if (a.pendingInput) {
            const p = a.pendingInput;
            termFoot.innerHTML = `<div class="ask"><div class="q"><b>? ${esc(a.name)} needs your input</b><br>${esc(p.q)}</div><div class="opts">${p.opts.map((o, i) => `<button data-i="${i}">${i + 1}. ${esc(o)}</button>`).join("")}</div></div>`;
            termFoot
              .querySelectorAll("button")
              .forEach((b) =>
                b.addEventListener("click", () =>
                  resolveInput(a, p.id, "You", +b.dataset.i),
                ),
              );
          } else {
            termFoot.innerHTML = `<div class="status-line" data-state="${a.state}"><span class="spin"></span><span class="status-text"></span></div><div class="prompt-line">&gt; <span class="cursor"></span></div>`;
          }
        }
        const spin = termFoot.querySelector(".spin"),
          text = termFoot.querySelector(".status-text");
        if (spin && text) {
          const map = {
            working: `${a.activity}… (esc to close)`,
            waiting: "Waiting for CodeRabbit review…",
            passed: "Review passed — merging",
            idle: "Idle · waiting for the next task",
          };
          spin.textContent =
            a.state === "working"
              ? SPINNER[Math.floor(simTime * 8) % SPINNER.length]
              : a.state === "passed"
                ? "✓"
                : a.state === "waiting"
                  ? "◷"
                  : "·";
          text.textContent = map[a.state] || "";
        }
      }

      // Board modal (plan wall / PR board as flat panels)
      const modalEl = $("modal"),
        modalBody = $("modalBody"),
        modalTitle = $("modalTitle");
      let modalKind = null;

      function openModal(kind) {
        modalKind = kind;
        modalEl.classList.add("open");
        renderModal();
      }
      function closeModal() {
        modalEl.classList.remove("open");
        modalKind = null;
      }

      function renderModal() {
        if (modalKind === "plan") {
          modalTitle.innerHTML = `Plan wall <small>Askwell · Phase 3 · ${tasks.length} tasks</small>`;
          modalBody.innerHTML = `<div class="kanban">${COLS.map((col) => {
            const list = tasks
              .filter((t) => t.col === col)
              .sort((a, b) =>
                col === "done"
                  ? b.enteredAt - a.enteredAt
                  : a.enteredAt - b.enteredAt,
              );
            return `<div class="kcol"><h3>${COL_TITLES[col]}<span>${list.length}</span></h3>${list
              .map((t) => {
                const o = agentById[t.owner];
                return `<div class="kcard" style="--c:${o.color}"><div class="id">${t.col === "done" ? "✓ " : ""}${t.id}</div><div class="t">${esc(t.title)}</div><div class="o"><span>${o.name}</span>${t.pr && t.col === "review" ? `<em>PR #${t.pr}</em>` : ""}</div></div>`;
              })
              .join("")}</div>`;
          }).join("")}</div>`;
        } else if (modalKind === "prs") {
          const gateText = {
            idle: "Idle",
            reviewing: "Reviewing",
            passed: "Approved a PR",
            changes: "Requested changes",
          }[gate.mode];
          modalTitle.innerHTML = `Pull requests <small>reviewed by CodeRabbit</small>`;
          modalBody.innerHTML =
            `<div class="gate-summary"><span>Review gate: <b>${gateText}</b></span><span>Queue: <b>${gate.queue.length}</b></span><span>Merged into main: <b>${mergedCount}</b></span></div>` +
            (prs.length
              ? `<table class="prlist"><thead><tr><th>#</th><th>Title</th><th>Author</th><th class="hide-sm">Task</th><th>Review</th></tr></thead><tbody>${prs
                  .map((pr) => {
                    const st = PR_STATUS[pr.status];
                    return `<tr><td class="num">#${pr.num}</td><td>${esc(pr.title)}</td><td><span class="who" style="--c:${pr.agent.color}"><i></i>${pr.agent.name}</span></td><td class="hide-sm" style="font-family:var(--mono);color:var(--muted)">${pr.task.id}</td><td><span class="pill" style="--c:${st.css}">${st.label}</span></td></tr>`;
                  })
                  .join("")}</tbody></table>`
              : `<div class="empty">No open PRs — everything is merged ✓</div>`);
        }
      }

      $("termClose").addEventListener("click", () => unfocus());
      $("modalClose").addEventListener("click", closeModal);
      modalEl.addEventListener("click", (e) => {
        if (e.target === modalEl) closeModal();
      });
      addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (modalKind) closeModal();
        else if (focused) unfocus();
      });

      /* =====================================================================
   13. CAMERA: overview framing, pod focus, smooth tweens, view offset
===================================================================== */
      let focused = null;
      const tween = {
        active: false,
        t: 0,
        dur: 1.2,
        p0: new THREE.Vector3(),
        p1: new THREE.Vector3(),
        q0: new THREE.Vector3(),
        q1: new THREE.Vector3(),
        lift: 0,
      };
      const viewShift = { x: 0, y: 0 };
      const isNarrow = () => innerWidth <= 760;
      const termWidth = () => Math.min(560, innerWidth * 0.44) + 16;

      /** Screen region (px) not covered by overlay panels; the camera centres content in it. */
      function freeRegion() {
        const W = innerWidth,
          H = innerHeight;
        if (isNarrow())
          return focused
            ? { x0: 0, x1: W, y0: 150, y1: H * 0.42 }
            : { x0: 0, x1: W, y0: 150, y1: H - 150 };
        const left = 300;
        if (focused) {
          const right = W - termWidth() - 16;
          return {
            x0: right - left > 360 ? left : 0,
            x1: right,
            y0: 70,
            y1: H,
          };
        }
        return { x0: left, x1: W, y0: 70, y1: H };
      }

      /** Distance needed so an object of world size (w,h) fills `fill` of the free region. */
      function fitDistance(w, h, fill) {
        const W = innerWidth,
          H = innerHeight,
          r = freeRegion();
        const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        const dw =
          ((w / fill) * W) / ((r.x1 - r.x0) * 2 * tanV * camera.aspect);
        const dh = ((h / fill) * H) / ((r.y1 - r.y0) * 2 * tanV);
        return Math.max(dw, dh);
      }

      function overviewPose() {
        const target = V3(4.0, 0.4, -1.2);
        const dir = V3(-0.04, 0.58, 0.82).normalize();
        const D = clamp(fitDistance(isNarrow() ? 25 : 31, 15, 1), 22, 110); // crop a little on phones
        return { pos: target.clone().addScaledVector(dir, D), target };
      }

      function podPose(a) {
        const [w, h, d] = a.size;
        const target = V3(a.pos[0], h * 0.55, a.pos[2] + d / 2);
        const dir = V3(0.16, 0.3, 1).normalize();
        const D = Math.max(4.5, fitDistance(w, h, 0.72));
        return { pos: target.clone().addScaledVector(dir, D), target };
      }

      function flyTo(pose, dur = 1.2, lift = 1.2) {
        tween.active = true;
        tween.t = 0;
        tween.dur = dur;
        tween.lift = lift;
        tween.p0.copy(camera.position);
        tween.p1.copy(pose.pos);
        tween.q0.copy(controls.target);
        tween.q1.copy(pose.target);
        controls.enabled = false;
      }

      function focusPod(a) {
        if (modalKind) closeModal();
        focused = a;
        flyTo(podPose(a));
        setTimeout(() => {
          if (focused === a) openTerminal(a);
        }, 450);
        markDirty("team");
      }

      function unfocus() {
        if (!focused) return;
        focused = null;
        closeTerminalPanel();
        flyTo(overviewPose());
        markDirty("team");
      }

      function updateCamera(dt) {
        if (tween.active) {
          tween.t = Math.min(1, tween.t + dt / tween.dur);
          const e = easeInOut(tween.t);
          camera.position.lerpVectors(tween.p0, tween.p1, e);
          camera.position.y += Math.sin(e * Math.PI) * tween.lift;
          controls.target.lerpVectors(tween.q0, tween.q1, e);
          if (tween.t >= 1) {
            tween.active = false;
            controls.enabled = true;
          }
        }
        // Shift the projection so content centres in the area not covered by UI panels
        const r = freeRegion();
        const tx = innerWidth / 2 - (r.x0 + r.x1) / 2,
          ty = innerHeight / 2 - (r.y0 + r.y1) / 2;
        viewShift.x += (tx - viewShift.x) * damp(5, dt);
        viewShift.y += (ty - viewShift.y) * damp(5, dt);
        camera.setViewOffset(
          innerWidth,
          innerHeight,
          viewShift.x,
          viewShift.y,
          innerWidth,
          innerHeight,
        );
      }

      /* =====================================================================
   14. INTERACTION: picking, hover tooltip, resize
===================================================================== */
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      const tooltip = $("tooltip");
      let downAt = null,
        hoverPending = null;

      function pickAt(x, y) {
        ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        const hit = raycaster.intersectObjects(pickables, false)[0];
        return hit ? hit.object.userData.pick : null;
      }

      function describe(p) {
        if (!p) return "";
        if (p.type === "pod") return `Open ${p.agent.name}'s terminal`;
        return p.type === "plan" ? "Open the plan wall" : "Open the PR board";
      }

      // A click only counts if the pointer barely moved (otherwise it was an orbit drag)
      canvas.addEventListener("pointerdown", (e) => {
        downAt = { x: e.clientX, y: e.clientY };
      });
      canvas.addEventListener("pointerup", () => {
        setTimeout(() => (downAt = null), 0);
      });
      canvas.addEventListener("click", (e) => {
        const moved = downAt
          ? Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y)
          : 0;
        if (moved > 6) return;
        const p = pickAt(e.clientX, e.clientY);
        if (!p) return;
        if (p.type === "pod") focusPod(p.agent);
        else openModal(p.type);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (e.pointerType === "mouse")
          hoverPending = { x: e.clientX, y: e.clientY };
      });
      canvas.addEventListener("pointerleave", () => {
        hoverPending = null;
        tooltip.classList.remove("show");
        canvas.style.cursor = "";
      });

      /** Hover raycast at most once per frame. */
      function updateHover() {
        if (!hoverPending) return;
        const { x, y } = hoverPending;
        hoverPending = null;
        if (downAt) return;
        const p = pickAt(x, y);
        canvas.style.cursor = p ? "pointer" : "";
        if (p) {
          tooltip.textContent = describe(p);
          tooltip.style.left = x + "px";
          tooltip.style.top = y + "px";
          tooltip.classList.add("show");
        } else tooltip.classList.remove("show");
      }

      function onResize() {
        const W = innerWidth,
          H = innerHeight;
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(pixelRatio());
        renderer.setSize(W, H, false);
        composer.setPixelRatio(pixelRatio());
        composer.setSize(W, H);
        bloom.resolution.set(W, H);
        viewShift.x = viewShift.y = 0;
        // Re-frame whatever we're looking at so it fits the new size
        const pose = focused ? podPose(focused) : overviewPose();
        if (!tween.active) {
          camera.position.copy(pose.pos);
          controls.target.copy(pose.target);
        }
      }
      addEventListener("resize", onResize);

      /* =====================================================================
   15. BUILD THE WORLD + START
===================================================================== */
      const env = buildEnvironment();
      for (const a of AGENTS) a.pod = createPod(a);
      const planWall = createPlanWall();
      const gate = createGate();
      const prBoard = createPRBoard();
      const racks = RACKS.map(createRack);
      const pipes = [
        createPipe(
          agentById.bob,
          [
            V3(-7.5, 3.12, 2.2),
            V3(-7.5, 6.3, 2.2),
            V3(13, 6.3, 2.2),
            V3(13, 6.3, RACK_Z),
            V3(13, 3.62, RACK_Z),
          ],
          "#60a5fa",
        ),
        createPipe(
          agentById.alice,
          [
            V3(-1.5, 3.12, 2.6),
            V3(-1.5, 5.5, 2.6),
            V3(15.4, 5.5, 2.6),
            V3(15.4, 5.5, RACK_Z),
            V3(15.4, 3.62, RACK_Z),
          ],
          "#f472b6",
        ),
      ];

      // Seed terminals so the screens aren't empty at first
      for (const a of AGENTS) {
        say(a, `✻ Claude Code · sandbox-${a.id} ready`, "think");
        say(a, "⏺ Bash(git pull origin main)", "tool");
        say(a, "  ⎿  Already up to date.", "out");
        say(a, "⏺ Read(CLAUDE.md)", "tool");
        say(a, `  ⎿  Read ${randi(60, 120)} lines`, "out");
      }
      log("3 sandboxes started: john, bob, alice", STATE.passed.css);
      log("John loaded the Phase 3 plan (6 tasks)", "#a78bfa");
      for (const a of AGENTS) setState(a, "idle");

      // Kick off the simulation
      after(0.8, johnNext);
      after(1.2, () => startNext(agentById.bob));
      after(3.0, () => startNext(agentById.alice));

      const start = overviewPose();
      camera.position.copy(start.pos);
      controls.target.copy(start.target);
      // Gentle intro sweep
      camera.position.add(V3(-6, 6, 8));
      flyTo(start, 2.2, 0);

      /* =====================================================================
   16. MAIN LOOP
===================================================================== */
      const clock = new THREE.Clock();
      const TIME_SCALE = clamp(
        +new URLSearchParams(location.search).get("speed") || 1,
        0.1,
        30,
      ); // e.g. index.html?speed=3
      let uiTick = 0;

      renderer.setAnimationLoop(() => {
        const dt = Math.min(clock.getDelta(), 0.05) * TIME_SCALE; // clamp so hidden tabs don't jump the sim
        simTime += dt;
        const t = simTime;

        runTimers();
        updateAgentTerminals();
        updateGateQueue();

        for (const a of AGENTS) updatePod(a, dt, t);
        updateGate(dt, t);
        for (let i = tokens.length - 1; i >= 0; i--) {
          tokens[i].update(dt, t);
          if (tokens[i].dead) {
            tokens[i].dispose();
            tokens.splice(i, 1);
          }
        }
        updateRacks(dt, t);
        updatePipes(dt);

        if (dirty.plan) {
          dirty.planWall = true;
        }
        updatePlanWall(dt, t);
        if (dirty.prs) drawPRBoard();
        prBoard.neonMat.color.copy(gate.color).multiplyScalar(1.1);

        // Dust drift
        const dp = env.dust.geometry.attributes.position.array;
        for (let i = 0; i < env.speed.length; i++) {
          dp[i * 3 + 1] += env.speed[i] * dt;
          if (dp[i * 3 + 1] > 9) dp[i * 3 + 1] = 0;
        }
        env.dust.geometry.attributes.position.needsUpdate = true;

        // HTML overlay (cheap, throttled)
        if (dirty.team) renderTeam();
        if (modalKind && (dirty.plan || dirty.prs)) renderModal();
        dirty.plan = dirty.prs = dirty.team = false;
        if (t - uiTick > 0.1) {
          uiTick = t;
          syncTerminal();
          updateSince();
        }

        updateCamera(dt);
        controls.update();
        updateHover();
        composer.render(dt);
      });
    </script>
  </body>
</html>
