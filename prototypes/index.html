<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JSM HQ</title>
    <style>
      /* ------------------------------------------------------------------
     Design tokens
  ------------------------------------------------------------------ */
      :root {
        --bg: #070b1a;
        --panel: rgba(10, 16, 36, 0.74);
        --panel-solid: #0a1024;
        --border: rgba(125, 211, 252, 0.14);
        --border-strong: rgba(125, 211, 252, 0.28);
        --text: #e2e8f0;
        --muted: #8796b5;
        --dim: #56627e;
        --cyan: #22d3ee;
        --red: #f43f5e;
        --amber: #fbbf24;
        --green: #34d399;
        --gray: #64748b;
        --violet: #a78bfa;
        --sans:
          "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --mono:
          ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --radius: 14px;
        --gutter: 16px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      canvas#scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      button {
        font: inherit;
        color: inherit;
      }

      .glass {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      }

      /* ------------------------------------------------------------------
     Top bar
  ------------------------------------------------------------------ */
      #topbar {
        position: fixed;
        top: 12px;
        left: var(--gutter);
        right: var(--gutter);
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px;
        z-index: 10;
        pointer-events: none;
      }
      #topbar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
        min-width: 0;
      }
      #topbar .brand .logo {
        width: 26px;
        height: 26px;
        flex: none;
      }
      #topbar .brand .sep {
        color: var(--dim);
        font-weight: 400;
      }
      #topbar .brand .project {
        color: var(--muted);
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #topbar .brand .project b {
        color: var(--text);
        font-weight: 600;
      }
      .sandbox-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.08);
        border: 1px solid rgba(52, 211, 153, 0.25);
        font-size: 13px;
        color: #bbf7d0;
        white-space: nowrap;
      }
      .sandbox-pill svg {
        width: 16px;
        height: 16px;
      }
      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      /* ------------------------------------------------------------------
     Team cards
  ------------------------------------------------------------------ */
      #team {
        position: fixed;
        top: 72px;
        left: var(--gutter);
        width: 272px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
      }
      .agent-card {
        padding: 12px 14px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          transform 0.2s;
        text-align: left;
        width: 100%;
      }
      .agent-card:hover {
        border-color: var(--border-strong);
        transform: translateX(2px);
      }
      .agent-card.focused {
        border-color: var(--state-color, var(--cyan));
      }
      .ac-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        flex: none;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
        color: #0b1020;
        background: var(--c);
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.06),
          0 0 14px color-mix(in srgb, var(--c) 45%, transparent);
      }
      .ac-name {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
        min-width: 0;
        flex: 1;
      }
      .ac-name b {
        font-size: 14px;
      }
      .ac-name span {
        font-size: 12px;
        color: var(--muted);
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 999px;
        white-space: nowrap;
        color: var(--state-color);
        background: color-mix(in srgb, var(--state-color) 13%, transparent);
        border: 1px solid
          color-mix(in srgb, var(--state-color) 35%, transparent);
      }
      .badge[data-state="input"] {
        animation: pulse 0.8s ease-in-out infinite;
      }
      .ac-task {
        margin-top: 9px;
        font-size: 12.5px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ac-task .tid {
        font-family: var(--mono);
        color: var(--muted);
        font-size: 11.5px;
        margin-right: 4px;
      }
      .ac-task.none {
        color: var(--dim);
      }
      .ac-meta {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--dim);
        font-family: var(--mono);
      }
      .ac-bar {
        flex: 1;
        height: 3px;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.12);
        overflow: hidden;
      }
      .ac-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 3px;
        background: var(--state-color);
        opacity: 0.85;
      }
      .agent-card[data-state="working"] .ac-bar i {
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      /* ------------------------------------------------------------------
     Activity feed
  ------------------------------------------------------------------ */
      #feed {
        position: fixed;
        left: var(--gutter);
        bottom: var(--gutter);
        width: 360px;
        padding: 12px 14px 8px;
        z-index: 10;
        pointer-events: none;
      }
      .panel-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      #feed ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      #feed li {
        display: flex;
        gap: 10px;
        align-items: baseline;
        font-size: 12.5px;
        padding: 4px 0;
        border-top: 1px solid rgba(148, 163, 184, 0.06);
        animation: feedIn 0.45s ease-out;
      }
      #feed li:first-child {
        border-top: 0;
      }
      #feed li time {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        flex: none;
      }
      #feed li span {
        color: #c7d2e6;
      }
      #feed li > span::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--c);
        margin-right: 7px;
        vertical-align: 1px;
        box-shadow: 0 0 6px var(--c);
      }
      #feed b {
        color: var(--text);
        font-weight: 600;
      }
      #feed .pr {
        font-family: var(--mono);
        color: var(--violet);
      }
      @keyframes feedIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
          background: rgba(34, 211, 238, 0.08);
        }
      }

      #hint {
        position: fixed;
        right: var(--gutter);
        bottom: var(--gutter);
        font-size: 12px;
        color: var(--muted);
        padding: 8px 12px;
        z-index: 5;
        pointer-events: none;
      }
      #hint kbd {
        font-family: var(--mono);
        font-size: 11px;
        padding: 1px 5px;
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        color: var(--text);
      }

      #tooltip {
        position: fixed;
        z-index: 30;
        pointer-events: none;
        padding: 5px 9px;
        font-size: 12px;
        border-radius: 8px;
        background: rgba(8, 12, 28, 0.92);
        border: 1px solid var(--border-strong);
        color: var(--text);
        transform: translate(14px, 14px);
        opacity: 0;
        transition: opacity 0.12s;
      }
      #tooltip.show {
        opacity: 1;
      }

      /* ------------------------------------------------------------------
     Terminal panel (opens when a pod is clicked)
  ------------------------------------------------------------------ */
      #terminal {
        position: fixed;
        top: 72px;
        right: var(--gutter);
        bottom: var(--gutter);
        width: min(560px, 44vw);
        display: flex;
        flex-direction: column;
        z-index: 20;
        overflow: hidden;
        background: rgba(5, 9, 20, 0.94);
        border-radius: var(--radius);
        border: 1px solid var(--border-strong);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(0, 0, 0, 0.4);
        transform: translateX(calc(100% + 40px));
        transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        font-family: var(--mono);
        font-size: 12.5px;
      }
      #terminal.open {
        transform: none;
      }
      .term-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.6);
      }
      .term-dots {
        display: flex;
        gap: 6px;
      }
      .term-dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #334155;
      }
      .term-dots i:nth-child(1) {
        background: #f87171;
      }
      .term-dots i:nth-child(2) {
        background: #fbbf24;
      }
      .term-dots i:nth-child(3) {
        background: #34d399;
      }
      .term-title {
        flex: 1;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .icon-btn {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: grid;
        place-items: center;
        font-size: 16px;
        line-height: 1;
      }
      .icon-btn:hover {
        color: var(--text);
        border-color: var(--border-strong);
        background: rgba(148, 163, 184, 0.08);
      }
      .term-body {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        scrollbar-width: thin;
        scrollbar-color: #1e293b transparent;
      }
      .term-welcome {
        border: 1px solid #c084fc66;
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 12px;
        color: #cbd5e1;
      }
      .term-welcome .star {
        color: #e879f9;
      }
      .term-welcome div {
        color: var(--dim);
      }
      .tl {
        animation: reveal 0.35s steps(24, end);
      }
      @keyframes reveal {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      .k-prompt {
        color: #f8fafc;
        background: rgba(148, 163, 184, 0.08);
        border-radius: 4px;
        padding: 0 4px;
        margin: 6px 0 2px;
        display: inline-block;
      }
      .k-tool {
        color: #e2e8f0;
      }
      .k-tool .dot {
        color: #4ade80;
      }
      .k-out {
        color: #7c8aa5;
      }
      .k-ok {
        color: #4ade80;
      }
      .k-err {
        color: #fb7185;
      }
      .k-warn {
        color: #fbbf24;
      }
      .k-think {
        color: #c4b5fd;
        font-style: italic;
      }
      .k-say {
        color: #e2e8f0;
      }
      .k-dim {
        color: var(--dim);
      }
      .term-foot {
        border-top: 1px solid var(--border);
        padding: 10px 14px 12px;
        background: rgba(15, 23, 42, 0.45);
      }
      .status-line {
        color: #fda4af;
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 20px;
      }
      .status-line[data-state="working"] {
        color: #67e8f9;
      }
      .status-line[data-state="waiting"] {
        color: #fcd34d;
      }
      .status-line[data-state="passed"] {
        color: #6ee7b7;
      }
      .status-line[data-state="idle"] {
        color: var(--dim);
      }
      .prompt-line {
        margin-top: 8px;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 7px 10px;
        color: var(--muted);
      }
      .cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        background: #e2e8f0;
        vertical-align: -3px;
        margin-left: 2px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .ask {
        border: 1px solid #f43f5e88;
        border-radius: 8px;
        padding: 10px 12px;
        background: rgba(244, 63, 94, 0.06);
      }
      .ask .q {
        color: #fecdd3;
        margin-bottom: 8px;
      }
      .ask .q b {
        color: #fb7185;
      }
      .ask .opts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .ask button {
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #0f172a;
        color: var(--text);
        cursor: pointer;
      }
      .ask button:hover {
        border-color: var(--cyan);
        color: #a5f3fc;
      }

      /* ------------------------------------------------------------------
     Board modal (plan wall / PR board as 2D panels)
  ------------------------------------------------------------------ */
      #modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        padding: var(--gutter);
        background: rgba(3, 6, 16, 0.55);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      #modal.open {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-card {
        width: min(1120px, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: rgba(8, 13, 30, 0.96);
        transform: translateY(12px) scale(0.98);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #modal.open .modal-card {
        transform: none;
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        flex: 1;
      }
      .modal-head h2 small {
        color: var(--muted);
        font-weight: 500;
        margin-left: 8px;
        font-size: 13px;
      }
      .modal-body {
        padding: 16px 18px 18px;
        overflow: auto;
      }

      .kanban {
        display: grid;
        grid-template-columns: repeat(4, minmax(200px, 1fr));
        gap: 12px;
      }
      .kcol {
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        min-height: 260px;
      }
      .kcol h3 {
        margin: 2px 4px 10px;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
      }
      .kcol h3 span {
        color: var(--text);
        background: rgba(148, 163, 184, 0.12);
        border-radius: 999px;
        padding: 0 7px;
      }
      .kcard {
        background: #0f1830;
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-left: 3px solid var(--c);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 8px;
        animation: feedIn 0.4s ease-out;
      }
      .kcard .id {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--c);
      }
      .kcard .t {
        font-size: 13px;
        margin: 2px 0 6px;
      }
      .kcard .o {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
      }
      .kcard .o em {
        font-style: normal;
        font-family: var(--mono);
        color: var(--amber);
      }

      .prlist {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .prlist th {
        text-align: left;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-weight: 600;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        text-transform: uppercase;
      }
      .prlist td {
        padding: 10px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.07);
      }
      .prlist .num {
        font-family: var(--mono);
        color: var(--violet);
        font-weight: 600;
      }
      .prlist .who {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .prlist .who i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
      }
      .pill {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
        white-space: nowrap;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 13%, transparent);
        border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
      }
      .empty {
        color: var(--muted);
        padding: 28px;
        text-align: center;
      }
      .gate-summary {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .gate-summary b {
        color: var(--text);
      }

      /* ------------------------------------------------------------------
     Small screens
  ------------------------------------------------------------------ */
      @media (max-width: 760px) {
        :root {
          --gutter: 12px;
        }
        #topbar {
          height: 44px;
          top: 8px;
          padding: 0 10px;
        }
        #topbar .brand {
          font-size: 14px;
          gap: 8px;
        }
        #topbar .brand .sep,
        .sandbox-pill .label-long {
          display: none;
        }
        .sandbox-pill {
          padding: 5px 9px;
          font-size: 12px;
        }
        #team {
          top: 60px;
          left: 0;
          right: 0;
          width: auto;
          flex-direction: row;
          overflow-x: auto;
          padding: 0 var(--gutter) 6px;
          scrollbar-width: none;
        }
        #team::-webkit-scrollbar {
          display: none;
        }
        .agent-card {
          min-width: 200px;
          padding: 10px 12px;
        }
        .ac-meta {
          display: none;
        }
        #feed {
          left: var(--gutter);
          right: var(--gutter);
          width: auto;
        }
        #feed li:nth-child(n + 4) {
          display: none;
        }
        #hint {
          display: none;
        }
        #terminal {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          height: 58vh;
          border-radius: 16px 16px 0 0;
          transform: translateY(calc(100% + 40px));
        }
        .kanban {
          grid-template-columns: repeat(4, 78vw);
          overflow-x: auto;
        }
        .prlist .hide-sm {
          display: none;
        }
      }
      @media (max-width: 1100px) and (min-width: 761px) {
        #feed {
          width: 300px;
        }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="3D view of JSM HQ"></canvas>

    <!-- ============================ UI OVERLAY ============================ -->
    <header id="topbar" class="glass">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path
            d="M16 3 28 10v12L16 29 4 22V10L16 3Z"
            stroke="#22d3ee"
            stroke-width="2" />
          <path
            d="M16 3v26M4 10l12 7 12-7"
            stroke="#a78bfa"
            stroke-width="1.6"
            opacity=".8" />
        </svg>
        <span>JSM HQ</span><span class="sep">—</span
        ><span class="project">Project: <b>Askwell</b></span>
      </div>
      <div

    <script type="module">
      import * as THREE from "three";

      /* =====================================================================

===================================================================== */

          role: "Developer",

          size: [3.6, 3.0, 3.0],
        },
      ];
      const agentById = Object.fromEntries(AGENTS.map((a) => [a.id, a]));
      const john = agentById.john;
      const devs = [agentById.bob, agentById.alice];

      // Key locations in the office.
      const GATE_POS = new THREE.Vector3(5, 0, 0.6);
      const GATE_DIR = new THREE.Vector3(0.85, 0, -0.53).normalize(); // direction tokens travel through the gate
      const GATE_CENTER = GATE_POS.clone().setY(1.3);
      const RACKS = [
        { id: "main", label: "main", x: 10.6, color: "#a78bfa" },
        { id: "bob", label: "bob", x: 13.0, color: "#60a5fa" },
        { id: "alice", label: "alice", x: 15.4, color: "#f472b6" },
      ];
      const RACK_Z = -4.3;
      const MAIN_INLET = new THREE.Vector3(10.6, 1.7, -3.4);

      const rand = (a, b) => a + Math.random() * (b - a);
      const randi = (a, b) => Math.floor(rand(a, b + 1));
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const chance = (p) => Math.random() < p;
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const damp = (k, dt) => 1 - Math.exp(-k * dt);
      const easeInOut = (t) =>
        t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const hdr = (css, k) => new THREE.Color(css).multiplyScalar(k);
      const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

      /* Simulation clock + scheduler. Uses simulated time so everything pauses
   cleanly when the tab is hidden (frame delta is clamped). */
      let simTime = 0;
      const timers = [];
      function after(sec, fn) {
        timers.push({ at: simTime + sec, fn });
      }
      function runTimers() {
        for (let i = timers.length - 1; i >= 0; i--) {
          if (timers[i].at <= simTime) {
            const { fn } = timers[i];
            timers.splice(i, 1);
            fn();
          }
        }
      }

      // Dirty flags let canvases and HTML panels redraw only when data changes.
      const dirty = { plan: true, prs: true, team: true };
      const markDirty = (...keys) => keys.forEach((k) => (dirty[k] = true));

      /* =====================================================================
   1. RENDERER, SCENE, CAMERA, POST-PROCESSING
===================================================================== */
      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: false,
        powerPreference: "high-performance",
      });
      const pixelRatio = () => Math.min(window.devicePixelRatio || 1, 1.75);
      renderer.setPixelRatio(pixelRatio());
      renderer.setSize(innerWidth, innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping; // keeps canvas text and neon colours crisp
      const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b1a);
      scene.fog = new THREE.FogExp2(0x070b1a, 0.011);

      const camera = new THREE.PerspectiveCamera(
        42,
        innerWidth / innerHeight,
        0.1,
        400,
      );

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = 1.42;
      controls.minDistance = 3;
      controls.maxDistance = 140;

      // Bloom gives the neon its glow. HalfFloat + MSAA render target keeps edges smooth.
      const composerTarget = new THREE.WebGLRenderTarget(1, 1, {
        type: THREE.HalfFloatType,
        samples: 4,
      });
      const composer = new EffectComposer(renderer, composerTarget);
      composer.setPixelRatio(pixelRatio());
      composer.setSize(innerWidth, innerHeight);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(
        new THREE.Vector2(innerWidth, innerHeight),
        0.85,
        0.55,
        0.82,
      );
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      // Lighting: cool sky fill + a soft key light. Neon comes from emissive materials.
      scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x0b1022, 0.9));
      const key = new THREE.DirectionalLight(0xc7d8ff, 1.1);
      key.position.set(8, 20, 14);
      scene.add(key);

      /* =====================================================================
   2. SHARED HELPERS (textures, shapes, materials)
===================================================================== */

      // Soft radial sprite used for glows, particles and dust.
      const glowTex = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const g = c.getContext("2d");
        const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        grd.addColorStop(0, "rgba(255,255,255,1)");
        grd.addColorStop(0.22, "rgba(255,255,255,0.7)");
        grd.addColorStop(0.55, "rgba(255,255,255,0.15)");
        grd.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, 128, 128);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      })();

      /** Creates a canvas + texture pair. Live textures skip mipmaps for cheap uploads. */
      function canvasTexture(w, h, live = false) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const ctx = c.getContext("2d");
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = MAX_ANISO;
        if (live) {
          tex.generateMipmaps = false;
          tex.minFilter = THREE.LinearFilter;
        }
        return { c, ctx, tex };
      }

      function roundRect(ctx, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      /** Truncates text to fit a pixel width (with ellipsis). */
      function fitText(ctx, text, maxW) {
        if (ctx.measureText(text).width <= maxW) return text;
        let lo = 0,
          hi = text.length;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          ctx.measureText(text.slice(0, mid) + "…").width <= maxW
            ? (lo = mid)
            : (hi = mid - 1);
        }
        return text.slice(0, lo) + "…";
      }

      /** 2D rounded rectangle shape centred on the origin. */
      function roundedRectShape(w, h, r) {
        const s = new THREE.Shape(),
          x = -w / 2,
          y = -h / 2;
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y);
        s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
        s.lineTo(x + w, y + h - r);
        s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
        s.lineTo(x + r, y + h);
        s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
        s.lineTo(x, y + r);
        s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
        return s;
      }

      /** Glowing closed tube following a 2D outline. `map` turns a Vector2 into a world-space Vector3. */
      function neonLoop(shape, map, radius, material, samples = 160) {
        const pts = shape.getSpacedPoints(samples).map(map);
        if (pts[0].distanceTo(pts[pts.length - 1]) < 1e-3) pts.pop();
        const curve = new THREE.CatmullRomCurve3(pts, true, "centripetal");
        return new THREE.Mesh(
          new THREE.TubeGeometry(curve, samples * 2, radius, 6, true),
          material,
        );
      }

      /** Polyline with rounded corners, as a CurvePath (used for pipes). */
      function roundedPath(points, r) {
        const path = new THREE.CurvePath();
        let prev = points[0].clone();
        for (let i = 1; i < points.length - 1; i++) {
          const p = points[i];
          const d1 = points[i - 1].clone().sub(p);
          const l1 = d1.length();
          d1.normalize();
          const d2 = points[i + 1].clone().sub(p);
          const l2 = d2.length();
          d2.normalize();
          const rr = Math.min(r, l1 / 2, l2 / 2);
          const s = p.clone().addScaledVector(d1, rr),
            e = p.clone().addScaledVector(d2, rr);
          path.add(new THREE.LineCurve3(prev, s));
          path.add(new THREE.QuadraticBezierCurve3(s, p.clone(), e));
          prev = e;
        }
        path.add(new THREE.LineCurve3(prev, points[points.length - 1].clone()));
        return path;
      }

      /** Additive glow disc lying on the floor. */
      function floorGlow(w, d, color, opacity) {
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(w, d),
          new THREE.MeshBasicMaterial({
            map: glowTex,
            color,
            transparent: true,
            opacity,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        m.rotation.x = -Math.PI / 2;
        return m;
      }

      /** Billboard text label. `draw(ctx, w, h)` paints it. */
      function textSprite(w, h, worldW, draw) {
        const t = canvasTexture(w, h);
        const sprite = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: t.tex,
            transparent: true,
            depthWrite: false,
          }),
        );
        sprite.scale.set(worldW, (worldW * h) / w, 1);
        const redraw = () => {
          t.ctx.clearRect(0, 0, w, h);
          draw(t.ctx, w, h);
          t.tex.needsUpdate = true;
        };
        redraw();
        return { sprite, redraw, ...t };
      }

      /** Simple pill-shaped label, e.g. rack names. */
      function pillLabel(text, color, worldW = 1.6) {
        return textSprite(256, 80, worldW, (ctx) => {
          roundRect(ctx, 6, 8, 244, 64, 32);
          ctx.fillStyle = "rgba(8,13,30,0.85)";
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = color;
          ctx.stroke();
          ctx.fillStyle = "#e2e8f0";
          ctx.font = `700 30px ${MONO}`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(text, 128, 41);
        });
      }

      // Shared materials
      const M = {

          roughness: 0.55,

        }),

        }),

      const pickables = []; // meshes that respond to clicks

      /* =====================================================================
   3. ENVIRONMENT (floor, zones, server room shell, dust)

      function buildEnvironment() {

        // Server room: raised platform + glass walls + sign

        scene.add(side);
        const trimMat = new THREE.MeshBasicMaterial({
          color: hdr("#a78bfa", 1.2),
        });
        const trim1 = new THREE.Mesh(
          new THREE.BoxGeometry(sw, 0.04, 0.04),

        );

        const trim2 = new THREE.Mesh(
          new THREE.BoxGeometry(0.04, 0.04, sd),

        );

        scene.add(trim2);

        const sign = canvasTexture(1024, 128);

        sign.ctx.textAlign = "center";

        sign.ctx.fillText("S E R V E R   R O O M", 512, 66);
        const signMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(5.2, 0.65),
          new THREE.MeshBasicMaterial({
            map: sign.tex,
            transparent: true,
            depthWrite: false,
          }),
        );
        signMesh.position.set(sx, 3.75, sz - sd / 2 + 0.02);
        scene.add(signMesh);

        // Floating dust motes for atmosphere
        const N = 260,
          pos = new Float32Array(N * 3),
          speed = new Float32Array(N);
        for (let i = 0; i < N; i++) {
          pos[i * 3] = rand(-14, 22);
          pos[i * 3 + 1] = rand(0, 9);
          pos[i * 3 + 2] = rand(-11, 9);
          speed[i] = rand(0.05, 0.25);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const dust = new THREE.Points(
          geo,
          new THREE.PointsMaterial({
            size: 0.09,
            map: glowTex,
            color: 0x7dd3fc,
            transparent: true,
            opacity: 0.55,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
          }),
        );
        scene.add(dust);
        return { dust, speed };
      }

      /* =====================================================================
   4. AGENT PODS
===================================================================== */
      const SCREEN_W = 512,
        SCREEN_H = 232,
        LINE_H = 19;

      function createPod(a) {
        const [w, h, d] = a.size;
        const ac = new THREE.Color(a.color);
        const group = new THREE.Group();
        group.position.set(...a.pos);
        scene.add(group);

        // Base plate
        const base = new THREE.Mesh(
          new RoundedBoxGeometry(w + 0.4, 0.12, d + 0.4, 2, 0.06),

        );
        base.position.y = 0.06;
        group.add(base);

        // Glass shell: rounded-rect footprint extruded upward
        const shape = roundedRectShape(w, d, 0.35);
        const shellGeo = new THREE.ExtrudeGeometry(shape, {
          depth: h,
          bevelEnabled: false,
          curveSegments: 10,
        });
        shellGeo.rotateX(-Math.PI / 2);
        const glass = new THREE.Mesh(shellGeo, M.glass);
        glass.position.y = 0.12;
        glass.userData.pick = { type: "pod", agent: a };
        group.add(glass);
        pickables.push(glass);

        // Glowing edge frame (colour = agent state)
        const edgeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        group.add(neonLoop(shape, (p) => V3(p.x, 0.13, -p.y), 0.035, edgeMat));
        group.add(
          neonLoop(shape, (p) => V3(p.x, h + 0.12, -p.y), 0.035, edgeMat),
        );
        const postGeo = new THREE.CylinderGeometry(0.03, 0.03, h, 6);
        for (const sx of [-1, 1])
          for (const sz of [-1, 1]) {
            const post = new THREE.Mesh(postGeo, edgeMat);
            post.position.set(
              sx * (w / 2 - 0.1),
              0.12 + h / 2,
              sz * (d / 2 - 0.1),
            );
            group.add(post);
          }

        // Interior: desk, keyboard glow, chair
        const desk = new THREE.Mesh(
          new THREE.BoxGeometry(w * 0.62, 0.07, 0.75),
          M.desk,
        );
        desk.position.set(0, 0.86, d / 2 - 0.75);
        group.add(desk);
        for (const sx of [-1, 1]) {
          const leg = new THREE.Mesh(
            new THREE.BoxGeometry(0.06, 0.74, 0.6),
            M.desk,
          );
          leg.position.set(sx * w * 0.28, 0.49, d / 2 - 0.75);
          group.add(leg);
        }
        const kb = new THREE.Mesh(
          new THREE.PlaneGeometry(0.8, 0.22),
          new THREE.MeshBasicMaterial({
            color: ac.clone().multiplyScalar(1.3),
          }),
        );
        kb.rotation.x = -Math.PI / 2;
        kb.position.set(0, 0.9, d / 2 - 0.9);
        group.add(kb);
        const seat = new THREE.Mesh(
          new THREE.BoxGeometry(0.62, 0.08, 0.55),
          M.chair,
        );
        seat.position.set(0, 0.55, d / 2 - 1.6);
        group.add(seat);
        const back = new THREE.Mesh(
          new THREE.BoxGeometry(0.62, 0.75, 0.08),
          M.chair,
        );
        back.position.set(0, 0.95, d / 2 - 1.9);
        group.add(back);
        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(0.04, 0.04, 0.42, 8),
          M.chair,
        );
        stem.position.set(0, 0.32, d / 2 - 1.6);
        group.add(stem);

        // Avatar: capsule body, round head, glowing visor (faces the screen)
        const avatar = new THREE.Group();
        avatar.position.set(0, 0, d / 2 - 1.55);
        const body = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.26, 0.45, 4, 14),
          new THREE.MeshStandardMaterial({
            color: ac.clone().multiplyScalar(0.35),
            emissive: ac,
            emissiveIntensity: 0.25,
            roughness: 0.4,
            metalness: 0.3,
          }),
        );
        body.position.y = 1.05;
        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.24, 24, 16),
          M.head,
        );
        head.position.y = 1.72;
        const visor = new THREE.Mesh(
          new THREE.BoxGeometry(0.34, 0.09, 0.08),
          new THREE.MeshBasicMaterial({ color: ac.clone().multiplyScalar(2) }),
        );
        visor.position.set(0, 1.74, 0.2);
        avatar.add(body, head, visor);
        if (a.id === "john") {
          // the lead gets a halo
          const halo = new THREE.Mesh(
            new THREE.TorusGeometry(0.26, 0.022, 8, 40),
            new THREE.MeshBasicMaterial({
              color: ac.clone().multiplyScalar(2.2),
            }),
          );
          halo.rotation.x = Math.PI / 2;
          halo.position.y = 2.08;
          avatar.add(halo);
        }
        group.add(avatar);

        // Front screen: scrolling terminal (live canvas texture)
        const sw = w * 0.72,
          sh = (sw * SCREEN_H) / SCREEN_W;
        const sy = 0.12 + h * 0.78;
        const bezel = new THREE.Mesh(
          new RoundedBoxGeometry(sw + 0.14, sh + 0.14, 0.07, 2, 0.03),
          M.bezel,
        );
        bezel.position.set(0, sy, d / 2 + 0.035);
        group.add(bezel);
        const screen = canvasTexture(SCREEN_W, SCREEN_H, true);
        const screenMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(sw, sh),
          new THREE.MeshBasicMaterial({ map: screen.tex }),
        );
        screenMesh.position.set(0, sy, d / 2 + 0.075);
        screenMesh.userData.pick = { type: "pod", agent: a };
        group.add(screenMesh);
        pickables.push(screenMesh);

        // State glow on the floor + a point light inside
        const glow = floorGlow(w + 3, d + 3, 0xffffff, 0.5);
        glow.position.y = 0.01;
        group.add(glow);
        const light = new THREE.PointLight(0xffffff, 6, 7, 2);
        light.position.set(0, h * 0.75, 0);
        group.add(light);

        // Name label
        const label = textSprite(
          512,
          128,
          a.id === "john" ? 3.3 : 2.9,
          (ctx, W, H) => drawAgentLabel(ctx, W, H, a),
        );
        label.sprite.position.set(0, h + 0.95, 0);
        group.add(label.sprite);

        return {
          group,
          glass,
          screenMesh,
          screen,
          edgeMat,
          glow,
          light,
          avatar,
          head,
          label,
          color: new THREE.Color(STATE.idle.css),
          scroll: 0,
          dirty: true,
          lastDraw: 0,
        };
      }

      function drawAgentLabel(ctx, W, H, a) {
        const st = STATE[a.state || "idle"];
        roundRect(ctx, 6, 14, W - 12, H - 28, (H - 28) / 2);
        ctx.fillStyle = "rgba(8,13,30,0.86)";
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = st.css;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(52, H / 2, 12, 0, Math.PI * 2);
        ctx.fillStyle = st.css;
        ctx.fill();
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.font = `700 42px ${SANS}`;
        ctx.fillStyle = "#f1f5f9";
        ctx.fillText(a.name, 80, H / 2 + 2);
        const nw = ctx.measureText(a.name).width;
        ctx.font = `500 34px ${SANS}`;
        ctx.fillStyle = "#94a3b8";
        ctx.fillText(` · ${a.role}`, 80 + nw, H / 2 + 2);
      }

      const TERM_COLORS = {
        prompt: "#f8fafc",
        tool: "#e2e8f0",
        out: "#7c8aa5",
        ok: "#4ade80",
        err: "#fb7185",
        warn: "#fbbf24",
        think: "#c4b5fd",
        say: "#cbd5e1",
        dim: "#56627e",
      };
      const SPINNER = ["✻", "✢", "✳", "✶", "✳", "✢"];

      /** Paints the scrolling terminal on a pod's front screen. */
      function drawScreen(a) {
        const { ctx } = a.pod.screen,
          W = SCREEN_W,
          H = SCREEN_H;
        const st = STATE[a.state];
        ctx.fillStyle = "#040915";
        ctx.fillRect(0, 0, W, H);

        // Body lines, bottom-up, offset by the smooth scroll amount
        const top = 34,
          bottom = H - 30;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, top, W, bottom - top + 4);
        ctx.clip();
        ctx.font = `15px ${MONO}`;
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
        const lines = a.term.lines;
        let y = bottom + a.pod.scroll;
        for (let i = lines.length - 1; i >= 0 && y > top; i--, y -= LINE_H) {
          const ln = lines[i];
          ctx.fillStyle = TERM_COLORS[ln.kind] || "#cbd5e1";
          let text = ln.text;
          if (ln.kind === "tool") {
            ctx.fillStyle = "#4ade80";
            ctx.fillText("⏺", 12, y);
            ctx.fillStyle = TERM_COLORS.tool;
            text = text.replace(/^⏺ /, "");
            ctx.fillText(fitText(ctx, text, W - 50), 32, y);
            continue;
          }
          ctx.fillText(fitText(ctx, text, W - 24), 12, y);
        }
        ctx.restore();

        // Header bar
        ctx.fillStyle = "#0b1530";
        ctx.fillRect(0, 0, W, 28);
        ["#f87171", "#fbbf24", "#34d399"].forEach((c, i) => {
          ctx.beginPath();
          ctx.arc(14 + i * 15, 14, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = c;
          ctx.fill();
        });
        ctx.font = `600 13px ${MONO}`;
        ctx.fillStyle = "#8796b5";
        ctx.textBaseline = "middle";
        ctx.fillText(`${a.id}@sandbox-${a.id}: ~/askwell`, 62, 15);
        ctx.font = `700 12px ${SANS}`;
        const tag = st.label.toUpperCase(),
          tw = ctx.measureText(tag).width + 18;
        roundRect(ctx, W - tw - 8, 6, tw, 17, 8.5);
        ctx.fillStyle = st.css + "33";
        ctx.fill();
        ctx.fillStyle = st.css;
        ctx.textAlign = "center";
        ctx.fillText(tag, W - tw / 2 - 8, 15.5);
        ctx.textAlign = "left";

        // Footer status / prompt with blinking cursor
        ctx.fillStyle = "#0a1226";
        ctx.fillRect(0, H - 24, W, 24);
        ctx.font = `14px ${MONO}`;
        ctx.textBaseline = "middle";
        const blink = Math.floor(simTime * 2) % 2 === 0;
        if (a.state === "working") {
          ctx.fillStyle = "#67e8f9";
          ctx.fillText(
            `${SPINNER[Math.floor(simTime * 8) % SPINNER.length]} ${a.activity || "Working"}…`,
            12,
            H - 12,
          );
        } else if (a.state === "input") {
          ctx.fillStyle = blink ? "#fb7185" : "#9f1239";
          ctx.fillText("⚠ Needs your input — click to answer", 12, H - 12);
        } else if (a.state === "waiting") {
          ctx.fillStyle = "#fcd34d";
          ctx.fillText("◷ Waiting for CodeRabbit review…", 12, H - 12);
        } else {
          ctx.fillStyle = a.state === "passed" ? "#6ee7b7" : "#8796b5";
          ctx.fillText(
            a.state === "passed" ? "✓ Review passed" : ">",
            12,
            H - 12,
          );
          if (blink && a.state !== "passed") {
            ctx.fillStyle = "#e2e8f0";
            ctx.fillRect(28, H - 19, 8, 14);
          }
        }
        a.pod.screen.tex.needsUpdate = true;
      }

      /** Per-frame pod visuals: edge colour/pulse, light, glow, avatar idle motion, screen redraw. */
      function updatePod(a, dt, t) {
        const pod = a.pod,
          target = STATE[a.state].color;
        pod.color.lerp(target, damp(8, dt));
        pod.label.sprite.visible = focused !== a; // the close-up doesn't need a floating name tag

        let k; // edge brightness by state
        switch (a.state) {
          case "working":
            k = 1.5 + Math.sin(t * 4 + a.pos[0]) * 0.75;
            break;
          case "input":
            k = Math.sin(t * 10) > 0 ? 3.2 : 1.0;
            break;
          case "waiting":
            k = 1.7 + Math.sin(t * 2) * 0.35;
            break;
          case "passed":
            k = 2.6;
            break;
          default:
            k = 0.45;
        }
        pod.edgeMat.color.copy(pod.color).multiplyScalar(k);
        pod.light.color.copy(pod.color);
        pod.light.intensity = 2 + k * 2.2;
        pod.glow.material.color.copy(pod.color);
        pod.glow.material.opacity = 0.15 + k * 0.13;

        // Avatar body language
        const av = pod.avatar;
        if (a.state === "working") {
          av.position.y = Math.abs(Math.sin(t * 9)) * 0.025;
          pod.head.rotation.y = Math.sin(t * 1.3) * 0.15;
        } else if (a.state === "input") {
          av.position.y = 0;
          pod.head.rotation.y = Math.sin(t * 3) * 0.5;
        } else if (a.state === "passed") {
          av.position.y = Math.abs(Math.sin(t * 6)) * 0.12;
        } else {
          av.position.y = Math.sin(t * 1.5) * 0.02;
          pod.head.rotation.y *= 0.95;
        }

        // Smooth terminal scroll + throttled canvas redraw (~24fps while animating, else on ticks)
        pod.scroll = Math.max(0, pod.scroll - dt * 60);
        const tick = Math.floor(t * 8);
        const needs = pod.dirty || pod.scroll > 0 || tick !== pod.lastTick;
        if (needs && t - pod.lastDraw > 1 / 24) {
          drawScreen(a);
          pod.dirty = false;
          pod.lastDraw = t;
          pod.lastTick = tick;
        }
      }

      /* =====================================================================
   5. PLAN WALL (kanban board on a canvas texture)
===================================================================== */
      const PLAN_W = 1280,
        PLAN_H = 720;
      const COLS = ["todo", "progress", "review", "done"];
      const COL_TITLES = {
        todo: "TODO",
        progress: "IN PROGRESS",
        review: "IN REVIEW",
        done: "DONE",
      };
      const COL_COLORS = {
        todo: "#8796b5",
        progress: "#22d3ee",
        review: "#fbbf24",
        done: "#34d399",
      };

      function createPlanWall() {
        const W = 8.4,
          H = (W * PLAN_H) / PLAN_W,
          bottom = 2.4,
          cy = bottom + H / 2;
        const group = new THREE.Group();
        group.position.set(-4.5, 0, -7.6);
        scene.add(group);

        const backing = new THREE.Mesh(
          new RoundedBoxGeometry(W + 0.35, H + 0.35, 0.14, 2, 0.06),
          M.dark,
        );
        backing.position.set(0, cy, -0.09);
        group.add(backing);
        const tex = canvasTexture(PLAN_W, PLAN_H, true);
        const board = new THREE.Mesh(
          new THREE.PlaneGeometry(W, H),
          new THREE.MeshBasicMaterial({ map: tex.tex }),
        );
        board.position.y = cy;
        board.userData.pick = { type: "plan" };
        group.add(board);
        pickables.push(board);
        group.add(
          neonLoop(
            roundedRectShape(W + 0.35, H + 0.35, 0.12),
            (p) => V3(p.x, cy + p.y, 0.0),
            0.03,
            new THREE.MeshBasicMaterial({ color: hdr("#a78bfa", 1.6) }),
          ),
        );
        for (const sx of [-1, 1]) {
          const leg = new THREE.Mesh(
            new THREE.BoxGeometry(0.14, bottom, 0.14),
            M.dark,
          );
          leg.position.set(sx * W * 0.36, bottom / 2, -0.1);
          group.add(leg);
        }
        const glow = floorGlow(W + 2, 3, new THREE.Color("#a78bfa"), 0.35);
        glow.position.set(0, 0.01, 0.4);
        group.add(glow);
        return { ...tex, lastDraw: 0 };
      }

      /** Target pixel position for each card, based on column + order. */
      function layoutPlan() {
        const colW = (PLAN_W - 48 - 3 * 16) / 4;
        for (const col of COLS) {
          const list = tasks
            .filter((t) => t.col === col)
            .sort((a, b) =>
              col === "done"
                ? b.enteredAt - a.enteredAt
                : a.enteredAt - b.enteredAt,
            );
          list.forEach((t, i) => {
            t.tx = 24 + COLS.indexOf(col) * (colW + 16) + 10;
            t.ty = 150 + i * 84;
            t.ta = i < 6 ? 1 : 0;
            if (t.dx === undefined) {
              t.dx = t.tx;
              t.dy = t.ty;
              t.da = 0;
            }
          });
        }
        return colW;
      }

      function drawPlan(ctx, colW) {
        ctx.fillStyle = "#070d1d";
        ctx.fillRect(0, 0, PLAN_W, PLAN_H);
        const g = ctx.createLinearGradient(0, 0, PLAN_W, PLAN_H);
        g.addColorStop(0, "rgba(167,139,250,0.08)");
        g.addColorStop(1, "rgba(34,211,238,0.05)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, PLAN_W, PLAN_H);

        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
        ctx.font = `700 16px ${SANS}`;
        ctx.fillStyle = "#a78bfa";
        ctx.fillText("P L A N   W A L L", 26, 40);
        ctx.font = `700 32px ${SANS}`;
        ctx.fillStyle = "#f1f5f9";
        ctx.fillText("Askwell · Phase 3", 26, 78);
        const done = tasks.filter((t) => t.col === "done").length;
        ctx.font = `500 18px ${MONO}`;
        ctx.fillStyle = "#8796b5";
        ctx.textAlign = "right";
        ctx.fillText(
          `${tasks.length} tasks · ${done} done · PRs merged ${mergedCount}`,
          PLAN_W - 26,
          78,
        );
        ctx.textAlign = "left";

        COLS.forEach((col, i) => {
          const x = 24 + i * (colW + 16);
          roundRect(ctx, x, 100, colW, PLAN_H - 120, 14);
          ctx.fillStyle = "rgba(15,23,42,0.75)";
          ctx.fill();
          ctx.strokeStyle = "rgba(125,211,252,0.12)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = COL_COLORS[col];
          ctx.fillRect(x + 14, 122, 10, 10);
          ctx.font = `700 15px ${SANS}`;
          ctx.fillStyle = "#cbd5e1";
          ctx.fillText(COL_TITLES[col], x + 32, 133);
          const n = tasks.filter((t) => t.col === col).length;
          ctx.font = `600 15px ${MONO}`;
          ctx.fillStyle = "#8796b5";
          ctx.textAlign = "right";
          ctx.fillText(String(n), x + colW - 14, 133);
          ctx.textAlign = "left";
        });

        // Moving cards are painted last so they float above the rest
        const order = [...tasks].sort(
          (a, b) =>
            Math.abs(a.dx - a.tx) +
            Math.abs(a.dy - a.ty) -
            (Math.abs(b.dx - b.tx) + Math.abs(b.dy - b.ty)),
        );
        for (const t of order) {
          if (t.da < 0.02) continue;
          const owner = agentById[t.owner],
            x = t.dx,
            y = t.dy,
            w = colW - 20,
            h = 72;
          const moving = Math.abs(t.dx - t.tx) + Math.abs(t.dy - t.ty) > 2;
          ctx.globalAlpha = t.da;
          ctx.save();
          if (moving) {
            ctx.shadowColor = owner.color;
            ctx.shadowBlur = 26;
          }
          roundRect(ctx, x, y, w, h, 10);
          ctx.fillStyle = "#101a35";
          ctx.fill();
          ctx.restore();
          ctx.globalAlpha = t.da;
          ctx.strokeStyle =
            t.col === "review"
              ? "rgba(251,191,36,0.55)"
              : t.col === "progress"
                ? "rgba(34,211,238,0.35)"
                : "rgba(148,163,184,0.16)";
          ctx.lineWidth = 2;
          roundRect(ctx, x, y, w, h, 10);
          ctx.stroke();
          ctx.fillStyle = owner.color;
          roundRect(ctx, x, y, 5, h, 3);
          ctx.fill();

          ctx.font = `700 15px ${MONO}`;
          ctx.fillStyle = owner.color;
          ctx.fillText((t.col === "done" ? "✓ " : "") + t.id, x + 16, y + 25);
          if (t.pr && t.col === "review") {
            ctx.font = `600 14px ${MONO}`;
            ctx.fillStyle = "#fbbf24";
            ctx.textAlign = "right";
            ctx.fillText(`PR #${t.pr}`, x + w - 12, y + 25);
            ctx.textAlign = "left";
          }
          ctx.font = `600 19px ${SANS}`;
          ctx.fillStyle = t.col === "done" ? "#94a3b8" : "#f1f5f9";
          ctx.fillText(fitText(ctx, t.title, w - 110), x + 16, y + 55);
          ctx.font = `500 14px ${SANS}`;
          ctx.fillStyle = "#8796b5";
          ctx.textAlign = "right";
          ctx.fillText(owner.name, x + w - 12, y + 55);
          ctx.textAlign = "left";
          ctx.beginPath();
          ctx.arc(
            x + w - 20 - ctx.measureText(owner.name).width,
            y + 50,
            4,
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = owner.color;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      /** Animates cards toward their targets and redraws the texture when needed (≤30fps). */
      function updatePlanWall(dt, t) {
        const colW = layoutPlan();
        let moving = false;
        const k = damp(5, dt);
        for (const c of tasks) {
          c.dx += (c.tx - c.dx) * k;
          c.dy += (c.ty - c.dy) * k;
          c.da += (c.ta - c.da) * damp(4, dt);
          if (
            Math.abs(c.dx - c.tx) > 0.5 ||
            Math.abs(c.dy - c.ty) > 0.5 ||
            Math.abs(c.da - c.ta) > 0.01
          )
            moving = true;
        }
        if ((dirty.planWall || moving) && t - planWall.lastDraw > 1 / 30) {
          drawPlan(planWall.ctx, colW);
          planWall.tex.needsUpdate = true;
          planWall.lastDraw = t;
          dirty.planWall = moving;
        }
      }

      /* =====================================================================
   6. REVIEW GATE + CODERABBIT
===================================================================== */
      const GATE_COLORS = {
        idle: new THREE.Color("#7c8cff"),
        reviewing: new THREE.Color("#fbbf24"),
        passed: new THREE.Color("#34d399"),
        changes: new THREE.Color("#f43f5e"),
      };

      function createGate() {
        const group = new THREE.Group();
        group.position.copy(GATE_POS);
        group.rotation.y = Math.atan2(GATE_DIR.x, GATE_DIR.z); // local +z = travel direction
        scene.add(group);

        const R_OUT = 2.3,
          R_IN = 1.75,
          PILLAR = 2.0;
        // Solid arch frame (outer arch with an inner hole), extruded along local z
        const outer = new THREE.Shape();
        outer.moveTo(-R_OUT, 0);
        outer.lineTo(-R_OUT, PILLAR);
        outer.absarc(0, PILLAR, R_OUT, Math.PI, 0, true);
        outer.lineTo(R_OUT, 0);
        outer.lineTo(-R_OUT, 0);
        const inner = new THREE.Path();
        inner.moveTo(-R_IN, 0.14);
        inner.lineTo(-R_IN, PILLAR);
        inner.absarc(0, PILLAR, R_IN, Math.PI, 0, true);
        inner.lineTo(R_IN, 0.14);
        inner.lineTo(-R_IN, 0.14);
        outer.holes.push(inner);
        const frameGeo = new THREE.ExtrudeGeometry(outer, {
          depth: 0.5,
          bevelEnabled: true,
          bevelThickness: 0.04,
          bevelSize: 0.04,
          bevelSegments: 2,
          curveSegments: 40,
        });
        frameGeo.translate(0, 0, -0.25);
        group.add(new THREE.Mesh(frameGeo, M.dark));

        // Neon outlines on both faces (inner + outer edge)
        const neonMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const outline = (r, y0) => {
          const p = new THREE.Path();
          p.moveTo(-r, y0);
          p.lineTo(-r, PILLAR);
          p.absarc(0, PILLAR, r, Math.PI, 0, true);
          p.lineTo(r, y0);
          return p.getSpacedPoints(140);
        };
        for (const [r, y0] of [
          [R_IN, 0.14],
          [R_OUT + 0.04, 0],
        ]) {
          const pts2 = outline(r, y0);
          for (const z of [-0.3, 0.3]) {
            const curve = new THREE.CatmullRomCurve3(
              pts2.map((p) => V3(p.x, p.y, z)),
              false,
              "centripetal",
            );
            group.add(
              new THREE.Mesh(
                new THREE.TubeGeometry(curve, 220, 0.035, 6, false),
                neonMat,
              ),
            );
          }
        }

        // Translucent portal fill + scan line shown while reviewing
        const portalShape = new THREE.Shape(inner.getPoints(40));
        const portalMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.08,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        group.add(
          new THREE.Mesh(new THREE.ShapeGeometry(portalShape), portalMat),
        );
        const scan = new THREE.Mesh(
          new THREE.BoxGeometry(2 * R_IN, 0.035, 0.04),
          new THREE.MeshBasicMaterial({ color: hdr("#fbbf24", 3) }),
        );
        group.add(scan);

        const glow = floorGlow(6, 4, 0xffffff, 0.4);
        glow.position.y = 0.012;
        group.add(glow);
        const light = new THREE.PointLight(0xffffff, 8, 9, 2);
        light.position.set(0, 2.2, 0);
        group.add(light);

        // Low-poly rabbit (CodeRabbit) on top of the arch
        const rabbit = createRabbit();
        rabbit.position.set(0, PILLAR + R_OUT + 0.02, 0);
        rabbit.rotation.y = -0.35 - group.rotation.y; // face the camera/dev side in world space
        group.add(rabbit);

        const label = pillLabel("REVIEW GATE", "#fbbf24", 2.1);
        label.sprite.position.set(0, PILLAR + R_OUT + 1.45, 0);
        group.add(label.sprite);

        return {
          group,
          neonMat,
          portalMat,
          scan,
          glow,
          light,
          rabbit,
          mode: "idle",
          modeAt: 0,
          color: GATE_COLORS.idle.clone(),
          queue: [],
          busy: null,
          cooldownUntil: 0,
          R_IN,
          PILLAR,
        };
      }

      function createRabbit() {
        const g = new THREE.Group();
        const fur = new THREE.MeshStandardMaterial({
          color: 0xff8a3d,
          roughness: 0.55,
          flatShading: true,
          emissive: 0xff6a00,
          emissiveIntensity: 0.15,
        });
        const white = new THREE.MeshStandardMaterial({
          color: 0xfff4ea,
          roughness: 0.6,
          flatShading: true,
        });
        const black = new THREE.MeshBasicMaterial({ color: 0x0b0b12 });
        const ico = new THREE.IcosahedronGeometry(1, 1);
        const part = (mat, s, p, r = [0, 0, 0]) => {
          const m = new THREE.Mesh(ico, mat);
          m.scale.set(...s);
          m.position.set(...p);
          m.rotation.set(...r);
          g.add(m);
          return m;
        };
        part(fur, [0.34, 0.3, 0.42], [0, 0.3, 0]); // body
        const head = part(fur, [0.23, 0.22, 0.24], [0, 0.62, 0.27]); // head
        part(white, [0.14, 0.11, 0.12], [0, 0.55, 0.42]); // muzzle
        const earL = part(
          fur,
          [0.065, 0.3, 0.04],
          [-0.09, 0.98, 0.22],
          [-0.2, 0, 0.18],
        );
        const earR = part(
          fur,
          [0.065, 0.3, 0.04],
          [0.09, 0.98, 0.22],
          [-0.2, 0, -0.18],
        );
        part(white, [0.1, 0.1, 0.1], [0, 0.35, -0.42]); // tail
        part(black, [0.035, 0.035, 0.035], [-0.09, 0.67, 0.47]); // eyes
        part(black, [0.035, 0.035, 0.035], [0.09, 0.67, 0.47]);
        part(fur, [0.09, 0.07, 0.14], [-0.17, 0.08, 0.18]); // feet
        part(fur, [0.09, 0.07, 0.14], [0.17, 0.08, 0.18]);
        g.userData = { head, earL, earR, fur };
        return g;
      }

      function setGateMode(mode) {
        gate.mode = mode;
        gate.modeAt = simTime;
        markDirty("prs");
      }

      function updateGate(dt, t) {
        const since = t - gate.modeAt;
        if ((gate.mode === "passed" || gate.mode === "changes") && since > 1.8)
          setGateMode("idle");

        gate.color.lerp(GATE_COLORS[gate.mode], damp(10, dt));
        let k = 1.0 + Math.sin(t * 1.5) * 0.15,
          portal = 0.06;
        if (gate.mode === "reviewing") {
          k = 1.7 + Math.sin(t * 7) * 0.7;
          portal = 0.13 + Math.sin(t * 7) * 0.05;
        }
        if (gate.mode === "passed" || gate.mode === "changes") {
          const f = Math.exp(-since * 1.8);
          k = 1.4 + 3.5 * f;
          portal = 0.08 + 0.35 * f;
        }
        gate.neonMat.color.copy(gate.color).multiplyScalar(k);
        gate.portalMat.color.copy(gate.color);
        gate.portalMat.opacity = portal;
        gate.glow.material.color.copy(gate.color);
        gate.glow.material.opacity = 0.25 + k * 0.12;
        gate.light.color.copy(gate.color);
        gate.light.intensity = 4 + k * 4;

        // Scanner sweeps up and down inside the arch while reviewing
        gate.scan.visible = gate.mode === "reviewing";
        if (gate.scan.visible) {
          const y =
            0.2 +
            (Math.sin(t * 3) * 0.5 + 0.5) * (gate.PILLAR + gate.R_IN - 0.35);
          const half =
            y > gate.PILLAR
              ? Math.sqrt(
                  Math.max(0.01, gate.R_IN ** 2 - (y - gate.PILLAR) ** 2),
                )
              : gate.R_IN;
          gate.scan.position.y = y;
          gate.scan.scale.x = half / gate.R_IN;
        }

        // Rabbit animation: hop while reviewing, celebratory spin on pass, ear twitch otherwise
        const r = gate.rabbit,
          u = r.userData;
        u.fur.emissive.copy(gate.color);
        u.fur.emissiveIntensity =
          gate.mode === "idle" ? 0.12 : 0.25 + (0.4 * Math.max(0, k - 1.4)) / 3;
        const baseY = gate.PILLAR + 2.3 + 0.02;
        if (gate.mode === "reviewing") {
          r.position.y = baseY + Math.abs(Math.sin(t * 6)) * 0.18;
          u.head.rotation.y = Math.sin(t * 2) * 0.4;
        } else if (gate.mode === "passed") {
          r.position.y =
            baseY + Math.sin((Math.min(since, 0.6) / 0.6) * Math.PI) * 0.55;
          u.head.rotation.y = 0;
          r.rotation.z = 0;
        } else {
          r.position.y += (baseY - r.position.y) * damp(10, dt);
        }
        const twitch = Math.sin(t * 0.9) > 0.97 ? Math.sin(t * 40) * 0.15 : 0;
        u.earL.rotation.z = 0.18 + twitch;
        u.earR.rotation.z = -0.18 - twitch;
        // spin once on pass
        const spin =
          gate.mode === "passed"
            ? easeInOut(clamp(since / 0.8, 0, 1)) * Math.PI * 2
            : 0;
        r.rotation.y = -0.35 - gate.group.rotation.y + spin;
      }

      /* =====================================================================
   7. PR BOARD
===================================================================== */
      const PR_W = 1024,
        PR_H = 640;
