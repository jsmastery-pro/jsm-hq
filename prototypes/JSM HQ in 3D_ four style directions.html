<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSM HQ in 3D: four style directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=VT323&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--page);color:var(--fg);font-family:var(--body)}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:grab}
canvas#scene:active{cursor:grabbing}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* theme tokens */
body[data-theme="neon"]{--page:#05070F;--fg:#E2E8FF;--muted:#8EA0D0;--panel:rgba(12,18,40,.82);--line:rgba(167,139,250,.45);--accent:#A78BFA;--radius:14px;--shadow:0 0 28px rgba(167,139,250,.16);--display:"Bricolage Grotesque",sans-serif;--body:"Bricolage Grotesque",sans-serif;--data:"DM Mono",monospace;--bw:1px;--tabbg:transparent;--taboff:#C7D2FE;--tabonbg:#A78BFA;--tabonfg:#05070F}
body[data-theme="mission"]{--page:#15140F;--fg:#E9E3D0;--muted:#A8A28F;--panel:rgba(42,41,37,.94);--line:#3B3A34;--accent:#FFB547;--radius:6px;--shadow:0 10px 30px rgba(0,0,0,.45);--display:"Barlow Condensed",sans-serif;--body:"Barlow Condensed",sans-serif;--data:"VT323",monospace;--bw:1px;--tabbg:#000;--taboff:#A8A28F;--tabonbg:#FFB547;--tabonfg:#15140F}
body[data-theme="archipelago"]{--page:#CFEAF6;--fg:#1F2A44;--muted:#4A5878;--panel:#FFFFFF;--line:#1F2A44;--accent:#2F6FDE;--radius:18px;--shadow:4px 4px 0 #1F2A44;--display:"Bricolage Grotesque",sans-serif;--body:"Bricolage Grotesque",sans-serif;--data:"DM Mono",monospace;--bw:2px;--tabbg:#FFFFFF;--taboff:#1F2A44;--tabonbg:#1F2A44;--tabonfg:#FFFFFF}
body[data-theme="factory"]{--page:#E9E6E0;--fg:#EDEAE4;--muted:#BDB8AE;--panel:#161616;--line:#161616;--accent:#FFC20E;--radius:0px;--shadow:none;--display:"Big Shoulders Display",sans-serif;--body:"IBM Plex Mono",monospace;--data:"IBM Plex Mono",monospace;--bw:0px;--tabbg:#161616;--taboff:#BDB8AE;--tabonbg:#FFC20E;--tabonfg:#161616}

.panel{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
body[data-theme="neon"] .panel{backdrop-filter:blur(8px)}

#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:12px;padding:10px 16px}
.brand b{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:15px}
#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px}
#tabs button{border:var(--bw) solid var(--line);background:var(--tabbg);color:var(--taboff);border-radius:calc(var(--radius) * .7);padding:10px 14px;min-height:44px;cursor:pointer;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.02em}
body[data-theme="factory"] #tabs button{border:0}
#tabs button[aria-pressed="true"]{background:var(--tabonbg);color:var(--tabonfg)}
.pill{padding:12px 16px;font-family:var(--data);font-size:15px;display:flex;align-items:center;gap:8px}
body[data-theme="mission"] .pill{font-size:20px;color:#8CFF9B}
.dot{width:9px;height:9px;border-radius:50%;background:#34C77B;display:inline-block}

#team{position:fixed;left:12px;top:96px;width:290px;display:flex;flex-direction:column;gap:10px;z-index:4}
.card{padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .name{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.card .role{color:var(--muted);font-size:13px;margin-top:3px}
.badge{font-family:var(--data);font-size:13px;padding:4px 9px;border-radius:calc(var(--radius) * .8 + 2px);white-space:nowrap;color:#111;background:var(--sc)}
body[data-theme="mission"] .badge{font-size:17px;border-radius:2px;padding:2px 8px}
body[data-theme="neon"] .badge{background:transparent;color:var(--sc);border:1.5px solid var(--sc)}
.task{margin-top:8px;font-size:14px}
body[data-theme="mission"] .task{font-size:17px}
.meta{margin-top:4px;font-family:var(--data);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
body[data-theme="mission"] .meta{font-size:17px}
.answer{margin-top:10px;display:flex;gap:8px}
.answer span{flex:1;text-align:center;padding:9px 0;min-height:40px;font-family:var(--display);font-weight:700;font-size:15px;border:var(--bw) solid var(--line);border-radius:calc(var(--radius) * .7);background:var(--accent);color:#111}
body[data-theme="factory"] .answer span{background:#FF5A1F}
body[data-theme="archipelago"] .answer span{background:#1F2A44;color:#fff}

#feed{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:380px;max-height:34vh;overflow:hidden;padding:12px 16px;z-index:4}
#feed h2{margin:0 0 8px;font-family:var(--display);font-size:18px;font-weight:700}
#feedList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#feedList li{display:grid;grid-template-columns:74px 1fr;gap:8px;font-size:14px}
#feedList time{font-family:var(--data);color:var(--muted);font-size:12px}
body[data-theme="mission"] #feedList li{font-size:17px;grid-template-columns:92px 1fr}
body[data-theme="mission"] #feedList time{font-size:17px}
body[data-theme="mission"] #feed{background:#EFE8D6;color:#2B2A24;border:0;font-family:"VT323",monospace;background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(120,150,120,.18) 23px 24px)}
body[data-theme="mission"] #feed h2{font-family:"VT323",monospace;font-weight:400;color:#7A7462}
body[data-theme="mission"] #feedList time{color:#7A7462}
#hint{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:10px 14px;font-size:13px;color:var(--muted);z-index:4;max-width:min(520px,60vw)}
body[data-theme="mission"] #hint{font-size:16px}
body[data-theme="factory"] #feed,body[data-theme="factory"] .card,body[data-theme="factory"] #hint,body[data-theme="factory"] .brand,body[data-theme="factory"] .pill{color:#EDEAE4}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--data);color:var(--muted);z-index:10;pointer-events:none}
#err{position:fixed;inset:auto 12px 12px 12px;padding:12px;background:#B42318;color:#fff;font-family:monospace;z-index:20;display:none}

@media (max-width:820px){
  #team{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;width:auto;flex-direction:row;overflow-x:auto}
  .card{min-width:230px}
  #feed,#hint{display:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){ #tabs button{transition:none} }
</style>
</head>
<body data-theme="neon">
<canvas id="scene" tabindex="0" aria-label="3D view of the JSM HQ agent office"></canvas>
<header id="top">
  <div class="brand panel"><b>JSM HQ</b><span>Askwell, phase 3</span></div>
  <nav id="tabs" class="panel" aria-label="Style direction">
    <button type="button" data-theme="neon" aria-pressed="true">Neon Pods</button>
    <button type="button" data-theme="mission" aria-pressed="false">Mission Control</button>
    <button type="button" data-theme="archipelago" aria-pressed="false">Archipelago</button>
    <button type="button" data-theme="factory" aria-pressed="false">Factory Floor</button>
  </nav>
  <div class="pill panel"><span class="dot"></span><span id="sbx">3 sandboxes running</span></div>
</header>
<div id="team" aria-label="Team"></div>
<section id="feed" class="panel" aria-label="Activity"><h2>Activity</h2><ol id="feedList"></ol></section>
<div id="hint" class="panel">Drag to orbit, scroll to zoom, click a teammate to fly to them, Esc to reset</div>
<div id="loading">Loading the office</div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display='block'; el.textContent = 'Error: ' + e.message; });
if (!window.THREE) { document.getElementById('loading').textContent = 'Could not load the 3D library. Check your connection and reload.'; return; }

let theme=null, gateBusy=true;
/* ===================== helpers ===================== */
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const TAU = Math.PI*2;
function ct(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); const tex=new THREE.CanvasTexture(c); tex.anisotropy=8; return {c,ctx,tex}; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function sprite(w,h,scale,draw){ const t=ct(w,h); draw(t.ctx,w,h); t.tex.needsUpdate=true; const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t.tex,transparent:true,depthWrite:false})); s.scale.set(scale,scale*h/w,1); s.userData.t=t; s.userData.draw=draw; s.redraw=(fn)=>{ t.ctx.clearRect(0,0,w,h); (fn||draw)(t.ctx,w,h); t.tex.needsUpdate=true; }; return s; }
function texPlane(w,h,pw,ph,basic){ const t=ct(w,h); const m=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph), basic===false? new THREE.MeshStandardMaterial({map:t.tex}) : new THREE.MeshBasicMaterial({map:t.tex,transparent:true})); m.userData.t=t; return m; }
function poly(pts){ const cp=new THREE.CurvePath(); for(let i=0;i<pts.length-1;i++) cp.add(new THREE.LineCurve3(pts[i],pts[i+1])); return cp; }
function smooth(pts){ return new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.4); }
function tube(curve,r,mat,seg){ return new THREE.Mesh(new THREE.TubeGeometry(curve,seg||240,r,6,false),mat); }
function dashed(points,color,dash,gap,opacity){ const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineDashedMaterial({color,dashSize:dash||.3,gapSize:gap||.2,transparent:true,opacity:opacity==null?1:opacity})); l.computeLineDistances(); return l; }
function edges(geo,color,opacity){ return new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color,transparent:opacity!=null,opacity:opacity==null?1:opacity})); }
function std(color,o){ return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.8,metalness:0},o||{})); }
function flat(color,o){ return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,flatShading:true},o||{})); }
function mesh(geo,mat,x,y,z,shadow){ const m=new THREE.Mesh(geo,mat); m.position.set(x||0,y||0,z||0); if(shadow){ m.castShadow=true; m.receiveShadow=true; } return m; }
function disposeTree(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); const ms=n.material? (Array.isArray(n.material)?n.material:[n.material]) : []; ms.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); }); }
function wrapLines(ctx,text,maxW){ const words=text.split(' '); const out=[]; let cur=''; for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW && cur){ out.push(cur); cur=w; } else cur=t; } if(cur) out.push(cur); return out; }

/* ===================== simulation ===================== */
const AG = {
  john:  { id:'john',  name:'John',  role:'Lead, Opus',        spend:4.10, state:'input',   lines:[], task:'Scope check', question:'Approve +2 tasks in Phase 3?' },
  bob:   { id:'bob',   name:'Bob',   role:'Developer, Sonnet', spend:2.38, state:'waiting', lines:[], phase:'waiting', taskId:'P3-T80', pr:91 },
  alice: { id:'alice', name:'Alice', role:'Developer, Sonnet', spend:1.91, state:'working', lines:[], phase:'working', taskId:'P3-T81' },
};
const ORDER = ['john','bob','alice'];
const TASKS = [
  ['P3-T76','Slack integration','alice','done'],['P3-T77','Source previews','bob','done'],['P3-T78','Answer caching','bob','done'],['P3-T79','Search filters','alice','done'],
  ['P3-T80','Webhook events','bob','review'],['P3-T81','Export chat to PDF','alice','progress'],
  ['P3-T82','Prompt templates','bob','todo'],['P3-T83','Admin roles','alice','todo'],['P3-T84','Multi-file upload','bob','todo'],['P3-T85','Embeddings backfill','alice','todo'],
].map(([id,title,owner,col])=>({id,title,owner,col}));
const POOL = ['Usage dashboard','Health checks','Workspace invites','Answer feedback','Retry failed embeds','Audit log','Billing page','Rate limiter'];
let poolI=0, nextTask=86, nextPR=92;
const QUESTIONS = ['Approve +2 tasks in Phase 3?','Merge #92 before #93?','Bump each sandbox to 2 vCPU?','Ship the next merge to staging tonight?'];
let qI=0;
const STEPS = ['Reading files','Editing','Running tests','Type-checking','Refactoring'];
const feed = [];
let simT = 0;
function task(id){ return TASKS.find(t=>t.id===id); }
function fmtTime(){ const d=new Date(); return d.toTimeString().slice(0,8); }
function log(text){ feed.unshift({t:fmtTime(),text}); feed.length=Math.min(feed.length,7); dirty.feed=true; }
function say(a,text,kind){ a.lines.push({text,kind:kind||'say'}); if(a.lines.length>40) a.lines.shift(); a.screenDirty=true; }
const dirty = {team:true,feed:true,plan:true};
function setState(a,s){ a.state=s; dirty.team=true; a.screenDirty=true; if(theme) theme.setState(a.id,s); }

// initial terminal lines
say(AG.john,'> plan phase 3','cmd'); say(AG.john,'planned P3-T84 for bob'); say(AG.john,'planned P3-T85 for alice'); say(AG.john,'? Approve +2 tasks in Phase 3?','ask');
say(AG.bob,'> P3-T80 webhook events','cmd'); say(AG.bob,'14 tests passed'); say(AG.bob,'gh pr create  #91'); say(AG.bob,'waiting for CodeRabbit review','wait');
say(AG.alice,'> P3-T81 export chat to pdf','cmd'); say(AG.alice,'edit src/export/pdf.ts'); say(AG.alice,'pnpm test export');
log('#90 merged into main'); log('Bob opened PR #91'); log('Alice started P3-T81, Export chat to PDF'); log('CodeRabbit is reviewing #91'); log('John needs input');

// tokens: logical PR packets
const tokens = [];
function spawnToken(a,leg,u){ const tk={agent:a.id,pr:a.pr,leg,u:u||0,obj:null}; tokens.push(tk); if(theme) attachToken(tk); return tk; }
function attachToken(tk){ tk.obj = theme.makeToken(tk.pr, tk.agent); theme.root.add(tk.obj); }
AG.bob.until = 3.5; AG.bob.atGate = true; AG.bob.token = spawnToken(AG.bob,'gate',1);
AG.alice.until = 9;

function nextFor(a){
  let t = TASKS.find(x=>x.col==='todo' && x.owner===a.id) || TASKS.find(x=>x.col==='todo');
  if(!t){ t={id:'P3-T'+(nextTask++),title:POOL[poolI++%POOL.length],owner:a.id,col:'todo'}; TASKS.push(t); }
  t.owner=a.id; t.col='progress'; a.taskId=t.id; a.phase='working'; a.until=simT+9+Math.random()*4; a.atGate=false; a.nextStep=simT+1.5;
  setState(a,'working'); say(a,'> '+t.id+' '+t.title.toLowerCase(),'cmd'); log(a.name+' started '+t.id+', '+t.title); dirty.plan=true;
}
function devTick(a,dt){
  a.spend += (a.state==='working'?0.004:0.0006)*dt*10;
  if(a.phase==='working'){
    if(simT>a.nextStep){ say(a,STEPS[Math.floor(Math.random()*STEPS.length)]); a.nextStep=simT+1.6+Math.random()*1.4; }
    if(simT>a.until){ a.pr=nextPR++; a.phase='waiting'; task(a.taskId).col='review'; dirty.plan=true; setState(a,'waiting'); say(a,'gh pr create  #'+a.pr); say(a,'waiting for CodeRabbit review','wait'); log(a.name+' opened PR #'+a.pr); a.token=spawnToken(a,'toGate',0); }
  } else if(a.phase==='waiting'){
    if(a.atGate && simT>a.until){ a.phase='passed'; setState(a,'passed'); say(a,'review passed, 0 blocking comments','ok'); log('CodeRabbit passed #'+a.pr); a.token.leg='toMain'; a.token.u=0; }
  }
}
function tokenTick(dt){
  for(let i=tokens.length-1;i>=0;i--){
    const tk=tokens[i]; const a=AG[tk.agent];
    if(tk.leg==='toGate'){ tk.u+=dt/3.2; if(tk.u>=1){ tk.u=1; tk.leg='gate'; a.atGate=true; a.until=simT+5; log('CodeRabbit is reviewing #'+tk.pr); if(theme) theme.setGate(true,tk.pr); } }
    else if(tk.leg==='toMain'){ tk.u+=dt/2.6; if(tk.u>=1){ tokens.splice(i,1); if(tk.obj){ theme.root.remove(tk.obj); disposeTree(tk.obj); } task(a.taskId).col='done'; dirty.plan=true; log('#'+tk.pr+' merged into main'); setState(a,'idle'); a.phase='idle'; a.until=simT+1.5; if(theme) theme.setGate(tokens.some(t=>t.leg==='gate'), null); } }
  }
  if(theme){ for(const tk of tokens){ if(!tk.obj) continue; const curve = tk.leg==='toMain' ? theme.routes.main : theme.routes[tk.agent]; const u=Math.min(Math.max(tk.u,0),1); const p=curve.getPointAt(u); const off = tk.leg==='gate' ? (tk.agent==='bob'?-.35:.35) : 0; tk.obj.position.set(p.x+off*.3,p.y,p.z+off); if(theme.orient){ const tg=curve.getTangentAt(Math.min(u,.999)); tk.obj.lookAt(p.x+tg.x,p.y,p.z+tg.z); } } }
}
let johnUntil=0;
function johnTick(){
  const j=AG.john;
  if(j.state==='working' && simT>johnUntil){ j.question=QUESTIONS[(++qI)%QUESTIONS.length]; setState(j,'input'); say(j,'? '+j.question,'ask'); log('John needs input'); }
  if(j.state==='working' && simT>j.nextStep){ say(j, ['checking merge order','reading PR #'+(nextPR-1),'updating plan.md','assigning next task'][Math.floor(Math.random()*4)]); j.nextStep=simT+2.4; }
}
function answerJohn(){ const j=AG.john; if(j.state!=='input') return; setState(j,'working'); say(j,'owner: approved','ok'); log('You answered John: approved'); johnUntil=simT+16; j.nextStep=simT+1; }
function simTick(dt){
  simT+=dt; tokenTick(dt);
  for(const id of ['bob','alice']){ const a=AG[id]; if(a.phase==='idle'){ if(simT>a.until) nextFor(a); } else devTick(a,dt); }
  johnTick(); if(AG.john.state==='input' && simT>johnUntil+22){ answerJohn(); }
}

/* ===================== renderer / camera ===================== */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,.1,300);
const orbit={target:V(0,0,0),r:30,theta:0,phi:1,goal:{target:V(0,0,0),r:30,theta:0,phi:1}};
let composer=null, bloomPass=null;
try{ if(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass){ composer=new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene,camera)); bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.45,.78); composer.addPass(bloomPass); } }catch(e){ composer=null; }
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); if(composer){ composer.setPixelRatio(Math.min(devicePixelRatio,2)); composer.setSize(w,h); } }
addEventListener('resize',resize); resize();
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY}; orbit.goal.theta-=dx*.005; orbit.goal.phi=Math.min(1.42,Math.max(.25,orbit.goal.phi-dy*.004)); });
addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); orbit.goal.r=Math.min(70,Math.max(6,orbit.goal.r*(1+e.deltaY*.001))); },{passive:false});
addEventListener('keydown',e=>{ if(e.key==='Escape') resetCam(); });

/* ===================== shared drawing ===================== */
function drawTerminal(t,a,st){
  const {ctx,c}=t; const w=c.width,h=c.height;
  ctx.fillStyle=st.bg; ctx.fillRect(0,0,w,h);
  if(st.scan){ ctx.fillStyle='rgba(140,255,155,0.05)'; for(let y=0;y<h;y+=4) ctx.fillRect(0,y,w,1); }
  const pad=st.pad||22, fs=st.size||26;
  ctx.font=`${st.headWeight||500} ${fs*.8}px ${st.font}`; ctx.fillStyle=st.dim; ctx.textBaseline='top';
  ctx.fillText(st.header(a),pad,pad);
  ctx.fillStyle=st.rule||st.dim; ctx.fillRect(pad,pad+fs*1.1,w-pad*2,2);
  ctx.font=`${fs}px ${st.font}`;
  const lh=fs*1.25, maxLines=Math.floor((h-pad*2-fs*3.6)/lh);
  const lines=a.lines.slice(-maxLines);
  let y=pad+fs*1.6;
  for(const l of lines){ ctx.fillStyle = l.kind==='cmd'?st.cmd : l.kind==='ask'?st.colors.input : l.kind==='wait'?st.colors.waiting : l.kind==='ok'?st.colors.passed : st.fg; ctx.fillText(l.text.slice(0,st.maxChars||40),pad,y); y+=lh; }
  const sc=st.colors[a.state]; ctx.fillStyle=sc; ctx.fillRect(0,h-fs*1.7,w,fs*1.7);
  ctx.fillStyle=st.barText||'#111'; ctx.font=`600 ${fs*.85}px ${st.font}`; ctx.fillText(st.stateLabel[a.state]||a.state, pad, h-fs*1.35);
  const sp='$'+a.spend.toFixed(2); ctx.fillText(sp, w-pad-ctx.measureText(sp).width, h-fs*1.35);
  t.tex.needsUpdate=true;
}
function drawPlan(t,st){
  const {ctx,c}=t; const w=c.width,h=c.height;
  ctx.fillStyle=st.bg; ctx.fillRect(0,0,w,h);
  if(st.grid){ ctx.strokeStyle=st.grid; ctx.lineWidth=1; for(let x=0;x<w;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();} for(let y=0;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();} }
  if(st.scan){ ctx.fillStyle='rgba(140,255,155,0.05)'; for(let y=0;y<h;y+=4) ctx.fillRect(0,y,w,1); }
  const pad=36; ctx.textBaseline='top';
  ctx.fillStyle=st.title; ctx.font=`${st.titleWeight||700} ${st.titleSize||44}px ${st.titleFont||st.font}`; ctx.fillText(st.heading,pad,pad);
  const done=TASKS.filter(x=>x.col==='done').length;
  ctx.font=`${st.size*.9}px ${st.font}`; ctx.fillStyle=st.dim; const pr=done+' of '+TASKS.length+' done'; ctx.fillText(pr,w-pad-ctx.measureText(pr).width,pad+8);
  const cols=[['todo',st.colNames[0]],['progress',st.colNames[1]],['review',st.colNames[2]],['done',st.colNames[3]]];
  const top=pad+(st.titleSize||44)+28, cw=(w-pad*2-24*3)/4;
  cols.forEach(([key,name],i)=>{
    const x=pad+i*(cw+24); ctx.fillStyle=st.dim; ctx.font=`600 ${st.size*.85}px ${st.font}`; ctx.fillText(name,x,top);
    ctx.fillStyle=st.rule; ctx.fillRect(x,top+st.size*1.1,cw,2);
    let y=top+st.size*1.6;
    const items=TASKS.filter(x=>x.col===key).slice(-6);
    for(const it of items){ const ch=st.size*2.5; if(st.card){ ctx.fillStyle=st.card; rr(ctx,x,y,cw,ch,st.cardR||0); ctx.fill(); }
      if(st.cardLine){ ctx.strokeStyle=st.cardLine; ctx.lineWidth=2; rr(ctx,x,y,cw,ch,st.cardR||0); ctx.stroke(); }
      ctx.fillStyle=st.ownerColor[it.owner]; ctx.fillRect(x,y,st.cardR?0:6,ch);
      ctx.fillStyle=st.fg; ctx.font=`500 ${st.size*.8}px ${st.font}`; ctx.fillText(it.title.slice(0,20),x+16,y+st.size*.35);
      ctx.fillStyle=st.dim; ctx.font=`${st.size*.68}px ${st.font}`; ctx.fillText(it.id+'  '+it.owner,x+16,y+st.size*1.35);
      y+=ch+12; }
  });
  t.tex.needsUpdate=true;
}

      beamPivot.rotation.y=t*(gateBusy?1.6:.5); lamp.material.emissiveIntensity=gateBusy?1.3+.5*Math.sin(t*6):.9;
      for(const tk of tokens){ if(tk.obj){ tk.obj.position.y+=Math.sin(t*2.5+tk.pr)*.05; tk.obj.rotation.z=Math.sin(t*2+tk.pr)*.06; } } }
  };
}

/* ===================== THEME: Factory Floor ===================== */
function buildFactory(){
  const root=new THREE.Group();

  ft.tex.wrapS=ft.tex.wrapT=THREE.RepeatWrapping; ft.tex.repeat.set(18,18); ft.tex.needsUpdate=true;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({map:ft.tex,roughness:.95})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; root.add(floor);
  const ym=new THREE.MeshBasicMaterial({color:C.yellow});
  [[0,-7.4,26,.18],[0,7.4,26,.18],[-13,0,.18,15],[13,0,.18,15]].forEach(([x,z,w,d])=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),ym); m.rotation.x=-Math.PI/2; m.position.set(x,.01,z); root.add(m); });
  const bt=ct(64,64); { const x=bt.ctx; x.fillStyle='#262626'; x.fillRect(0,0,64,64); x.fillStyle='#3E3E3E'; x.fillRect(0,0,14,64); } bt.tex.wrapS=bt.tex.wrapT=THREE.RepeatWrapping; bt.tex.needsUpdate=true;
  const belts=[];
  function belt(x1,z1,x2,z2){ const L=Math.hypot(x2-x1,z2-z1); const g=new THREE.Group(); g.position.set((x1+x2)/2,0,(z1+z2)/2); g.rotation.y=-Math.atan2(z2-z1,x2-x1); root.add(g);
    g.add(mesh(new THREE.BoxGeometry(L,.42,1.0),std(0x4A4D52,{metalness:.3}),0,.21,0,true));
    const tx=bt.tex.clone(); tx.needsUpdate=true; tx.repeat.set(L/.45,1); const top=new THREE.Mesh(new THREE.PlaneGeometry(L,.86),new THREE.MeshStandardMaterial({map:tx,roughness:.7})); top.rotation.x=-Math.PI/2; top.position.y=.425; g.add(top); belts.push(tx);
    for(let i=-L/2+.4;i<L/2;i+=1.6){ g.add(mesh(new THREE.BoxGeometry(.1,.42,.9),std(0x2B2B2B),i,.21,0)); } }
  const hz=ct(128,128); { const x=hz.ctx; x.fillStyle='#FFC20E'; x.fillRect(0,0,128,128); x.fillStyle='#161616'; for(let i=-128;i<256;i+=40){ x.beginPath(); x.moveTo(i,0); x.lineTo(i+20,0); x.lineTo(i+20-128,128); x.lineTo(i-128,128); x.closePath(); x.fill(); } } hz.tex.wrapS=hz.tex.wrapT=THREE.RepeatWrapping; hz.tex.needsUpdate=true;
  const andons={};
  function andon(id,x,z){ root.add(mesh(new THREE.CylinderGeometry(.05,.05,2.2,8),std(0x7D8590,{metalness:.5}),x,1.1,z,true)); const L={}; [['input',0xE5321B],['waiting',0xFFB000],['working',0x24A148],['passed',0x2F6FDE]].forEach(([s,c],i)=>{ const m=mesh(new THREE.CylinderGeometry(.17,.17,.24,16),new THREE.MeshStandardMaterial({color:0x3A3A3A,emissive:c,emissiveIntensity:0,transparent:true,opacity:.95}),x,2.35+(3-i)*.26,z); m.userData.c=c; root.add(m); L[s]=m; }); root.add(mesh(new THREE.CylinderGeometry(.18,.18,.06,16),std(0x161616),x,3.4,z)); andons[id]=L; }
  function label(text,sub,x,y,z,w){ const s=sprite(620,170,w||3.6,(ctx,W,H)=>{ ctx.fillStyle='#161616'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#FFC20E'; ctx.fillRect(0,0,16,H); ctx.fillStyle='#FFFFFF'; ctx.font='800 70px "Big Shoulders Display"'; ctx.fillText(text,40,82); ctx.fillStyle='#BDB8AE'; ctx.font='500 32px "IBM Plex Mono"'; ctx.fillText(sub,40,138); }); s.position.set(x,y,z); root.add(s); return s; }
  function crate(text){ const t=ct(128,128); const x=t.ctx; x.fillStyle='#C69C6D'; x.fillRect(0,0,128,128); x.strokeStyle='#6B4E2E'; x.lineWidth=10; x.strokeRect(5,5,118,118); x.fillStyle='#2b1d0e'; x.font='600 34px "IBM Plex Mono"'; x.textAlign='center'; x.fillText(text,64,76); t.tex.needsUpdate=true; const m=mesh(new THREE.BoxGeometry(.6,.6,.6),new THREE.MeshStandardMaterial({map:t.tex}),0,0,0,true); m.userData.t=t; return m; }
  // intake + dispatch
  belt(-13,0,-7.8,0);
  const intake=[]; for(let i=0;i<4;i++){ const c=crate(''); c.position.set(-12.2+i*1.15,.75,0); root.add(c); intake.push(c); }
  label('INTAKE','plan.md',-11,2.6,-1.6,3.2);
  const disp=mesh(new THREE.BoxGeometry(2.4,1.2,2.4),[std(0xffffff,{map:hz.tex}),std(0xffffff,{map:hz.tex}),std(0x2B2B2B),std(0x2B2B2B),std(0xffffff,{map:hz.tex}),std(0xffffff,{map:hz.tex})],-6.6,.6,0,true); root.add(disp);
  root.add(mesh(new THREE.BoxGeometry(1.2,.5,.8),std(0xEDEAE4),-6.6,1.45,0,true));
  andon('john',-5.6,-1.0); label('DISPATCH','John, lead',-6.6,4.3,0,3.4);
  // cells
  const arms={};
  const mt=ct(128,128); { const x=mt.ctx; x.clearRect(0,0,128,128); x.strokeStyle='rgba(40,40,40,.85)'; x.lineWidth=3; for(let i=0;i<=128;i+=16){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,128); x.stroke(); x.beginPath(); x.moveTo(0,i); x.lineTo(128,i); x.stroke(); } } mt.tex.wrapS=mt.tex.wrapT=THREE.RepeatWrapping; mt.tex.needsUpdate=true;
  const benchCrates={};
  function cell(id,cx,cz,name,sub){ const w=4.2,d=3.6,h=1.5;
    [[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2]].forEach(([x,z])=>root.add(mesh(new THREE.BoxGeometry(.14,h+.1,.14),std(C.yellow),cx+x,(h+.1)/2,cz+z,true)));
    const fm=()=>{ const t=mt.tex.clone(); t.needsUpdate=true; return t; };
    function panel(pw,x,z,ry){ const t=fm(); t.repeat.set(pw/.5,h/.5); const m=new THREE.Mesh(new THREE.PlaneGeometry(pw,h),new THREE.MeshStandardMaterial({map:t,transparent:true,alphaTest:.2,side:THREE.DoubleSide,color:0x555555})); m.position.set(cx+x,h/2,cz+z); m.rotation.y=ry; root.add(m); }
    panel(w,0,-d/2,0); panel(w,0,d/2,0); const sw=(d-1.3)/2; panel(sw,-w/2,-d/2+sw/2,Math.PI/2); panel(sw,-w/2,d/2-sw/2,Math.PI/2); panel(sw,w/2,-d/2+sw/2,Math.PI/2); panel(sw,w/2,d/2-sw/2,Math.PI/2);
    root.add(mesh(new THREE.BoxGeometry(1.8,.8,.9),std(0x8F959E,{metalness:.4}),cx-.3,.4,cz+.7,true));
    const bc=crate(''); bc.position.set(cx-.6,1.1,cz+.7); root.add(bc); benchCrates[id]=bc;
    const arm=new THREE.Group(); arm.position.set(cx+.9,0,cz+.6); root.add(arm);
    arm.add(mesh(new THREE.CylinderGeometry(.3,.36,.3,16),std(C.orange),0,.15,0,true));
    const j1=new THREE.Group(); j1.position.y=.3; arm.add(j1); const a1=mesh(new THREE.BoxGeometry(.18,1.0,.18),std(C.orange),0,.5,0,true); j1.add(a1);
    const j2=new THREE.Group(); j2.position.y=1.0; j1.add(j2); j2.add(mesh(new THREE.BoxGeometry(.14,.8,.14),std(0xE8E2D6),0,.4,0,true)); j2.rotation.z=1.2;
    arms[id]={arm,j1,j2};
    const tank=mesh(new THREE.CylinderGeometry(.45,.45,1.3,20),std(0x2F6FDE,{metalness:.3,roughness:.4}),cx+1.4,.65,cz-1.0,true); root.add(tank);
    root.add(mesh(new THREE.SphereGeometry(.45,20,10,0,TAU,0,Math.PI/2),std(0x2F6FDE,{metalness:.3,roughness:.4}),cx+1.4,1.3,cz-1.0));
    const tl=sprite(300,70,1.4,(ctx,W,H)=>{ ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#161616'; ctx.font='600 40px "IBM Plex Mono"'; ctx.fillText('db:'+id,16,50); }); tl.position.set(cx+1.4,2.2,cz-1.0); root.add(tl);
    andon(id,cx-w/2+.3,cz-d/2+.3); label(name,sub,cx,3.9,cz,3.6);
  }
  cell('bob',-1,-3.6,'CELL A','Bob, sandbox'); cell('alice',-1,3.6,'CELL B','Alice, sandbox');
  belt(-6.6,-1.2,-6.6,-3.6); belt(-6.6,-3.6,-3.1,-3.6); belt(-6.6,1.2,-6.6,3.6); belt(-6.6,3.6,-3.1,3.6);
  belt(1.1,-3.6,3.4,-3.6); belt(3.4,-3.6,3.4,0); belt(1.1,3.6,3.4,3.6); belt(3.4,3.6,3.4,0); belt(3.4,0,5.3,0); belt(6.6,0,8.6,0);
  // QA scanner
  const qa=new THREE.Group(); qa.position.set(5.95,0,0); root.add(qa);
  qa.add(mesh(new THREE.BoxGeometry(.35,2.3,.35),std(0x161616),0,1.15,-.85,true), mesh(new THREE.BoxGeometry(.35,2.3,.35),std(0x161616),0,1.15,.85,true), mesh(new THREE.BoxGeometry(.5,.4,2.05),std(0x161616),0,2.3,0,true), mesh(new THREE.BoxGeometry(.9,.42,1.0),std(0x4A4D52),0,.21,0,true));
  const laser=mesh(new THREE.BoxGeometry(.04,.04,1.6),new THREE.MeshBasicMaterial({color:0xFF3B1F}),-.2,1,0); qa.add(laser);
  const sheet=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.5),new THREE.MeshBasicMaterial({color:0xFF5A1F,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false})); sheet.rotation.y=Math.PI/2; sheet.position.set(-.2,1,0); qa.add(sheet);
  andon('gate',6.6,-1.3); label('QA SCAN','CodeRabbit',5.95,4.2,0,3.2);
  // shipping
  const ship=mesh(new THREE.BoxGeometry(2.6,2.8,4.4),std(0x161616),10.3,1.4,0,true); root.add(ship);
  const shipLights=[]; for(let i=0;i<3;i++){ const m=new THREE.Mesh(new THREE.PlaneGeometry(1.4,.22),new THREE.MeshBasicMaterial({color:0x24A148})); m.rotation.y=-Math.PI/2; m.position.set(8.99,.8+i*.6,-1.2+i*1.2); root.add(m); shipLights.push(m); }
  andon('ship',8.9,2.5); andons.ship.working.material.emissiveIntensity=1.6; andons.ship.working.material.color.set(0x24A148);
  label('SHIP','main, InstaCloud',10.3,4.0,0,3.2);
  const y=.78;
  const routes={ bob:poly([V(1.1,y,-3.6),V(3.4,y,-3.6),V(3.4,y,0),V(5.95,y,0)]), alice:poly([V(1.1,y,3.6),V(3.4,y,3.6),V(3.4,y,0),V(5.95,y,0)]), main:poly([V(5.95,y,0),V(9.0,y,0)]) };
  function lamp(id,s){ const L=andons[id]; if(!L) return; for(const k in L){ const on = k===s || (s==='passed'&&k==='passed'); L[k].material.emissiveIntensity=on?1.6:0; L[k].material.color.set(on?L[k].userData.c:0x3A3A3A); } }
  function refreshCrates(){ const todo=TASKS.filter(t=>t.col==='todo').slice(0,4); intake.forEach((c,i)=>{ c.visible=!!todo[i]; if(todo[i]){ const x=c.userData.t.ctx; x.fillStyle='#C69C6D'; x.fillRect(0,0,128,128); x.strokeStyle='#6B4E2E'; x.lineWidth=10; x.strokeRect(5,5,118,118); x.fillStyle='#2b1d0e'; x.font='600 34px "IBM Plex Mono"'; x.textAlign='center'; x.fillText(todo[i].id.slice(3),64,76); c.userData.t.tex.needsUpdate=true; } });
    ['bob','alice'].forEach(id=>{ const a=AG[id], c=benchCrates[id]; c.visible=a.phase==='working'; const x=c.userData.t.ctx; x.fillStyle='#C69C6D'; x.fillRect(0,0,128,128); x.strokeStyle='#6B4E2E'; x.lineWidth=10; x.strokeRect(5,5,118,118); x.fillStyle='#2b1d0e'; x.font='600 34px "IBM Plex Mono"'; x.textAlign='center'; x.fillText((a.taskId||'').slice(3),64,76); c.userData.t.tex.needsUpdate=true; }); }
  return {
    root, routes, colors, agentPos:{john:V(-6.6,1,0),bob:V(-1,1,-3.6),alice:V(-1,1,3.6)},

    makeToken(pr){ const g=new THREE.Group(); const c=crate('#'+pr); c.position.y=0; g.add(c); return g; },
    update(t,dt){ belts.forEach(b=>b.offset.x-=dt*.9); laser.position.y=.6+(Math.sin(t*(gateBusy?4:1.2))*.5+.5)*1.4; sheet.position.y=laser.position.y; laser.visible=sheet.visible=gateBusy;
      for(const id in arms){ const w=AG[id].phase==='working'; const A=arms[id]; A.arm.rotation.y += w? Math.sin(t*2)*.02 : 0; A.j1.rotation.z = w? -.4+Math.sin(t*3+(id==='bob'?0:1))*.35 : -.2; A.j2.rotation.z = w? 1.2+Math.sin(t*4)*.3 : 1.4; }

      shipLights.forEach((m,i)=>m.material.color.setHSL(.38,.64,.36+.08*Math.sin(t*2+i))); }

/* ===================== theme switching ===================== */
const BUILDERS={neon:buildNeon,mission:buildMission,archipelago:buildArchipelago,factory:buildFactory};
function setTheme(name){
  if(!BUILDERS[name]) name='neon';
  if(theme){ scene.remove(theme.root); disposeTree(theme.root); for(const tk of tokens) tk.obj=null; }
  scene.background=null; scene.fog=null;
  theme=BUILDERS[name](); scene.add(theme.root);
  camera.fov=theme.fov||32; camera.updateProjectionMatrix();
  for(const tk of tokens) attachToken(tk);
  ORDER.forEach(id=>{ theme.setState(id,AG[id].state); theme.drawScreen(AG[id]); });
  theme.setGate(tokens.some(t=>t.leg==='gate'), (tokens.find(t=>t.leg==='gate')||{}).pr);
  theme.drawPlan();
  const c=theme.cam; orbit.goal.target.copy(c.target); orbit.goal.r=c.r; orbit.goal.theta=c.theta; orbit.goal.phi=c.phi; orbit.target.copy(c.target); orbit.r=c.r*1.25; orbit.theta=c.theta-.25; orbit.phi=c.phi;
  document.body.dataset.theme=name;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===name)));
  try{ history.replaceState(null,'','#'+name); }catch(e){}
  dirty.team=dirty.feed=true;
}
addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(BUILDERS[h] && h!==document.body.dataset.theme) setTheme(h); });
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setTheme(b.dataset.theme); });

/* ===================== HUD ===================== */
const teamEl=document.getElementById('team'), feedEl=document.getElementById('feedList');
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renderTeam(){
  teamEl.innerHTML=ORDER.map(id=>{ const a=AG[id]; const lab=theme.stateLabel[a.state]; const col=theme.stateColor[a.state];
    const t=a.id==='john' ? (a.state==='input'? a.question : 'Planning and merge order') : (a.taskId+' '+((task(a.taskId)||{}).title||''));
    const sbx=a.id==='john'?'sandbox-john':'sandbox-'+a.id;
    return `<button type="button" class="card panel" data-id="${id}" aria-label="Focus ${esc(a.name)}"><div class="row"><div><div class="name">${esc(a.name)}</div><div class="role">${esc(a.role)}</div></div><span class="badge" style="--sc:${col}">${esc(lab)}</span></div><div class="task">${esc(t)}</div><div class="meta"><span>${sbx}</span><span>$${a.spend.toFixed(2)}</span></div>${a.id==='john'&&a.state==='input'?'<div class="answer"><span data-act="approve">Approve</span></div>':''}</button>`; }).join('');
}
teamEl.addEventListener('click',e=>{ if(e.target.closest('[data-act="approve"]')){ answerJohn(); return; } const c=e.target.closest('.card'); if(c) focus(c.dataset.id); });
function renderFeed(){ feedEl.innerHTML=feed.slice(0,6).map(f=>`<li><time>${f.t}</time><span>${esc(f.text)}</span></li>`).join(''); }

/* ===================== loop ===================== */
const clock=new THREE.Clock(); let screenT=0, teamT=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05); const t=clock.elapsedTime;
  simTick(dt);
  screenT+=dt; if(screenT>.25){ screenT=0; ORDER.forEach(id=>{ const a=AG[id]; if(a.screenDirty){ a.screenDirty=false; theme.drawScreen(a); } }); if(dirty.plan){ dirty.plan=false; theme.drawPlan(); } }
  teamT+=dt; if(teamT>1){ teamT=0; dirty.team=true; }
  if(dirty.team){ dirty.team=false; renderTeam(); }
  if(dirty.feed){ dirty.feed=false; renderFeed(); }
  theme.update(t,dt);
  camTick(dt); if(theme.bloom && composer) composer.render(dt); else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
const fontsReady = document.fonts ? Promise.race([Promise.all(['26px "IBM Plex Mono"','700 40px "Barlow Condensed"','40px VT323','800 40px "Bricolage Grotesque"','500 30px "DM Mono"','800 40px "Big Shoulders Display"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,2500))]) : Promise.resolve();
fontsReady.then(()=>{ const start=(location.hash||'').slice(1); setTheme(BUILDERS[start]?start:'neon'); document.getElementById('loading').remove(); requestAnimationFrame(frame); });
})();
</script>
