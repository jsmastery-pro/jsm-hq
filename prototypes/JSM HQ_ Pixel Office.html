<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JSM HQ: Pixel Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------
     Tokens: a warm "cozy management game" palette (PICO-8 flavoured)
  ------------------------------------------------------------------ */
  :root {
    --ink: #241a2e;
    --cream: #fff6e9;
    --cream-2: #f0dfc2;
    --cream-3: #e2cba6;
    --muted: #7d6b73;
    --navy: #1d2b53;
    --navy-2: #16213f;
    --blue: #29adff;
    --red: #ff004d;
    --orange: #ffa300;
    --green: #00e436;
    --lav: #83769c;
    --yellow: #ffec27;
    --grass: #4a8f3d;
    --ui: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
    --term: "VT323", ui-monospace, Menlo, Consolas, monospace;
    --gutter: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--grass); color: var(--ink); font-family: var(--ui); }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; outline: none; }
  button { font: inherit; color: inherit; }

  /* Chunky game panel: ink outline, light bevel, hard drop shadow (no blur) */
  .panel {
    background: var(--cream);
    border: 3px solid var(--ink);
    box-shadow: inset -3px -3px 0 var(--cream-2), inset 3px 3px 0 #fff, 0 4px 0 rgba(36, 26, 46, 0.45);
  }
  .panel.dark {
    background: rgba(29, 43, 83, 0.94);
    color: var(--cream);
    box-shadow: inset -3px -3px 0 rgba(0,0,0,0.25), inset 3px 3px 0 rgba(255,255,255,0.08), 0 4px 0 rgba(36, 26, 46, 0.45);
  }
  .btn {
    cursor: pointer; border: 3px solid var(--ink); background: var(--cream); padding: 2px 10px; font-weight: 600;
    box-shadow: inset -2px -2px 0 var(--cream-3), 0 3px 0 var(--ink); transition: transform 0.06s;
  }
  .btn:hover { background: #fff; }
  .btn:active { transform: translateY(3px); box-shadow: inset -2px -2px 0 var(--cream-3), 0 0 0 var(--ink); }

  /* ------------------------------------------------------------------
     Top bar
  ------------------------------------------------------------------ */
  #topbar { position: fixed; top: 10px; left: var(--gutter); right: var(--gutter); height: 50px; z-index: 10;
    display: flex; align-items: center; gap: 14px; padding: 0 12px; pointer-events: none; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .logo { width: 30px; height: 30px; flex: none; image-rendering: pixelated; }
  .brand b { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
  .brand .proj { font-size: 17px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .proj em { font-style: normal; color: var(--ink); font-weight: 600; }
  .spacer { flex: 1; }
  .sandbox { display: flex; align-items: center; gap: 8px; padding: 3px 10px; background: var(--navy); color: var(--cream); border: 3px solid var(--ink); font-size: 16px; white-space: nowrap; }
  .sandbox svg { width: 18px; height: 18px; }
  .led { width: 8px; height: 8px; background: var(--green); box-shadow: 0 0 0 2px var(--ink); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ------------------------------------------------------------------
     Party (team) cards
  ------------------------------------------------------------------ */
  #party { position: fixed; top: 74px; left: var(--gutter); width: 262px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
  .card { position: relative; display: grid; grid-template-columns: 46px 1fr; gap: 4px 10px; padding: 8px 10px 10px; cursor: pointer; text-align: left; width: 100%; }
  .card:hover { transform: translate(-1px, -1px); }
  .card.focused::before { content: "▶"; position: absolute; left: -16px; top: 18px; font-size: 14px; color: var(--ink); animation: nudge 0.6s steps(2) infinite; }
  @keyframes nudge { 50% { transform: translateX(3px); } }
  .portrait { grid-row: span 2; width: 46px; height: 46px; background: var(--navy); border: 3px solid var(--ink); image-rendering: pixelated; }
  .card-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .card-top b { font-size: 18px; }
  .card-top span { font-size: 14px; color: var(--muted); }
  .chip { justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 0 6px 1px; border: 2px solid var(--ink); background: var(--c); color: var(--ink); white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; background: var(--ink); }
  .chip[data-state="input"] { animation: blink 0.5s steps(1) infinite; }
  .task { grid-column: 1 / -1; font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .tid { font-family: var(--term); font-size: 17px; color: var(--muted); margin-right: 4px; }
  .task.none { color: var(--muted); }
  .bar { grid-column: 1 / -1; position: relative; height: 10px; border: 2px solid var(--ink); background: var(--cream-2); margin-top: 2px; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--c); width: 0; transition: width 0.25s steps(6); }
  .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 14px, var(--ink) 14px 16px); opacity: 0.35; }

  /* ------------------------------------------------------------------
     Activity log (chat box)
  ------------------------------------------------------------------ */
  #log { position: fixed; left: var(--gutter); bottom: var(--gutter); width: 262px; padding: 8px 10px 6px; z-index: 10; pointer-events: none; }
  .log-title { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #b9c3e6; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  #logList { list-style: none; margin: 0; padding: 0; font-family: var(--term); font-size: 18px; line-height: 1; }
  #logList li { padding: 2px 0 3px; animation: pop 0.35s steps(3); border-top: 1px dashed rgba(185, 195, 230, 0.15); }
  #logList li:first-child { border-top: 0; }
  #logList time { color: #7f8bb5; margin-right: 6px; }
  #logList .pr { color: var(--yellow); }
  @keyframes pop { from { transform: translateX(-8px); opacity: 0; } }

  #topbar .hint { color: var(--muted); font-size: 14px; white-space: nowrap; }
  #topbar kbd { font-family: var(--term); font-size: 16px; border: 2px solid var(--ink); padding: 0 4px; background: #fff; }
  .zoom { display: flex; gap: 6px; pointer-events: auto; }
  .zoom .btn { width: 32px; height: 30px; padding: 0; font-size: 20px; line-height: 1; }

  #tip { position: fixed; z-index: 30; pointer-events: none; padding: 2px 8px; font-size: 14px; background: var(--cream); border: 2px solid var(--ink); box-shadow: 0 3px 0 rgba(36,26,46,0.45); transform: translate(14px, 16px); display: none; white-space: nowrap; }

  /* ------------------------------------------------------------------
     Terminal (opens when you click an agent)
  ------------------------------------------------------------------ */
  #terminal { position: fixed; top: 74px; right: var(--gutter); bottom: var(--gutter); width: min(540px, 44vw); z-index: 20; display: flex; flex-direction: column;
    transform: translateX(calc(100% + 40px)); transition: transform 0.35s steps(7); }
  #terminal.open { transform: none; }
  .term-head { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 10px; border-bottom: 3px solid var(--ink); }
  .term-head canvas { width: 32px; height: 32px; background: var(--navy); border: 2px solid var(--ink); image-rendering: pixelated; }
  .term-head .title { flex: 1; min-width: 0; }
  .term-head .title b { display: block; font-size: 17px; }
  .term-head .title span { font-family: var(--term); font-size: 17px; color: var(--muted); }
  .term-body { flex: 1; overflow-y: auto; background: var(--navy-2); color: #dfe6ff; font-family: var(--term); font-size: 20px; line-height: 1.12; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; scrollbar-width: thin; scrollbar-color: #3b4a7a transparent; }
  .welcome { border: 2px dashed #ff77a8; padding: 4px 10px 6px; margin-bottom: 10px; color: #ffd0e2; }
  .welcome span { color: #9aa6d1; }
  .k-prompt { color: #fff6e9; background: #2c3b6b; padding: 0 4px; display: inline-block; margin-top: 6px; }
  .k-tool .dot { color: var(--green); } .k-tool { color: #eef2ff; }
  .k-out { color: #8d99c4; } .k-ok { color: #6cf08a; } .k-err { color: #ff5c86; } .k-warn { color: #ffc14d; }
  .k-think { color: #c9b6ff; } .k-say { color: #dfe6ff; } .k-dim { color: #66729f; }
  .tl { animation: type 0.3s steps(12); }
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .term-foot { background: var(--navy-2); border-top: 3px solid var(--ink); padding: 8px 12px 10px; color: #dfe6ff; font-family: var(--term); font-size: 20px; }
  .status { display: flex; gap: 8px; color: #8d99c4; }
  .status[data-state="working"] { color: #7fd0ff; } .status[data-state="waiting"] { color: #ffc14d; } .status[data-state="passed"] { color: #6cf08a; }
  .prompt { margin-top: 6px; border: 2px solid #3b4a7a; padding: 2px 8px; color: #8d99c4; }
  .cursor { display: inline-block; width: 10px; height: 18px; background: #dfe6ff; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  .ask { border: 2px solid var(--red); background: rgba(255, 0, 77, 0.1); padding: 6px 10px 8px; }
  .ask .q { color: #ffd0dc; margin-bottom: 6px; }
  .ask .q b { color: #ff5c86; font-weight: 400; }
  .ask button { display: block; width: 100%; text-align: left; background: none; border: 0; color: #dfe6ff; font-family: var(--term); font-size: 20px; padding: 1px 4px; cursor: pointer; }
  .ask button::before { content: "  "; white-space: pre; }
  .ask button:hover, .ask button:focus-visible { background: #2c3b6b; color: var(--yellow); outline: none; }
  .ask button:hover::before, .ask button:focus-visible::before { content: "▶ "; }

  /* ------------------------------------------------------------------
     Board modal (plan wall + PR board)
  ------------------------------------------------------------------ */
  #modal { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; padding: var(--gutter); background: rgba(36, 26, 46, 0.55); }
  #modal.open { display: grid; }
  .modal-card { width: min(1080px, 100%); max-height: 100%; display: flex; flex-direction: column; animation: drop 0.25s steps(5); }
  @keyframes drop { from { transform: translateY(-16px); opacity: 0; } }
  .modal-head { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 16px; border-bottom: 3px solid var(--ink); }
  .modal-head h2 { margin: 0; font-size: 22px; flex: 1; }
  .modal-head h2 small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 8px; }
  .modal-body { overflow: auto; padding: 16px; }

  .board { background: #f7f3ea; border: 3px solid var(--ink); box-shadow: inset 0 -6px 0 #d8d0c0; padding: 12px; display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 12px; }
  .col h3 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; border-bottom: 3px solid var(--c); padding-bottom: 2px; }
  .note { position: relative; background: var(--c); border: 2px solid var(--ink); padding: 6px 8px 7px; margin-bottom: 10px; box-shadow: 0 3px 0 rgba(36,26,46,0.35); transform: rotate(var(--r, 0deg)); }
  .note::before { content: ""; position: absolute; top: -6px; left: calc(50% - 12px); width: 24px; height: 8px; background: rgba(255, 246, 233, 0.75); border: 1px solid rgba(36,26,46,0.25); }
  .note .id { font-family: var(--term); font-size: 17px; }
  .note .t { font-size: 15px; font-weight: 600; line-height: 1.15; }
  .note .o { font-size: 13px; margin-top: 4px; display: flex; justify-content: space-between; }
  .note.done { background: #e8e1d2; color: var(--muted); }
  .note.done .t { text-decoration: line-through; }

  .quests { display: flex; flex-direction: column; gap: 10px; }
  .gate-row { display: flex; flex-wrap: wrap; gap: 16px; font-size: 16px; margin-bottom: 4px; }
  .gate-row b { font-weight: 700; }
  .quest { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; background: #fff; border: 3px solid var(--ink); padding: 8px 12px; box-shadow: 0 3px 0 rgba(36,26,46,0.35); }
  .quest .num { font-family: var(--term); font-size: 28px; }
  .quest .t { font-size: 17px; font-weight: 600; }
  .quest .meta { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .quest .meta i { width: 10px; height: 10px; background: var(--c); border: 2px solid var(--ink); }
  .stamp { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border: 3px solid var(--c); color: var(--c); padding: 1px 8px; transform: rotate(-4deg); white-space: nowrap; background: #fff; filter: saturate(1.2) brightness(0.85); }
  .empty { text-align: center; color: var(--muted); padding: 30px; font-size: 18px; }

  /* ------------------------------------------------------------------
     Small screens
  ------------------------------------------------------------------ */
  @media (max-width: 1180px) { #topbar .hint { display: none; } }
  @media (max-height: 760px) and (min-width: 761px) { #logList li:nth-child(n+5) { display: none; } }
  @media (max-width: 760px) {
    :root { --gutter: 10px; }
    #topbar { height: 44px; top: 8px; }
    .brand b { font-size: 18px; }
    .brand .proj { font-size: 14px; }
    .sandbox .long, .sandbox .word, .brand .proj { display: none; }
    #topbar { gap: 8px; padding: 0 8px; }
    .sandbox { padding: 2px 8px; }
    #party { top: 62px; left: 0; right: 0; width: auto; flex-direction: row; overflow-x: auto; padding: 0 var(--gutter) 8px 22px; scrollbar-width: none; }
    #party::-webkit-scrollbar { display: none; }
    .card { min-width: 220px; }
    .card .bar { display: none; }
    #log { left: var(--gutter); right: var(--gutter); width: auto; }
    #logList li:nth-child(n+4) { display: none; }
    #topbar .hint { display: none; }
    #logList li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #terminal { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 55vh; transform: translateY(calc(100% + 40px)); }
    .board { grid-template-columns: repeat(4, 78vw); }
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Pixel-art view of the JSM HQ office"></canvas>

<!-- ============================== HUD ============================== -->
<header id="topbar" class="panel">
  <div class="brand">
    <svg class="logo" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="1" width="8" height="8" fill="#241a2e"/><rect x="2" y="2" width="6" height="6" fill="#29adff"/>
      <rect x="3" y="3" width="1" height="2" fill="#fff6e9"/><rect x="6" y="3" width="1" height="2" fill="#fff6e9"/>
      <rect x="3" y="6" width="4" height="1" fill="#1d2b53"/><rect x="4" y="0" width="2" height="1" fill="#ffec27"/>
    </svg>
    <b>JSM HQ</b><span class="proj">— Project: <em>Askwell</em></span>
  </div>
  <div class="spacer"></div>
  <span class="hint">Drag to pan · scroll to zoom · click agents &amp; boards · <kbd>Esc</kbd></span>
  <div class="zoom"><button class="btn" id="zoomOut" aria-label="Zoom out">−</button><button class="btn" id="zoomIn" aria-label="Zoom in">+</button></div>
  <div class="sandbox" title="Each agent runs in its own isolated sandbox">
    <svg viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="2" width="7" height="6" fill="#ffa300"/><rect x="1" y="2" width="7" height="2" fill="#ffd27a"/>
      <rect x="4" y="2" width="1" height="6" fill="#ab5236"/><rect x="0" y="1" width="9" height="1" fill="#fff6e9"/>
    </svg>
    <span><b id="sbCount">3</b><span class="word"> sandboxes</span><span class="long"> running</span></span><i class="led"></i>
  </div>
</header>

<section id="party" aria-label="Team"></section>

<section id="log" class="panel dark" aria-label="Activity log" aria-live="polite">
  <div class="log-title"><i class="led"></i>Activity</div>
  <ul id="logList"></ul>
</section>

<div id="tip"></div>

<aside id="terminal" class="panel" aria-label="Agent terminal">
  <div class="term-head">
    <canvas id="termFace" width="16" height="16"></canvas>
    <div class="title"><b id="termName">Bob</b><span id="termPath">bob@sandbox-bob ~/askwell</span></div>
    <button class="btn" id="termClose" aria-label="Close terminal">✕</button>
  </div>
  <div class="term-body" id="termBody"></div>
  <div class="term-foot" id="termFoot"></div>
</aside>

<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-card panel">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="btn" id="modalClose" aria-label="Close">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   0. PALETTE, CONFIG, UTILITIES
===================================================================== */
const C = {
  ink: '#241a2e',
  grass: '#4a8f3d', grassD: '#3d7a34', grassL: '#62a84a',
  path: '#d9c49a', pathD: '#bfa57a',
  wood: '#c98e5b', woodD: '#b37a4a', woodL: '#d8a06c', woodLine: '#94603a',
  wall: '#4f7a6e', wallD: '#41675c', wallL: '#5f8b7e', wallTop: '#2c3d42', wallTopL: '#4a5d61', base: '#6b4a3a',
  wallSrv: '#3e4a5e', wallSrvD: '#323d50',
  carpetJ: '#8e3b46', carpetJD: '#742f39', carpetB: '#3e5f8a', carpetBD: '#334f75', carpetA: '#b5893a', carpetAD: '#9a7230',
  rugG: '#5f8f52', rugGD: '#4e7a43', rugP: '#7a5a8e', rugPD: '#664a78',
  tileL: '#e9dcc6', tileD: '#d3c3a8',
  grate: '#4f4a52', grateD: '#3b373e', grateL: '#625c66',
  part: '#8b9bb4', partD: '#6b7a94', partCap: '#c9d1de',
  desk: '#b97a4b', deskD: '#8a5a3b', deskDD: '#5e3a26',
  metal: '#c2c3c7', metalL: '#e4e3ea', metalD: '#8e8a96', metalDD: '#5f5a66',
  screen: '#111d35', bezel: '#3a3f55',
  leaf: '#38b764', leafD: '#257953', leafL: '#73d36b', pot: '#b5523b', potD: '#8a3b2a',
  belt: '#3a3640', beltL: '#57525e', rail: '#9d98a6',
  cork: '#c48a52', corkD: '#9b6638',
  sky: '#8fd3ff', skyN: '#1d2b53', cloud: '#ffffff',
  couch: '#3f7f8f', couchD: '#2f5f6b',
  red: '#ff004d', orange: '#ffa300', yellow: '#ffec27', green: '#00e436', blue: '#29adff', lav: '#83769c',
  pink: '#ff77a8', peach: '#ffccaa', white: '#fff1e8', navy: '#1d2b53',
  rabbit: '#ff7a30', rabbitD: '#d9541e', gold: '#ffcf3a',
};

// Agent states: colour + emote. Colours are shared by the HUD and the world.
const STATE = {
  working: { label: 'Working',            color: C.blue,   dim: '#1d6fb8' },
  input:   { label: 'Needs input',        color: C.red,    dim: '#7e0f33' },
  waiting: { label: 'Waiting for review', color: C.orange, dim: '#a86a00' },
  passed:  { label: 'Review passed',      color: C.green,  dim: '#00873a' },
  idle:    { label: 'Idle',               color: C.lav,    dim: '#5a5170' },
};

// Tile map: 40×27 tiles of 16px, with a 3-tile lawn around the building.
const TS = 16, MAP_W = 40, MAP_H = 27, MARGIN = 3;
const OX = MARGIN * TS, OY = MARGIN * TS;
const WORLD_W = (MAP_W + MARGIN * 2) * TS, WORLD_H = (MAP_H + MARGIN * 2) * TS;
const tc = t => t * TS + 8;   // tile → centre pixel (building-local)

// The team. Tile positions are building-local.
const AGENTS = [
  { id: 'john',  name: 'John',  role: 'Lead',      body: '#ff77a8', shade: '#c2477a', hi: '#ffd0e2', seat: [15, 7],  coffee: [22, 5], lead: true },
  { id: 'bob',   name: 'Bob',   role: 'Developer', body: '#29adff', shade: '#1a6fc4', hi: '#c4ecff', seat: [6, 19],  coffee: [21, 5], drop: [6, 23],  help: [5, 19],  cubX: 3 },
  { id: 'alice', name: 'Alice', role: 'Developer', body: '#ffd23a', shade: '#d48a1a', hi: '#fff4b8', seat: [15, 19], coffee: [23, 5], drop: [15, 23], help: [14, 19], cubX: 12 },
];
AGENTS.forEach((a, i) => (a.idx = i));
const byId = Object.fromEntries(AGENTS.map(a => [a.id, a]));
const john = byId.john, devs = [byId.bob, byId.alice];
const PLAN_SPOT = [6, 4];

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* Simulation clock + scheduler (sim time pauses with the tab). */
const TIME_SCALE = clamp(+new URLSearchParams(location.search).get('speed') || 1, 0.1, 30);   // e.g. ?speed=3

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function box(g, x, y, w, h, fill, outline = C.ink) { rect(g, x, y, w, h, outline); rect(g, x + 1, y + 1, w - 2, h - 2, fill); }
function disc(g, cx, cy, r, c) { g.fillStyle = c; for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy)); g.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
function ellipse(g, cx, cy, rx, ry, c) { g.fillStyle = c; for (let dy = -ry; dy <= ry; dy++) { const w = Math.round(rx * Math.sqrt(1 - (dy * dy) / (ry * ry))); g.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
function line(g, x0, y0, x1, y1, c) {
  g.fillStyle = c; x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  for (;;) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 > -dy) { err -= dy; x0 += sx; } if (e2 < dx) { err += dx; y0 += sy; } }
}

/** Builds a canvas from rows of characters; each char maps to a palette colour ('.' = clear). */
function sprite(rows, pal) {
  const c = makeCanvas(rows[0].length, rows.length), g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}
function flip(src) { const c = makeCanvas(src.width, src.height), g = c.getContext('2d'); g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c; }

const textCache = new Map();
function textSprite(str, color) {
  str = String(str).toUpperCase();
  const key = str + '|' + color;
  if (textCache.has(key)) return textCache.get(key);
  const c = makeCanvas(Math.max(1, str.length * 4 - 1), 5), g = c.getContext('2d');

function findPath(sx, sy, tx, ty) {
  const start = sy * MAP_W + sx, goal = ty * MAP_W + tx;
  if (start === goal) return [];
  const prev = new Int32Array(MAP_W * MAP_H).fill(-1);
  const q = [start]; prev[start] = start;
  for (let i = 0; i < q.length; i++) {
    const cur = q[i]; if (cur === goal) break;
    const cx = cur % MAP_W, cy = (cur / MAP_W) | 0;
    for (const [dx, dy] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      const ni = ny * MAP_W + nx;
      if (prev[ni] !== -1 || (!walk[ni] && ni !== goal)) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  if (prev[goal] === -1) return [];
  const path = [];
  for (let c = goal; c !== start; c = prev[c]) path.push([c % MAP_W, (c / MAP_W) | 0]);
  return path.reverse();
}

class Bot {
  constructor(a) { this.a = a; this.x = tc(a.seat[0]); this.y = tc(a.seat[1]); this.path = []; this.face = 'up'; this.seated = true; this.carry = null; this.emote = null; }
  tile() { return [Math.round((this.x - 8) / TS), Math.round((this.y - 8) / TS)]; }
  goTo([tx, ty], cb) {
    const [sx, sy] = this.tile();
    this.path = findPath(sx, sy, tx, ty).map(([x, y]) => [tc(x), tc(y)]);
    this.seated = false; this.onArrive = cb;
    if (!this.path.length) { this.onArrive = null; cb?.(); }
  }
  sit() { this.seated = true; this.face = 'up'; }
  update(dt) {
    if (!this.path.length) return;
    const [px, py] = this.path[0], dx = px - this.x, dy = py - this.y, d = Math.hypot(dx, dy), step = 72 * dt;
    if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) this.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (d <= step) {
      this.x = px; this.y = py; this.path.shift();
      if (!this.path.length) { const cb = this.onArrive; this.onArrive = null; cb?.(); }
    } else { this.x += (dx / d) * step; this.y += (dy / d) * step; }
  }
}

function setState(a, s) { a.state = s; a.stateSince = simTime; markDirty('team'); }
function moveTask(task, col) { task.col = col; task.enteredAt = simTime; markDirty('plan'); }

/** Asks a human-style question. Developers get a visit from John; John's own questions go to the owner. */
function askInput(a, question, onResolved) {
  const id = ++inputSeq;
  a.pendingInput = { id, ...question, onResolved };
  setState(a, 'input');
  say(a, '⏺ I need input before continuing:', 'warn');
  say(a, `  ? ${question.q}`, 'warn');
  question.opts.forEach((o, i) => say(a, `    ${i + 1}. ${o}`, 'dim'));
  log(`${a.name} needs input`, C.red);
  if (a === john) after(rand(4, 6), () => resolveInput(a, id, 'Owner', 0));
  else { johnJobs.push({ agent: a, id }); after(18, () => resolveInput(a, id, 'Owner', 0)); }
}

function resolveInput(a, id, by, idx) {
  const p = a.pendingInput;
  if (!p || p.id !== id) return;
  a.pendingInput = null;
  say(a, `> ${by}: ${p.opts[idx]}`, 'prompt');
  log(`${by} answered ${a.name}: “${p.opts[idx]}”`, C.pink);
  if (by === 'John') say(john, `⏺ Answered ${a.name}: ${p.opts[idx]}`, 'say');
  p.onResolved();
}

/** Opens (or re-submits) a PR: the robot carries a parcel to the conveyor belt. */
function devOpenPR(a) {
  let pr = a.fixing;
  if (pr) { a.fixing = null; pr.status = 'queued'; say(a, '⏺ Bash(git push)', 'tool'); say(a, `  ⎿  Pushed fixes to #${pr.num}`, 'out'); log(`${a.name} pushed fixes to #${pr.num}`, C.orange); }
  else {
    const task = a.task;
    pr = { num: nextPR++, title: task.title, agent: a, task, status: 'queued', rounds: 0 };
    prs.push(pr); task.pr = pr.num; moveTask(task, 'review');
    say(a, `⏺ Bash(gh pr create --title "${task.id}: ${task.title}")`, 'tool');
    say(a, `  ⎿  github.com/jsm/askwell/pull/${pr.num}`, 'out');
    log(`${a.name} opened PR #${pr.num}`, C.orange);
  }
  say(a, `◷ Waiting for CodeRabbit to review #${pr.num}…`, 'dim');
  markDirty('prs');
  setState(a, 'waiting');
  const pkg = { pr, mode: 'carried', s: 0, admitted: false, scanned: false };
  packages.push(pkg);
  a.bot.carry = pkg;
  a.bot.goTo(a.drop, () => {
    a.bot.face = 'down';
    after(0.35, () => {
      pkg.mode = 'belt'; pkg.s = tc(a.drop[0]) - BELT.x0; a.bot.carry = null;
      a.bot.goTo(a.seat, () => a.bot.sit());
    });
  });
}

  a.task = null; setState(a, 'idle'); say(a, '✻ Idle — waiting for the next task', 'dim');
  if (chance(0.5)) {
    a.bot.goTo(a.coffee, () => {
      a.bot.face = 'up'; a.bot.emote = { type: 'coffee', until: simTime + 2.6 }; brewing = simTime + 2.6;
      after(2.6, () => a.bot.goTo(a.seat, () => { a.bot.sit(); after(0.8, () => devStartNext(a)); }));
    });
  } else after(rand(1.2, 2.2), () => devStartNext(a));
}

// ---- John (lead): plans tasks, answers questions, keeps the office moving
function johnUpdate() {
  if (john.busy || john.state === 'input') return;
  for (let i = johnJobs.length - 1; i >= 0; i--) { const j = johnJobs[i]; if (j.agent.pendingInput?.id !== j.id) johnJobs.splice(i, 1); }
  if (johnJobs.length) return johnAnswer(johnJobs.shift());
  const needy = devs.find(d => tasks.filter(t => t.owner === d.id && t.col === 'todo').length < 2);
  if (needy) return johnPlan(needy);
  if (simTime < john.nextThink || john.job) return;
  const r = Math.random(), bot = john.bot;
  if (r < 0.12) {
    john.task = { title: 'Scope check with the owner' };
    askInput(john, pick(JOHN_QUESTIONS), () => { setState(john, 'working'); john.nextThink = simTime + 1; });
  } else if (r < 0.66) {
    john.task = { title: pick(['Reviewing the Phase 3 plan', 'Checking sandbox health', 'Reading PR summaries', 'Updating the roadmap']) };
    say(john, `> ${john.task.title}`, 'prompt');
    setState(john, 'working');
    john.job = { dur: rand(4, 7), elapsed: 0, onDone: () => (john.nextThink = simTime + 0.5) };
  } else if (r < 0.8) {
    john.busy = true; john.task = { title: 'Coffee break' }; setState(john, 'idle');
    bot.goTo(john.coffee, () => {
      bot.face = 'up'; bot.emote = { type: 'coffee', until: simTime + 2.4 }; brewing = simTime + 2.4;
      after(2.4, () => bot.goTo(john.seat, () => { bot.sit(); john.busy = false; john.nextThink = simTime + 1; }));
    });
  } else { john.task = null; setState(john, 'idle'); john.nextThink = simTime + rand(3, 5); }
}

function johnAnswer(job) {
  const dev = job.agent, bot = john.bot;
  john.busy = true; john.job = null;
  john.task = { title: `Helping ${dev.name}` }; setState(john, 'working');
  say(john, `> Answer ${dev.name}'s question`, 'prompt');
  const back = () => bot.goTo(john.seat, () => { bot.sit(); john.busy = false; john.nextThink = simTime + 0.5; });
  bot.goTo(dev.help, () => {
    bot.face = 'right';
    if (dev.pendingInput?.id === job.id) {
      bot.emote = { type: 'talk', until: simTime + 1.8 };
      after(1.8, () => { resolveInput(dev, job.id, 'John', 0); back(); });
    } else { bot.emote = { type: 'ok', until: simTime + 0.9 }; after(0.9, back); }
  });
}

function johnPlan(dev) {
  const bot = john.bot;
  john.busy = true; john.job = null;
  john.task = { title: `Planning work for ${dev.name}` }; setState(john, 'working');
  say(john, `> Plan the next task for ${dev.name}`, 'prompt');
  bot.goTo(PLAN_SPOT, () => {
    bot.face = 'up';
    after(1.4, () => {
      const t = addTask(dev);
      say(john, `⏺ TaskCreate(${t.id}: "${t.title}", owner: ${dev.id})`, 'tool'); say(john, '  ⎿  Added to TODO', 'ok');
      log(`John planned ${t.id} · ${t.title} for ${dev.name}`, C.pink);
      after(0.4, () => bot.goTo(john.seat, () => { bot.sit(); john.busy = false; john.nextThink = simTime + 0.5; }));
    });
  });
}

function addTask(owner) {
  const t = { id: `P3-T${String(nextTaskNum++).padStart(2, '0')}`, title: TASK_POOL[poolIdx++ % TASK_POOL.length], owner: owner.id, col: 'todo', enteredAt: simTime, born: simTime };
  tasks.push(t); markDirty('plan');
  return t;
}

/** Per-frame agent bookkeeping: work progress, mid-task questions, fake tool output. */
function updateAgents(dt) {
  for (const a of AGENTS) {
    a.bot.update(dt);
    const j = a.job;
    if (j && a.state === 'working' && a.bot.seated) {
      j.elapsed += dt;
      if (j.inputAt && !j.asked && j.elapsed / j.dur >= j.inputAt) { j.asked = true; askInput(a, pick(DEV_QUESTIONS), () => setState(a, 'working')); }
      else if (j.elapsed >= j.dur) { a.job = null; j.onDone(); }
    }
    if (a.state === 'working' && a.bot.seated && a.task && simTime >= a.nextStep) {
      const [first, second] = a === john ? johnStep(a) : devStep(a);
      say(a, first[1], first[0]);
      if (second) after(rand(0.25, 0.55), () => { if (a.state === 'working') say(a, second[1], second[0]); });
      a.nextStep = simTime + rand(0.9, 1.7);
    }
  }
  johnUpdate();
}

// ---- Conveyor belt + review gate ---------------------------------------
const BELT = { x0: 32, y: 392, xc: 520, yEnd: 112, speed: 26 };
BELT.hLen = BELT.xc - BELT.x0; BELT.end = BELT.hLen + (BELT.y - BELT.yEnd);
const GATE_E = GATE.x0 - 6 - BELT.x0;              // where parcels wait to enter
const GATE_C = (GATE.x0 + GATE.x1) / 2 - BELT.x0;   // scanning position
const gate = { mode: 'idle', modeAt: 0, busy: null, cooldown: 0 };
let brewing = 0, mainPulse = 0;

function beltPos(s) { return s <= BELT.hLen ? [BELT.x0 + s, BELT.y] : [BELT.xc, BELT.y - (s - BELT.hLen)]; }
function setGate(mode) { gate.mode = mode; gate.modeAt = simTime; markDirty('prs'); }

function updatePackages(dt) {
  const onBelt = packages.filter(p => p.mode === 'belt').sort((a, b) => b.s - a.s);
  onBelt.forEach((p, i) => {
    let limit = BELT.end;
    if (!p.admitted) limit = Math.min(limit, GATE_E);
    if (i > 0) limit = Math.min(limit, onBelt[i - 1].s - 11);
    p.s = Math.max(p.s, Math.min(limit, p.s + BELT.speed * dt));
    if (p.admitted && !p.scanned && p.s >= GATE_C) { p.s = GATE_C; p.mode = 'scan'; startReview(p); }
    if (p.s >= BELT.end) { p.mode = 'gone'; merge(p.pr); }
  });
  // Let the next parcel into the scanner once it's free
  if (!gate.busy && simTime >= gate.cooldown) {
    const head = onBelt.find(p => !p.admitted && p.s >= GATE_E - 0.5);
    if (head) { head.admitted = true; gate.busy = head; }
  }
  // Rejected parcels fly back to the developer's desk
  for (const p of packages) if (p.mode === 'fly') {
    p.t += dt / 1.1;
    if (p.t >= 1) { p.mode = 'gone'; spawnBurst(p.to[0], p.to[1], [C.white, C.peach], 6); }
  }
  for (let i = packages.length - 1; i >= 0; i--) if (packages[i].mode === 'gone') packages.splice(i, 1);
  if ((gate.mode === 'passed' || gate.mode === 'changes') && simTime - gate.modeAt > 1.8) setGate('idle');
}

function startReview(p) {
  p.pr.status = 'reviewing'; markDirty('prs');
  setGate('reviewing');
  log(`CodeRabbit is reviewing #${p.pr.num}`, C.rabbit);
  after(rand(3, 4.5), () => verdict(p));
}

function verdict(p) {
  const pr = p.pr, a = pr.agent;
  gate.busy = null; gate.cooldown = simTime + 1.3;
  const [gx] = beltPos(GATE_C);
  if (pr.rounds > 0 || chance(0.72)) {
    pr.status = 'approved'; markDirty('prs');
    setGate('passed');
    p.mode = 'belt'; p.scanned = true;
    setState(a, 'passed');
    say(a, `✓ CodeRabbit approved PR #${pr.num}`, 'ok');
    log(`CodeRabbit approved #${pr.num}`, C.green);
    spawnText('LGTM!', gx, 340, C.green); spawnBurst(gx, 356, [C.green, C.yellow, C.white]);
    after(3, () => devAfterPass(a));
  } else {
    const c = pick(REVIEW_COMMENTS);
    pr.status = 'changes'; pr.rounds++; markDirty('prs');
    setGate('changes');
    spawnText('FIX!', gx, 340, C.red);
    p.mode = 'fly'; p.t = 0; p.from = beltPos(GATE_C); p.to = [(a.cubX + 3) * 16 + 4, 282];
    say(a, `✗ CodeRabbit requested changes on #${pr.num}: ${c}`, 'err');
    log(`CodeRabbit requested changes on #${pr.num}`, C.red);
    a.fixing = pr; setState(a, 'working');
    say(a, `> Address the review feedback on #${pr.num}`, 'prompt');
    a.job = { dur: rand(4, 6), elapsed: 0, onDone: () => devOpenPR(a) };
  }
}

function merge(pr) {
  pr.status = 'merged'; mergedCount++;
  moveTask(pr.task, 'done');
  mainPulse = 1;
  spawnText('+1', BELT.xc, 104, C.green); spawnBurst(BELT.xc, 112, [C.green, C.yellow, C.white, C.blue], 18);
  say(pr.agent, `⏺ Merged #${pr.num} into main`, 'ok');
  log(`#${pr.num} merged into main`, C.green);
  markDirty('prs', 'plan');
  const done = tasks.filter(t => t.col === 'done').sort((x, y) => y.enteredAt - x.enteredAt);
  for (const t of done.slice(8)) tasks.splice(tasks.indexOf(t), 1);
  after(6, () => { prs.splice(prs.indexOf(pr), 1); markDirty('prs'); });
}

// ---- The office cat ----------------------------------------------------
function updateCat(dt) {
  if (cat.path.length) {
    const [px, py] = cat.path[0], dx = px - cat.x, dy = py - cat.y, d = Math.hypot(dx, dy), step = 26 * dt;
    if (Math.abs(dx) > 0.1) cat.face = dx > 0 ? 1 : -1;
    if (d <= step) { cat.x = px; cat.y = py; cat.path.shift(); if (!cat.path.length) cat.until = simTime + rand(2, 6); }
    else { cat.x += (dx / d) * step; cat.y += (dy / d) * step; }
  } else if (simTime > cat.until) {
    if (!cat.sleeping && chance(0.25)) { cat.sleeping = true; cat.until = simTime + rand(8, 14); return; }
    cat.sleeping = false;
    const sx = Math.round((cat.x - 8) / TS), sy = Math.round((cat.y - 8) / TS);
    for (let tries = 0; tries < 20; tries++) {
      const tx = clamp(sx + randi(-8, 8), 1, 29), ty = clamp(sy + randi(-6, 6), 5, 23);
      if (walk[ty * MAP_W + tx]) { cat.path = findPath(sx, sy, tx, ty).map(([x, y]) => [tc(x), tc(y)]); break; }
    }
    cat.until = simTime + 1;
  }
}

    lines.forEach((segs, i) => { for (const [x, len, c] of segs) rect(g, sx + 1 + ((x + variant * 3) % 12), sy + 1 + i * 2, len, 1, c); });
    if (Math.floor(t * 3) % 2) rect(g, sx + 1, sy + 1 + lines.length * 2, 2, 1, C.white);

}

function drawDesksLive(g, t) {
  for (const a of devs) {

  }
  drawScreen(g, john, 224, 72, t, 0); drawScreen(g, john, 250, 72, t, 1);
  // John's desk lamp shows his state

  // Coffee machine light + steam while brewing

  // Arcade attract mode

}

function drawPRBoard(g) {

/* ---- Robots, emotes, the cat ---- */
function drawEyes(g, a, x, y, face, t) {
  const st = a.state, col = st === 'input' ? C.red : st === 'passed' ? C.green : '#bff6ff';
  const blink = Math.floor(t * 10 + a.idx * 7) % 37 === 0;
  if (face === 'down') {
    if (st === 'passed') { for (const ex of [3, 6]) { rect(g, x + ex, y + 7, 1, 1, col); rect(g, x + ex + 1, y + 6, 1, 1, col); rect(g, x + ex + 2, y + 7, 1, 1, col); } }
    else if (st === 'idle') { rect(g, x + 3, y + 7, 2, 1, C.lav); rect(g, x + 7, y + 7, 2, 1, C.lav); }
    else { rect(g, x + 4, y + (blink ? 7 : 6), 1, blink ? 1 : 2, col); rect(g, x + 7, y + (blink ? 7 : 6), 1, blink ? 1 : 2, col); }
  } else if (face === 'right' || face === 'left') {
    rect(g, x + (face === 'right' ? 8 : 3), y + (blink ? 7 : 6), 1, blink ? 1 : 2, col);
  }
}
function antennaColor(a, t) {
  const st = STATE[a.state];
  if (a.state === 'input') return Math.floor(t * 6) % 2 ? st.color : st.dim;
  if (a.state === 'working') return Math.floor(t * 2) % 2 ? st.color : '#9ddcff';
  return st.color;
}
function drawRobot(g, bot, t) {
  const a = bot.a, moving = bot.path.length > 0;
  const hover = 3 + (Math.floor(t * (moving ? 6 : 2.5) + a.idx) % 2);
  const x = Math.round(bot.x) - 6, y = Math.round(bot.y) - 13 - hover;
  ellipse(g, Math.round(bot.x), Math.round(bot.y) + 1, 4, 1, 'rgba(36,26,46,0.3)');
  let spr = a.spr.front;
  if (bot.face === 'up') spr = bot.seated && a.state === 'working' && Math.floor(t * 8) % 2 ? a.spr.type : a.spr.back;
  else if (bot.face === 'right') spr = a.spr.side;
  else if (bot.face === 'left') spr = a.spr.sideL;
  g.drawImage(spr, x, y);
  rect(g, x + 5, y + 1, 2, 1, antennaColor(a, t));
  drawEyes(g, a, x, y, bot.face, t);
  if (moving && Math.floor(t * 12) % 2) rect(g, x + 5, y + 14, 2, 1, C.orange);   // thruster flicker
  if (bot.carry) drawPackage(g, bot.x, y - 2, bot.carry.pr, false);
  bot.headY = y;
}

function bubble(g, cx, y, fill = C.white) {
  const x = Math.round(cx) - 6;
  rect(g, x + 1, y, 11, 9, C.ink); rect(g, x, y + 1, 13, 7, C.ink); rect(g, x + 1, y + 1, 11, 7, fill);
  rect(g, x + 5, y + 9, 3, 1, C.ink); rect(g, x + 6, y + 10, 1, 1, C.ink); rect(g, x + 6, y + 8, 1, 1, fill);
  return x;
}
function drawEmote(g, bot, t) {
  const a = bot.a;
  if (bot.carry) return;
  let type = null;
  if (bot.emote && simTime < bot.emote.until) type = bot.emote.type;
  else if (bot.path.length) type = null;
  else if (a.state === 'input') type = 'bang';
  else if (a.state === 'waiting') type = 'wait';
  else if (a.state === 'passed') type = 'check';
  else if (a.state === 'working') type = 'dots';
  else if (a.state === 'idle') type = 'zz';
  const cx = Math.round(bot.x), top = bot.headY - 12;
  if (!type) return;
  if (type === 'zz') { const p = (t * 0.8 + a.idx * 0.3) % 1; text(g, 'Z', cx + 4 + Math.round(p * 3), top + 6 - Math.round(p * 8), C.lav); return; }
  if (type === 'bang') { const by = top - (Math.floor(t * 4) % 2); const x = bubble(g, cx, by, C.red); rect(g, x + 6, by + 2, 1, 3, C.white); rect(g, x + 6, by + 6, 1, 1, C.white); return; }
  const x = bubble(g, cx, top);
  if (type === 'dots') for (let i = 0; i < 3; i++) rect(g, x + 3 + i * 3, top + 4 - (Math.floor(t * 4) % 3 === i ? 1 : 0), 1, 1, C.blue);
  if (type === 'wait') { const c = C.orange; rect(g, x + 4, top + 2, 5, 1, c); rect(g, x + 5, top + 3, 3, 1, c); rect(g, x + 6, top + 4, 1, 1, c); rect(g, x + 5, top + 5, 3, 1, c); rect(g, x + 4, top + 6, 5, 1, c); }
  if (type === 'check') { const c = '#00a83a'; rect(g, x + 3, top + 4, 1, 1, c); rect(g, x + 4, top + 5, 1, 1, c); rect(g, x + 5, top + 6, 1, 1, c); rect(g, x + 6, top + 5, 1, 1, c); rect(g, x + 7, top + 4, 1, 1, c); rect(g, x + 8, top + 3, 1, 1, c); rect(g, x + 9, top + 2, 1, 1, c); }
  if (type === 'talk') { for (let i = 0; i < 3; i++) rect(g, x + 3 + i * 3, top + 4, 1, 1, Math.floor(t * 6) % 3 >= i ? C.ink : C.lav); }
  if (type === 'ok') text(g, 'OK', x + 3, top + 2, '#00a83a');
  if (type === 'coffee') { rect(g, x + 4, top + 3, 4, 4, C.ink); rect(g, x + 5, top + 3, 2, 1, '#7a4a2a'); rect(g, x + 8, top + 4, 1, 2, C.ink); rect(g, x + 5, top + 1 - (Math.floor(t * 4) % 2), 1, 1, C.lav); }
  if (type === 'heart') { const c = C.pink; rect(g, x + 4, top + 2, 2, 1, c); rect(g, x + 7, top + 2, 2, 1, c); rect(g, x + 3, top + 3, 7, 2, c); rect(g, x + 4, top + 5, 5, 1, c); rect(g, x + 5, top + 6, 3, 1, c); }
}

function drawNameTag(g, bot) { tag(g, bot.a.name, Math.round(bot.x), bot.headY - 9, C.ink, bot.a.body); }

function drawCat(g, t) {
  const x = Math.round(cat.x), y = Math.round(cat.y) + 4, f = cat.face, moving = cat.path.length > 0;
  const O = '#e8913a', D = '#b8642a', K = C.ink;
  const px = (dx, dy, w, h, c) => rect(g, f > 0 ? x + dx : x - dx - w + 1, y + dy, w, h, c);
  ellipse(g, x, y + 1, 5, 1, 'rgba(36,26,46,0.25)');
  if (cat.sleeping && !moving) {   // loaf
    px(-5, -4, 10, 5, K); px(-4, -3, 8, 3, O); px(-2, -3, 1, 2, D); px(0, -3, 1, 2, D);
    px(3, -6, 4, 4, K); px(4, -5, 2, 2, O); px(3, -7, 1, 1, K); px(6, -7, 1, 1, K); px(-6, -2, 2, 1, K);
    const p = (t * 0.6) % 1; text(g, 'Z', x - 2 + Math.round(p * 3), y - 12 - Math.round(p * 6), C.white);
  } else {
    const step = moving && Math.floor(t * 8) % 2;
    px(-5, -5, 9, 4, K); px(-4, -4, 7, 2, O); px(-2, -4, 1, 2, D); px(0, -4, 1, 2, D);
    px(2, -8, 5, 5, K); px(3, -7, 3, 3, O); px(2, -9, 1, 1, K); px(5, -9, 1, 1, K); px(5, -6, 1, 1, K);
    px(-6, -8, 1, 4, K); px(-7, -9, 1, 2, K);
    px(step ? -4 : -3, -1, 1, 1, K); px(step ? 2 : 1, -1, 1, 1, K);
  }
  if (simTime < cat.heartUntil) { const x0 = x - 4, y0 = y - 18 - (Math.floor(t * 4) % 2); const c = C.pink; rect(g, x0 + 1, y0, 2, 1, c); rect(g, x0 + 5, y0, 2, 1, c); rect(g, x0, y0 + 1, 8, 2, c); rect(g, x0 + 1, y0 + 3, 6, 1, c); rect(g, x0 + 2, y0 + 4, 4, 1, c); rect(g, x0 + 3, y0 + 5, 2, 1, c); }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.kind === 'px') { p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    else p.y += p.vy * dt;
  }
}
function drawParticles(g) {
  for (const p of particles) {
    if (p.kind === 'px') rect(g, Math.round(p.x), Math.round(p.y), 1, 1, p.color);
    else if (p.life > 0.15 || Math.floor(p.life * 30) % 2) { const w = textW(p.str); rect(g, Math.round(p.x - w / 2) - 2, Math.round(p.y) - 2, w + 4, 9, C.ink); text(g, p.str, p.x - w / 2, p.y, p.color); }
  }
}

/** Blinking selection brackets around the hovered thing. */
function drawSelection(g, r, t) {
  if (!r || Math.floor(t * 3) % 3 === 0) return;
  const { x, y, w, h } = r, c = C.yellow, L = 4;
  for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
    rect(g, sx > 0 ? cx - 1 : cx - L + 1, sy > 0 ? cy - 1 : cy, L, 1, c);
    rect(g, sx > 0 ? cx - 1 : cx, sy > 0 ? cy - 1 : cy - L + 1, 1, L, c);
  }
}

/** Composes the whole world for this frame. */
function renderWorld(t) {
  const g = wg;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(staticCanvas, 0, 0);
  g.translate(OX, OY);
  drawWindow(g, t); drawClock(g); drawPlanNotes(g, t);
  drawCables(g, t); drawBelt(g, t);
  for (const p of packages) if (p.mode === 'belt' || p.mode === 'scan') { const [x, y] = beltPos(p.s); if (!(x > GATE.x0 - 2 && x < GATE.x1 + 2 && y > 380)) drawPackage(g, x, y, p.pr); }
  drawGate(g, t); drawRacks(g, t); drawDesksLive(g, t); drawPRBoard(g);
  // Y-sorted actors
  const actors = AGENTS.map(a => ({ y: a.bot.y, draw: () => drawRobot(g, a.bot, t) }));
  actors.push({ y: cat.y, draw: () => drawCat(g, t) });
  for (const p of packages) if (p.mode === 'fly') {
    const e = easeInOut(Math.min(1, p.t)), x = p.from[0] + (p.to[0] - p.from[0]) * e, y = p.from[1] + (p.to[1] - p.from[1]) * e - Math.sin(e * Math.PI) * 40;
    actors.push({ y: 999, draw: () => drawPackage(g, x, y, p.pr) });
  }
  actors.sort((a, b) => a.y - b.y).forEach(o => o.draw());
  for (const a of AGENTS) { drawEmote(g, a.bot, t); if (a.bot.path.length || hovered?.agent === a) drawNameTag(g, a.bot); }
  drawParticles(g);
  drawSelection(g, hovered?.rect, t);
  g.setTransform(1, 0, 0, 1, 0, 0);
}

// Terminal panel
const termEl = $('terminal'), termBody = $('termBody'), termFoot = $('termFoot');
let termAgent = null, termSeq = 0, footSig = '';
const SPINNER = ['✻', '✢', '✳', '✶', '✳', '✢'];

function lineHTML(ln) {
  const t = esc(ln.text);
  if (ln.kind === 'tool') return `<div class="tl k-tool"><span class="dot">⏺</span>${t.replace(/^⏺/, '')}</div>`;
  if (ln.kind === 'prompt') return `<div class="tl"><span class="k-prompt">${t}</span></div>`;
  return `<div class="tl k-${ln.kind}">${t}</div>`;
}
function openTerminal(a) {
  termAgent = a;
  $('termName').textContent = `${a.name} · ${a.role}`;
  $('termPath').textContent = `${a.id}@sandbox-${a.id} ~/askwell`;
  termBody.innerHTML = `<div class="welcome">✻ Welcome to Claude Code!<br><span>cwd: /workspace/askwell · agent: ${a.name}</span></div>` + a.term.lines.map(lineHTML).join('');
  termBody.querySelectorAll('.tl').forEach(n => n.classList.remove('tl'));
  termSeq = a.term.seq; footSig = '';
  termEl.classList.add('open');
  syncTerminal();
  termBody.scrollTop = termBody.scrollHeight;
}
function closeTerminal() { termEl.classList.remove('open'); termAgent = null; }
function syncTerminal() {
  const a = termAgent; if (!a) return;
  drawPortrait($('termFace'), a);
  if (a.term.seq > termSeq) {
    const atBottom = termBody.scrollHeight - termBody.scrollTop - termBody.clientHeight < 60;
    termBody.insertAdjacentHTML('beforeend', a.term.lines.filter(l => l.seq > termSeq).map(lineHTML).join(''));
    termSeq = a.term.seq;
    while (termBody.children.length > 240) termBody.children[1].remove();
    if (atBottom) termBody.scrollTop = termBody.scrollHeight;
  }
  const sig = `${a.state}|${a.pendingInput?.id || ''}`;
  if (sig !== footSig) {
    footSig = sig;
    if (a.pendingInput) {
      const p = a.pendingInput;
      termFoot.innerHTML = `<div class="ask"><div class="q"><b>? ${esc(a.name)} needs your input</b><br>${esc(p.q)}</div>${p.opts.map((o, i) => `<button data-i="${i}">${i + 1}. ${esc(o)}</button>`).join('')}</div>`;
      termFoot.querySelectorAll('button').forEach(b => b.addEventListener('click', () => resolveInput(a, p.id, 'You', +b.dataset.i)));
    } else termFoot.innerHTML = `<div class="status" data-state="${a.state}"><span class="spin"></span><span class="txt"></span></div><div class="prompt">&gt; <span class="cursor"></span></div>`;
  }
  const spin = termFoot.querySelector('.spin'), txt = termFoot.querySelector('.txt');
  if (spin) {
    spin.textContent = a.state === 'working' ? SPINNER[Math.floor(simTime * 8) % SPINNER.length] : { waiting: '◷', passed: '✓', idle: '·' }[a.state] || '';
    txt.textContent = { working: `${a.bot.seated ? a.activity : 'Walking'}…`, waiting: 'Waiting for CodeRabbit review…', passed: 'Review passed, merging', idle: 'Idle, waiting for the next task' }[a.state] || '';
  }
}

const canvas = $('game'), sctx = canvas.getContext('2d');
let dpr = 1, focused = null, hovered = null;
const cam = { x: WORLD_W / 2, y: WORLD_H / 2, z: 2, anim: null };
const anchor = { x: innerWidth / 2, y: innerHeight / 2 };
const isNarrow = () => innerWidth <= 760;
const termWidth = () => Math.min(540, innerWidth * 0.44) + 16;

/** The part of the screen not covered by HUD panels; the camera centres there. */
function freeRegion() {
  const W = innerWidth, H = innerHeight;
  if (isNarrow()) return focused ? { x0: 0, x1: W, y0: 150, y1: H * 0.45 } : { x0: 0, x1: W, y0: 150, y1: H - 120 };
  if (focused) { const right = W - termWidth() - 14; return { x0: right - 290 > 300 ? 290 : 0, x1: right, y0: 70, y1: H }; }
  return { x0: 290, x1: W, y0: 70, y1: H };
}

/** Integer device-pixel zoom keeps every pixel square. */
function snapZoom(z) { return Math.max(1, Math.floor(z * dpr + 0.2)) / dpr; }
function fitZoom(w, h, fill = 1) { const r = freeRegion(); return snapZoom(Math.min((r.x1 - r.x0) / (w / fill), (r.y1 - r.y0) / (h / fill))); }

function overviewView() {
  let z = fitZoom(MAP_W * TS + 24, MAP_H * TS + 24);
  if (isNarrow()) z = Math.max(z, Math.ceil(1.25 * dpr) / dpr);
  return { x: OX + (MAP_W * TS) / 2, y: OY + (MAP_H * TS) / 2, z };
}
function agentRect(a) {
  if (a.lead) return { x: OX + 176, y: OY + 22, w: 144, h: 140 };
  return { x: OX + a.cubX * 16, y: OY + 248, w: 112, h: 162 };
}
function agentView(a) {
  const r = agentRect(a);
  return { x: r.x + r.w / 2, y: r.y + r.h / 2, z: Math.min(fitZoom(r.w, r.h, 0.8), 7) };
}
function flyTo(v, dur = 0.55) { cam.anim = { t: 0, dur, from: { x: cam.x, y: cam.y, z: cam.z }, to: v }; }

function focusAgent(a) {
  if (modalKind) closeModal();
  focused = a; markDirty('team');
  flyTo(agentView(a));
  openTerminal(a);
}
function unfocus() { if (!focused) return; focused = null; closeTerminal(); markDirty('team'); flyTo(overviewView()); }

function clampCam() {
  cam.x = clamp(cam.x, OX - 20, OX + MAP_W * TS + 20);
  cam.y = clamp(cam.y, OY - 20, OY + MAP_H * TS + 20);
}
function screenToWorld(sx, sy) { return [cam.x + (sx - anchor.x) / cam.z, cam.y + (sy - anchor.y) / cam.z]; }

function zoomBy(step, sx = anchor.x, sy = anchor.y) {
  const [wx, wy] = screenToWorld(sx, sy);
  const zd = clamp(Math.round(cam.z * dpr) + step, 1, 9 * dpr);
  cam.anim = null; cam.z = zd / dpr;
  cam.x = wx - (sx - anchor.x) / cam.z; cam.y = wy - (sy - anchor.y) / cam.z;
  clampCam();
}

/** Things you can hover / click, in world px. Robots first so they win over their cubicle. */
function hitTest(wx, wy) {
  const lx = wx - OX, ly = wy - OY;
  const inR = (r) => lx >= r.x && lx < r.x + r.w && ly >= r.y && ly < r.y + r.h;
  for (const a of AGENTS) { const r = { x: a.bot.x - 7, y: a.bot.y - 22, w: 14, h: 24 }; if (inR(r)) return { kind: 'agent', agent: a, rect: r, tip: `Open ${a.name}'s terminal` }; }
  const cr = { x: cat.x - 8, y: cat.y - 6, w: 16, h: 12 }; if (inR(cr)) return { kind: 'cat', rect: cr, tip: 'Pet the office cat' };
  for (const a of AGENTS) { const r = agentRect(a), lr = { x: r.x - OX, y: r.y - OY, w: r.w, h: r.h }; if (inR(lr)) return { kind: 'agent', agent: a, rect: lr, tip: `Open ${a.name}'s terminal` }; }
  const plan = { x: PLAN_BOARD.x - 3, y: PLAN_BOARD.y - 2, w: PLAN_BOARD.w + 6, h: 46 }; if (inR(plan)) return { kind: 'plan', rect: plan, tip: 'Open the plan wall' };
  const prb = { x: PR_BOARD.x, y: PR_BOARD.y, w: PR_BOARD.w, h: 66 }; if (inR(prb)) return { kind: 'prs', rect: prb, tip: 'Open the PR board' };
  const gr = { x: GATE.x0, y: 348, w: GATE.x1 - GATE.x0, h: 57 }; if (inR(gr)) return { kind: 'prs', rect: gr, tip: 'CodeRabbit review gate' };
  for (const r of RACKS) { const rr = { x: r.tx * 16, y: 21, w: 32, h: 94 }; if (inR(rr)) return { kind: 'rack', rect: rr, tip: `${r.id} sandbox server` }; }
  return null;
}

function activate(h) {
  if (!h) return;
  if (h.kind === 'agent') focusAgent(h.agent);
  else if (h.kind === 'plan' || h.kind === 'prs') openModal(h.kind);
  else if (h.kind === 'cat') { cat.heartUntil = simTime + 1.6; cat.sleeping = false; }
}

let drag = null, mouse = null;
const tip = $('tip');
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  mouse = { x: e.clientX, y: e.clientY };
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 5) drag.moved = true;
  if (drag.moved) { cam.anim = null; cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; clampCam(); }
});
canvas.addEventListener('pointerup', e => { if (drag && !drag.moved) activate(hitTest(...screenToWorld(e.clientX, e.clientY))); drag = null; });
canvas.addEventListener('pointerleave', () => { mouse = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1 : -1, e.clientX, e.clientY); }, { passive: false });
$('zoomIn').addEventListener('click', () => zoomBy(1));
$('zoomOut').addEventListener('click', () => zoomBy(-1));
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (modalKind) closeModal(); else unfocus(); }
  if (e.target === document.body || e.target === canvas) { if (e.key === '+' || e.key === '=') zoomBy(1); if (e.key === '-') zoomBy(-1); }
});

function updateHover() {
  hovered = mouse && !drag?.moved ? hitTest(...screenToWorld(mouse.x, mouse.y)) : null;
  canvas.style.cursor = drag?.moved ? 'grabbing' : hovered ? 'pointer' : 'grab';
  if (hovered && mouse) { tip.textContent = hovered.tip; tip.style.left = mouse.x + 'px'; tip.style.top = mouse.y + 'px'; tip.style.display = 'block'; }
  else tip.style.display = 'none';
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
  const v = focused ? agentView(focused) : overviewView();
  cam.anim = null; Object.assign(cam, { x: v.x, y: v.y, z: v.z });
}
addEventListener('resize', resize);

/* =====================================================================
   12. BOOT + MAIN LOOP
===================================================================== */
buildStatic();
for (const a of AGENTS) { say(a, `✻ Claude Code · sandbox-${a.id} ready`, 'think'); say(a, '⏺ Bash(git pull origin main)', 'tool'); say(a, '  ⎿  Already up to date.', 'out'); }
log('3 sandboxes started: john, bob, alice');
log('John loaded the Phase 3 plan (6 tasks)');
after(1.0, () => devStartNext(byId.bob));
after(2.6, () => devStartNext(byId.alice));
resize();

let last = performance.now(), uiTick = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05) * TIME_SCALE; last = now;
  simTime += dt;
  const t = simTime;

  runTimers();
  updateAgents(dt);
  updatePackages(dt);
  updateCat(dt);
  updateParticles(dt);
  updatePlanNotes(dt);
  mainPulse = Math.max(0, mainPulse - dt * 0.8);

  // Camera: tween, and ease the screen anchor into the free region
  if (cam.anim) {
    const A = cam.anim; A.t = Math.min(1, A.t + dt / TIME_SCALE / A.dur);
    const e = easeInOut(A.t);
    cam.x = A.from.x + (A.to.x - A.from.x) * e; cam.y = A.from.y + (A.to.y - A.from.y) * e; cam.z = A.from.z + (A.to.z - A.from.z) * e;
    if (A.t >= 1) cam.anim = null;
  }
  const r = freeRegion(), k = damp(8, dt / TIME_SCALE);
  anchor.x += ((r.x0 + r.x1) / 2 - anchor.x) * k; anchor.y += ((r.y0 + r.y1) / 2 - anchor.y) * k;
  updateHover();

  renderWorld(t);

  // Blit the world to the screen with nearest-neighbour scaling
  const s = cam.z * dpr;
  const ox = Math.round(anchor.x * dpr - cam.x * s), oy = Math.round(anchor.y * dpr - cam.y * s);
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.fillStyle = C.grass; sctx.fillRect(0, 0, canvas.width, canvas.height);
  sctx.imageSmoothingEnabled = false;
  sctx.setTransform(s, 0, 0, s, ox, oy);
  sctx.drawImage(world, 0, 0);

  // HUD
  if (dirty.team) renderParty();
  if (modalKind && (dirty.plan || dirty.prs)) renderModal();
  dirty.team = dirty.plan = dirty.prs = false;
  if (t - uiTick > 0.15) { uiTick = t; updateBars(); syncTerminal(); }
}
requestAnimationFrame(frame);
</script>
